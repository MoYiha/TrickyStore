name: "Monthly Maintenance Report"

# Monthly dependency ritual: on the 29th a report PR opens with everything
# that floated (Gradle snapshot drift, refreshed Cargo lock, open Dependabot
# PRs, wrapper status). Maintenance lands on the 1st by merging it.
# NOTE: February in non-leap years has no 29th; trigger manually if needed.
on:
  schedule:
    - cron: "0 6 29 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-maintenance
  cancel-in-progress: false

jobs:
  report:
    name: "Collect drift and open report PR"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Refresh snapshots and open report PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="gradle/resolved-versions.snapshot"
          NEW_SNAPSHOT="$(mktemp)"
          {
            echo "# AUTO-GENERATED by .github/workflows/maintenance-report.yml - do not edit by hand."
            echo "# Each line: <source> <group>:<name>=<resolved-version>"
            echo "# Only the gradle wrapper stays manual; it has no floating mechanism."
          } > "$NEW_SNAPSHOT"

          dump_direct() {
            ./gradlew "$1:dependencies" --configuration "$2" --console=plain > /tmp/deptree.txt
            awk -v src="$1:$2" '/^[+\\]--- [^ ]+:[^ ]+:[^ ]+/ {
              s = substr($0, 6)
              sub(/ \([^()]*\)$/, "", s)
              n = split(s, arrow, " -> ")
              ver = (n > 1) ? arrow[2] : ""
              split(arrow[1], coord, ":")
              if (ver == "") ver = coord[3]
              if (coord[3] != "" && ver != "") print src " " coord[1] ":" coord[2] "=" ver
            }' /tmp/deptree.txt >> "$NEW_SNAPSHOT"
          }

          dump_direct :service debugUnitTestRuntimeClasspath
          dump_direct :service debugAndroidTestRuntimeClasspath
          dump_direct :stub debugCompileClasspath
          dump_direct :encryptor-app debugUnitTestRuntimeClasspath

          ./gradlew buildEnvironment --console=plain > /tmp/buildenv.txt
          for art in org.bouncycastle:bcprov-jdk18on io.netty:netty-codec-http io.netty:netty-codec-http2 io.netty:netty-codec io.netty:netty-handler-proxy ch.qos.logback:logback-core ch.qos.logback:logback-classic com.android.tools.build:gradle org.jetbrains.kotlin:kotlin-gradle-plugin; do
            line=$(grep -m1 -F "${art}:" /tmp/buildenv.txt || true)
            if [[ -z "$line" ]]; then
              echo "::warning::buildscript artifact not listed anymore: $art"
              continue
            fi
            if [[ "$line" == *" -> "* ]]; then
              ver="${line##* -> }"
            else
              ver="${line##*:}"
            fi
            ver="${ver%% *}"
            ver="${ver%%)*}"
            echo "buildscript ${art}=${ver}" >> "$NEW_SNAPSHOT"
          done

          {
            head -n 3 "$NEW_SNAPSHOT"
            tail -n +4 "$NEW_SNAPSHOT" | LC_ALL=C sort -u
          } > /tmp/final.snapshot
          mv /tmp/final.snapshot "$NEW_SNAPSHOT"

          (cd rust && cargo update -w)

          WRAPPER_LINE="gradle wrapper: check skipped"
          CURRENT_WRAPPER=$(sed -n 's/^distributionUrl=.*gradle-\([0-9.]*\)-bin.zip/\1/p' gradle/wrapper/gradle-wrapper.properties | head -n1)
          LATEST_GRADLE=$(curl --fail --silent --show-error --location --max-time 30 https://services.gradle.org/versions/current 2>/dev/null | grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n1 | grep -o '[0-9][0-9.]*' || true)
          if [[ -n "$CURRENT_WRAPPER" && -n "$LATEST_GRADLE" ]]; then
            if [[ "$CURRENT_WRAPPER" == "$LATEST_GRADLE" ]]; then
              WRAPPER_LINE="gradle wrapper ${CURRENT_WRAPPER} is current"
            else
              WRAPPER_LINE="gradle wrapper ${CURRENT_WRAPPER} -> ${LATEST_GRADLE} available (manual update, no floating mechanism)"
            fi
          fi

          DEPENDABOT_TABLE="no open Dependabot PRs"
          DEPENDABOT_PRS=$(gh pr list --search "author:app/dependabot state:open" --json number,title --jq '.[] | "- #\(.number) \(.title)"' 2>/dev/null || true)
          if [[ -n "$DEPENDABOT_PRS" ]]; then
            DEPENDABOT_TABLE="$DEPENDABOT_PRS"
          fi

          BRANCH="chore/monthly-maintenance"
          cp rust/Cargo.lock /tmp/new-Cargo.lock
          GRADLE_DRIFT=false
          if ! cmp -s "$SNAPSHOT" "$NEW_SNAPSHOT"; then
            GRADLE_DRIFT=true
          fi
          CARGO_DRIFT=false
          if ! git diff --quiet -- rust/Cargo.lock; then
            CARGO_DRIFT=true
          fi
          if ! $GRADLE_DRIFT && ! $CARGO_DRIFT; then
            echo "No dependency drift this month."
            exit 0
          fi
          {
            echo "## Gradle snapshot drift"
            echo
            echo '```diff'
            diff -u "$SNAPSHOT" "$NEW_SNAPSHOT" | head -c 4000 || true
            echo '```'
            echo
            echo "## Cargo lock"
            echo
            echo '```'
            git diff --stat -- rust/Cargo.lock | head -n 20
            echo '```'
          } > /tmp/sections.txt
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH"
          fi
          cp "$NEW_SNAPSHOT" "$SNAPSHOT"
          cp /tmp/new-Cargo.lock rust/Cargo.lock
          git add "$SNAPSHOT" rust/Cargo.lock
          if git diff --cached --quiet; then
            echo "Report branch already up to date."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(deps): monthly maintenance snapshot"
            git push --force-with-lease origin "$BRANCH"
          fi

          BODY_FILE="$(mktemp)"
          {
            echo "Automated monthly maintenance report. Review the drift below, then do maintenance on the 1st by merging (CI validates the new resolutions)."
            echo
            cat /tmp/sections.txt
            echo
            echo "## Open Dependabot PRs"
            echo
            echo "$DEPENDABOT_TABLE"
            echo
            echo "## Wrapper"
            echo
            echo "$WRAPPER_LINE"
          } > "$BODY_FILE"
          if ! gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
            gh pr create --title "chore(deps): monthly maintenance report" --label dependencies --reviewer tryigit --assignee tryigit --body-file "$BODY_FILE"
          fi
