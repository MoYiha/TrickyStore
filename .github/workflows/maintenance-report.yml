name: "Monthly Maintenance Report"

# Read-only monthly ritual report (29th): summarizes what got updated during
# the month for review. It changes nothing itself; updating happens elsewhere
# (floating Gradle resolution, the daily cargo-update PR, Dependabot PRs).
# Maintenance lands on the 1st by merging the open update PRs.
# NOTE: February in non-leap years has no 29th; trigger manually if needed.
on:
  schedule:
    - cron: "0 6 29 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-maintenance
  cancel-in-progress: false

jobs:
  report:
    name: "Open monthly report issue"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false

      - name: Collect history and open report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MONTH_START=$(date -u +%Y-%m-01)
          MONTH_LABEL=$(date -u +%Y-%m)

          MERGED_FILES="$(mktemp)"
          git log --since="$MONTH_START" --oneline -- gradle/libs.versions.toml settings.gradle.kts rust/Cargo.toml rust/Cargo.lock rust/fuzz/Cargo.toml rust/*/Cargo.toml .github/dependabot.yml > "$MERGED_FILES" || true

          MERGED_PRS="$(mktemp)"
          gh pr list --state merged --limit 100 --json number,title,mergedAt --jq "[.[] | select(.mergedAt >= \"$MONTH_START\" + \"T00:00:00Z\") | \"- #\\(.number) \\(.title)\"] | .[]" > "$MERGED_PRS" || true

          OPEN_PRS="$(mktemp)"
          {
            gh pr list --search "author:app/dependabot state:open" --json number,title --jq '.[] | "- #\(.number) \(.title) (dependabot)"' || true
            gh pr list --head chore/cargo-update --json number,title --jq '.[] | "- #\(.number) \(.title) (cargo lock)"' || true
          } > "$OPEN_PRS" || true

          WRAPPER_LINE="gradle wrapper: check skipped"
          CURRENT_WRAPPER=$(sed -n 's/^distributionUrl=.*gradle-\([0-9.]*\)-bin.zip/\1/p' gradle/wrapper/gradle-wrapper.properties | head -n1)
          LATEST_GRADLE=$(curl --fail --silent --show-error --location --max-time 30 https://services.gradle.org/versions/current 2>/dev/null | grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n1 | grep -o '[0-9][0-9.]*' || true)
          if [[ -n "$CURRENT_WRAPPER" && -n "$LATEST_GRADLE" ]]; then
            if [[ "$CURRENT_WRAPPER" == "$LATEST_GRADLE" ]]; then
              WRAPPER_LINE="gradle wrapper ${CURRENT_WRAPPER} is current"
            else
              WRAPPER_LINE="gradle wrapper ${CURRENT_WRAPPER} -> ${LATEST_GRADLE} available (manual update)"
            fi
          fi

          DASHBOARD_LINE="no drift dashboard yet"
          DASHBOARD_NUM=$(gh issue list --label dependencies --state open --json number,title --jq '[.[] | select(.title=="Dependency drift dashboard")][0].number // empty' || true)
          if [[ -n "$DASHBOARD_NUM" ]]; then
            DASHBOARD_LINE="live drift dashboard: #${DASHBOARD_NUM}"
          fi

          BODY_FILE="$(mktemp)"
          {
            echo "# Monthly maintenance report - $MONTH_LABEL"
            echo
            echo "Review below, then do maintenance on the 1st by merging the open update PRs. This report changes nothing itself."
            echo
            echo "## Merged dependency changes this month"
            echo
            if [[ -s "$MERGED_FILES" ]]; then
              echo '```'
              cat "$MERGED_FILES"
              echo '```'
            else
              echo "no dependency file commits merged"
            fi
            echo
            echo "## Merged PRs this month"
            echo
            if [[ -s "$MERGED_PRS" ]]; then
              cat "$MERGED_PRS"
            else
              echo "none"
            fi
            echo
            echo "## Open update PRs (merge these on the 1st)"
            echo
            if [[ -s "$OPEN_PRS" ]]; then
              cat "$OPEN_PRS"
            else
              echo "none open"
            fi
            echo
            echo "## Live state"
            echo
            echo "- $DASHBOARD_LINE"
            echo "- $WRAPPER_LINE"
          } > "$BODY_FILE"

          TITLE="Monthly maintenance report - $MONTH_LABEL"
          gh issue create --title "$TITLE" --label dependencies --assignee tryigit --body-file "$BODY_FILE"
          NEW_NUM=$(gh issue list --label dependencies --state open --json number,title --jq "[.[] | select(.title==\"$TITLE\")][0].number // empty")
          OLD_OPEN=$(gh issue list --label dependencies --state open --json number,title --jq '.[] | select(.title | startswith("Monthly maintenance report")) | .number' || true)
          for num in $OLD_OPEN; do
            if [[ "$num" != "$NEW_NUM" && -n "$num" ]]; then
              gh issue comment "$num" --body "Superseded by #$NEW_NUM." || true
              gh issue close "$num" || true
            fi
          done
