name: One-off action warning fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master ]

permissions:
  contents: write

jobs:
  patch-action-warning:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}

      - name: Patch warning readability and delay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('module/template/action.sh')
          text = path.read_text(encoding='utf-8')
          original = text

          pattern = re.compile(r'(?ms)^(\s*(?:tr|zh|es|de|ru|id|hi|ar):WARNING\)|\s*en:WARNING\|\*:WARNING\))\n(.*?)(^\s*;;\s*$)')
          matches = list(pattern.finditer(text))
          if len(matches) != 9:
              raise SystemExit(f'expected 9 warning blocks, found {len(matches)}')

          def patch_block(match: re.Match[str]) -> str:
              header, body, terminator = match.group(1), match.group(2), match.group(3)
              body = body.replace("printf '%s\\n'", "printf '%s\\n\\n'")
              body = body.replace("printf '%s\n'", "printf '%s\n\n'")
              return header + '\n' + body + terminator

          text = pattern.sub(patch_block, text)

          replacements = {
              '5 saniye sonra log oluşturulacak.': '13 saniye sonra log oluşturulacak.',
              '5 秒后将生成日志。': '13 秒后将生成日志。',
              'Se generará un registro en 5 segundos.': 'Se generará un registro en 13 segundos.',
              'Ein Protokoll wird in 5 Sekunden erstellt.': 'Ein Protokoll wird in 13 Sekunden erstellt.',
              'Журнал будет создан через 5 секунд.': 'Журнал будет создан через 13 секунд.',
              'Log akan dibuat dalam 5 detik.': 'Log akan dibuat dalam 13 detik.',
              '5 सेकंड में एक लॉग जनरेट किया जाएगा।': '13 सेकंड में एक लॉग जनरेट किया जाएगा।',
              'سيتم إنشاء السجل خلال 5 ثوانٍ.': 'سيتم إنشاء السجل خلال 13 ثانية.',
              'A log will be generated in 5 seconds.': 'A log will be generated in 13 seconds.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected text: {old}')
              text = text.replace(old, new)

          if text.count('    sleep 5\n') != 1:
              raise SystemExit(f'expected exactly one sleep 5, found {text.count("    sleep 5\n")}')
          text = text.replace('    sleep 5\n', '    sleep 13\n', 1)

          if text == original:
              raise SystemExit('no changes made')
          path.write_text(text, encoding='utf-8')
          PY

          bash -n module/template/action.sh

          rm -f \
            .github/workflows/_oneoff_action_warning_fix.yml \
            .github/oneoff-action-warning-trigger \
            .github/action-warning-trigger-2 \
            .github/_action_warning_fix_trigger \
            .github/_action_warning_fix_trigger_3 \
            .github/action-warning-fix-trigger-4

          git add module/template/action.sh
          git add -A .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(action): improve warning readability and delay'
          git push origin HEAD:refs/heads/${GITHUB_HEAD_REF}
