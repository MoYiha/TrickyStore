name: Finalize Encryptor 10k contract
on:
  push:
    branches: [feat/v2.6.1-webui-zip-import]
    paths: [.github/workflows/__finalize_encryptor_contract.yml]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Finalize contracts and locales
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from xml.sax.saxutils import escape

          translations={
          'values':{
          'choose_xml':'Choose XML keybox or ZIP','xml_limit':'Single XML or ZIP · up to 10,000 keyboxes · 10 MiB per XML','encrypting':'Encrypting & saving…','security_body':'Selected keybox XML files never leave this app. XML or ZIP input is processed one keybox at a time; each CBOX is signed and encrypted locally, and atomic private-vault writes run in the bounded Rust layer.'},
          'values-tr':{
          'choose_xml':'XML keybox veya ZIP seç','xml_limit':'Tek XML veya ZIP · en fazla 10.000 keybox · XML başına 10 MiB','encrypting':'Şifreleniyor ve kaydediliyor…','security_body':'Seçilen keybox XML dosyaları bu uygulamadan çıkmaz. XML veya ZIP girdisi her seferinde tek bir keybox işlenerek yürütülür; her CBOX yerel olarak imzalanıp şifrelenir ve atomik özel kasa yazımları sınırlandırılmış Rust katmanında yapılır.'},
          'values-zh-rCN':{
          'choose_xml':'选择 XML Keybox 或 ZIP','xml_limit':'单个 XML 或 ZIP · 最多 10,000 个 Keybox · 每个 XML 10 MiB','encrypting':'正在加密并保存…','security_body':'所选 Keybox XML 文件不会离开本应用。XML 或 ZIP 会逐个 Keybox 处理；每个 CBOX 都在本地签名和加密，原子私有保险库写入由受限的 Rust 层完成。'},
          'values-es':{
          'choose_xml':'Elegir Keybox XML o ZIP','xml_limit':'XML individual o ZIP · hasta 10.000 keyboxes · 10 MiB por XML','encrypting':'Cifrando y guardando…','security_body':'Los XML de keybox seleccionados nunca salen de esta aplicación. La entrada XML o ZIP se procesa un keybox cada vez; cada CBOX se firma y cifra localmente y las escrituras atómicas de la bóveda privada se realizan en la capa Rust acotada.'},
          'values-de':{
          'choose_xml':'XML-Keybox oder ZIP wählen','xml_limit':'Einzelnes XML oder ZIP · bis zu 10.000 Keyboxes · 10 MiB pro XML','encrypting':'Wird verschlüsselt und gespeichert…','security_body':'Ausgewählte Keybox-XML-Dateien verlassen diese App nie. XML- oder ZIP-Eingaben werden Keybox für Keybox verarbeitet; jede CBOX wird lokal signiert und verschlüsselt, atomare Schreibvorgänge in den privaten Tresor laufen in der begrenzten Rust-Schicht.'},
          'values-ru':{
          'choose_xml':'Выбрать XML keybox или ZIP','xml_limit':'Один XML или ZIP · до 10 000 keybox · 10 MiB на XML','encrypting':'Шифрование и сохранение…','security_body':'Выбранные XML keybox никогда не покидают приложение. XML или ZIP обрабатывается по одному keybox; каждый CBOX локально подписывается и шифруется, а атомарная запись в приватное хранилище выполняется в ограниченном слое Rust.'},
          'values-in':{
          'choose_xml':'Pilih keybox XML atau ZIP','xml_limit':'XML tunggal atau ZIP · hingga 10.000 keybox · 10 MiB per XML','encrypting':'Mengenkripsi dan menyimpan…','security_body':'File XML keybox yang dipilih tidak pernah keluar dari aplikasi ini. Input XML atau ZIP diproses satu keybox pada satu waktu; setiap CBOX ditandatangani dan dienkripsi secara lokal, dan penulisan vault privat atomik berjalan di lapisan Rust yang dibatasi.'},
          'values-hi':{
          'choose_xml':'XML keybox या ZIP चुनें','xml_limit':'एक XML या ZIP · अधिकतम 10,000 keybox · प्रति XML 10 MiB','encrypting':'एन्क्रिप्ट और सेव किया जा रहा है…','security_body':'चुनी गई keybox XML फ़ाइलें इस ऐप से बाहर नहीं जातीं। XML या ZIP इनपुट एक समय में एक keybox के रूप में प्रोसेस होता है; हर CBOX स्थानीय रूप से साइन और एन्क्रिप्ट होता है और निजी vault की atomic writes सीमित Rust layer में होती हैं।'},
          'values-ar':{
          'choose_xml':'اختر Keybox XML أو ZIP','xml_limit':'XML منفرد أو ZIP · حتى 10,000 Keybox · 10 MiB لكل XML','encrypting':'جارٍ التشفير والحفظ…','security_body':'لا تغادر ملفات Keybox XML المحددة هذا التطبيق. تتم معالجة XML أو ZIP بمعدل Keybox واحد في كل مرة؛ ويُوقّع كل CBOX ويُشفّر محليًا، وتتم الكتابات الذرية إلى الخزنة الخاصة في طبقة Rust المحدودة.'}}

          def set_string(path,name,value):
              s=path.read_text()
              rep=f'<string name="{name}">{escape(value)}</string>'
              pat=re.compile(rf'<string name="{re.escape(name)}">.*?</string>')
              if pat.search(s): s=pat.sub(rep,s,count=1)
              else: s=s.replace('</resources>',f'    {rep}\n</resources>')
              path.write_text(s)

          for folder,items in translations.items():
              p=Path('encryptor-app/src/main/res')/folder/'strings.xml'
              if not p.is_file(): raise SystemExit(f'missing locale {folder}')
              for k,v in items.items(): set_string(p,k,v)

          # Android Keystore I/O failures are signing failures; malformed source I/O is wrapped by the UI as IllegalArgumentException.
          p=Path('encryptor-app/src/main/java/cleveres/tricky/encryptor/MobileCrypto.kt')
          s=p.read_text()
          old='''        } catch (_: IOException) {\n            return EncryptResult.INVALID_INPUT\n        } catch (_: ProviderException) {'''
          new='''        } catch (_: IOException) {\n            return EncryptResult.SIGNING_FAILURE\n        } catch (_: ProviderException) {'''
          if old not in s: raise SystemExit('MobileCrypto IOException anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('encryptor-app/src/main/java/cleveres/tricky/encryptor/VaultStore.kt')
          s=p.read_text().replace('            val base = batchBaseName(author, sourceName)','            val base = VaultStore.batchBaseName(author, sourceName)',1)
          p.write_text(s)

          p=Path('encryptor-app/src/test/java/cleveres/tricky/encryptor/MobileSecurityContractTest.kt')
          s=p.read_text()
          s=s.replace('KeyboxImportReader.read(input, selectedName, NativeCrypto::validateKeyboxXml)','KeyboxImportReader.process(')
          s=s.replace('MobileCrypto.encryptAndSaveBatch','MobileCrypto.encryptAndSaveStreaming')
          s=s.replace('VaultStore.allocateBatchFilenames','VaultStore.newBatchNameAllocator')
          s=s.replace('MAX_KEYBOX_FILES = 64','MAX_KEYBOX_FILES = 10_000')
          s=s.replace('        assertTrue(zipReader.contains("MAX_TOTAL_XML_BYTES = 48 * 1024 * 1024"))\n','')
          s=s.replace('        assertTrue(zipReader.contains("MAX_ARCHIVE_BYTES = 64 * 1024 * 1024"))\n','')
          s=s.replace('        assertTrue(zipReader.contains("selected.forEach { it.bytes.fill(0) }"))\n','        assertTrue(zipReader.contains("bytes.fill(0)"))\n        assertFalse(zipReader.contains("MutableList<SelectedKeybox>"))\n')
          s=s.replace('        assertTrue(mobileCrypto.contains("encryptAndSaveBatch"))','        assertTrue(mobileCrypto.contains("encryptAndSaveStreaming"))')
          s=s.replace('        assertTrue(vault.contains("allocateBatchFilenames"))','        assertTrue(vault.contains("newBatchNameAllocator"))\n        assertTrue(vault.contains("MAX_FILES = 10_000"))')
          s=s.replace('fun `mobile and module versions come from the same 2_6_0 root source`()','fun `mobile and module versions come from the same 2_6_1 root source`()')
          s=s.replace('assertTrue(rootBuild.contains("val verName = \\"V2.6.0\\""))','assertTrue(rootBuild.contains("val verName = \\"V2.6.1\\""))')
          p.write_text(s)
          PY
          git diff --check
      - name: Verify localized 10k contract
        shell: bash
        run: |
          set -euo pipefail
          for d in values values-tr values-zh-rCN values-es values-de values-ru values-in values-hi values-ar; do
            grep -Fq 'name="encrypting"' "encryptor-app/src/main/res/$d/strings.xml"
          done
          grep -Fq 'MAX_KEYBOX_FILES = 10_000' encryptor-app/src/main/java/cleveres/tricky/encryptor/KeyboxZipReader.kt
          grep -Fq 'MAX_FILES = 10_000' encryptor-app/src/main/java/cleveres/tricky/encryptor/VaultStore.kt
          grep -Fq 'V2.6.1' encryptor-app/src/test/java/cleveres/tricky/encryptor/MobileSecurityContractTest.kt
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/__finalize_encryptor_contract.yml
          git add encryptor-app
          git commit -m "fix(encryptor): finalize localized 10000-keybox streaming contract"
          git push origin HEAD:feat/v2.6.1-webui-zip-import
