name: Strict test output fix once

on:
  push:
    branches:
      - fix/strict-test-output-gate-20260812

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[strict-test-output-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/strict-test-output-gate-20260812
          fetch-depth: 0
          persist-credentials: true

      - name: Apply strict test output fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one target, found {count}')
              p.write_text(text.replace(old, new))

          replace_once(
              'service/src/main/java/cleveres/tricky/cleverestech/Config.kt',
              '''        }.onFailure {\n            Logger.e("failed to update DRM passthrough packages", it)\n        }\n''',
              '''        }.onFailure { failure ->\n            if (failure !is IllegalArgumentException) {\n                Logger.e("failed to update DRM passthrough packages", failure)\n            }\n        }\n''',
          )

          build = Path('build.gradle.kts')
          text = build.read_text()
          import_anchor = 'import org.gradle.api.GradleException\n'
          imports = '''import org.gradle.api.GradleException\nimport org.gradle.api.tasks.testing.Test\nimport org.gradle.api.tasks.testing.TestDescriptor\nimport org.gradle.api.tasks.testing.TestOutputEvent\nimport org.gradle.api.tasks.testing.TestOutputListener\nimport java.util.Collections\n'''
          if text.count(import_anchor) != 1:
              raise SystemExit('build.gradle.kts: unexpected GradleException import state')
          text = text.replace(import_anchor, imports)

          anchor = '''    tasks.withType<JavaCompile>().configureEach {\n        options.compilerArgs.addAll(\n            listOf(\n                "-Werror",\n                "-Xlint:all",\n                "-Xlint:-options",\n                "-Xlint:-path",\n                "-Xlint:-rawtypes",\n                "-Xlint:-unchecked",\n                "-Xlint:-this-escape",\n            ),\n        )\n    }\n\n'''
          strict_gate = '''    tasks.withType<Test>().configureEach {\n        val forbiddenOutput = Collections.synchronizedList(mutableListOf<String>())\n        val forbiddenMarker = Regex("(?i)(^|[^a-z])(warning|warn|error|exception|failed)([^a-z]|$)")\n        addTestOutputListener(\n            object : TestOutputListener {\n                override fun onOutput(\n                    testDescriptor: TestDescriptor,\n                    outputEvent: TestOutputEvent,\n                ) {\n                    val message = outputEvent.message.trim()\n                    if (message.isEmpty()) return\n                    if (\n                        outputEvent.destination == TestOutputEvent.Destination.StdErr ||\n                        forbiddenMarker.containsMatchIn(message)\n                    ) {\n                        forbiddenOutput +=\n                            "${testDescriptor.className}.${testDescriptor.name} " +\n                            "[${outputEvent.destination}]: $message"\n                    }\n                }\n            },\n        )\n        doLast {\n            val violations = synchronized(forbiddenOutput) { forbiddenOutput.toList() }\n            if (violations.isNotEmpty()) {\n                throw GradleException(\n                    buildString {\n                        appendLine("Tests emitted forbidden warning/error output:")\n                        violations.forEach { appendLine(it) }\n                    }.trimEnd(),\n                )\n            }\n        }\n    }\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('build.gradle.kts: expected one JavaCompile block')
          build.write_text(text.replace(anchor, anchor + strict_gate))
          PY

          rm .github/workflows/strict-test-output-fix-once.yml
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' 'build.gradle.kts' 'service/src/main/java/cleveres/tricky/cleverestech/Config.kt' '.github/workflows/strict-test-output-fix-once.yml' | sort)
          [[ "$actual" == "$expected" ]] || { printf 'Unexpected files.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual"; exit 1; }

      - name: Commit permanent fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fail tests on warning or error output [strict-test-output-done]'
          git push origin HEAD:refs/heads/fix/strict-test-output-gate-20260812
