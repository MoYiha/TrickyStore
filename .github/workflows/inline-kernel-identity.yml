name: Inline kernel identity native source

on:
  push:
    branches:
      - feat/v2.5.7-final
    paths:
      - .github/workflows/inline-kernel-identity.yml

permissions:
  contents: write

jobs:
  inline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v2.5.7-final
          fetch-depth: 0
      - name: Inline reviewed native implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cpp = Path('module/src/main/cpp/kernel_identity.cpp')
          header = Path('module/src/main/cpp/kernel_identity.hpp')
          binder = Path('module/src/main/cpp/binder_interceptor.cpp')
          cmake = Path('module/src/main/cpp/CMakeLists.txt')

          kernel = cpp.read_text()
          start = kernel.find('namespace cleverestricky::kernel_identity {')
          if start < 0:
              raise SystemExit('kernel namespace marker missing')
          implementation = kernel[start:].rstrip() + '\n\n'

          text = binder.read_text()
          text = text.replace('#include "kernel_identity.hpp"\n', '', 1)
          if '#include <set>\n' not in text:
              marker = '#include <shared_mutex>\n'
              if marker not in text:
                  raise SystemExit('binder include marker missing')
              text = text.replace(marker, marker + '#include <set>\n', 1)
          marker = 'struct OffsetCache {'
          if marker not in text:
              raise SystemExit('binder insertion marker missing')
          if 'namespace cleverestricky::kernel_identity {' not in text:
              text = text.replace(marker, implementation + marker, 1)
          binder.write_text(text)

          build = cmake.read_text()
          old = 'add_library(${MODULE_NAME} SHARED binder_interceptor.cpp kernel_identity.cpp)'
          new = 'add_library(${MODULE_NAME} SHARED binder_interceptor.cpp)'
          if old not in build:
              raise SystemExit('CMake native source marker missing')
          cmake.write_text(build.replace(old, new, 1))

          cpp.unlink()
          header.unlink()
          PY
          git config user.name "Yiğit"
          git config user.email "40565628+tryigit@users.noreply.github.com"
          git add -A
          git commit -m "refactor: inline kernel identity into approved native source"
          git push origin HEAD:feat/v2.5.7-final
