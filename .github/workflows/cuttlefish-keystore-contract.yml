# Experimental platform oracle: KernelSU on Cuttlefish.
#
# Why this exists:
#   The stock AVD emulator job in security-regression.yml validates AIDL and
#   framework contracts but cannot run the KernelSU/APatch runtime. This
#   workflow boots Cuttlefish (the AOSP virtual device, not the AVD emulator)
#   with a KernelSU-integrated GKI kernel so the real keystore2 attestation
#   path can be exercised under a root-capable kernel.
#
# Design rules (see AGENTS.md):
#   - Manual trigger only. This workflow is never a required merge gate and
#     must not be wired to push or pull_request.
#   - Every external action is pinned to a full commit SHA because the Build
#     workflow's quality gate rejects unpinned references across .github.
#   - Kernel builds and Cuttlefish images are large and slow; jobs are bounded
#     by explicit timeouts. The kernel tree is synced cold on purpose instead
#     of using a shared cache (see the sync step).
#   - This harness is expected to need iterative fixes on CI. It is a scaffold,
#     not a frozen contract. Do not treat a green base job as proof that the
#     module's keystore interception works; that is what the module step is for.
#
# Integrity:
#   - The KernelSU setup script is downloaded from an immutable commit and its
#     SHA-256 is verified before execution (CWE-494 mitigation).
#   - The KernelSU source commit is resolved from a pinned manifest short SHA;
#     the checkout is rejected unless it resolves to that exact commit, so a
#     silently-failing checkout inside setup.sh cannot leave the tree on an
#     unspecified branch.
#
# References:
#   - Cuttlefish get started: https://source.android.com/docs/devices/cuttlefish/get-started
#   - Custom kernel for Cuttlefish: https://source.android.com/docs/devices/cuttlefish/bootloader-dev
#   - Kernel build (GKI): https://source.android.com/docs/core/architecture/kernel/gki-release-builds
#   - KernelSU kernel integration: https://kernelsu.org/guide/how-to-build.html
#
# Known risks to validate on the first runs:
#   - KernelSU dropped official GKI image mode in v3.0; built-in integration
#     still builds but is not officially supported for every branch.
#   - KernelSU has a documented x86_64 caveat on recent kernels. Cuttlefish on
#     GitHub-hosted runners is x86_64 only, so watch for boot panics and fall
#     back to LKM mode (Ylarod/ddk) if the built-in path is unstable.
#   - The Cuttlefish image and the GKI kernel must come from the same branch so
#     the KMI matches.

name: Cuttlefish Keystore Contract (experimental)

on:
  # Strictly manual: no inputs. Dispatch-time inputs are treated as untrusted
  # by workflow security analysis (cache keys, download URLs, shell), so every
  # parameter lives below as a pinned constant instead. New Android or kernel
  # releases are adopted by editing this file, never at dispatch time.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuttlefish-keystore-contract-${{ github.ref }}
  cancel-in-progress: false

# Pinned provenance and harness parameters. Everything the harness downloads
# or executes is derived from these constants. There are deliberately no
# workflow_dispatch inputs: untrusted dispatch-time values must never reach
# cache keys, download URLs, or shell. Bump these constants to adopt a new
# Android release, GKI branch, Cuttlefish host tag, or KernelSU revision.
env:
  CF_ANDROID_BRANCH: "aosp-android17-release"
  CF_ANDROID_DEVICE: "aosp_cf_x86_64_only_phone"
  CF_GKI_BRANCH: "common-android17-6.18"
  CF_INSTALL_MODULE: "false"
  KERNELSU_SETUP_COMMIT: "33d0c9205df47b6b1b61c25c13afa164b88871d1"
  KERNELSU_SETUP_SHA256: "7bacc8eb765e43f00bc751c41d72e727ba8dcbf22b9cdfad5849ebbcc8af0c1e"
  KERNELSU_SOURCE_SHA: "33d0c9205df47b6b1b61c25c13afa164b88871d1"

jobs:
  gki-kernelsu:
    name: "Build KernelSU GKI kernel"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Install kernel build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates python3 python3-pip rsync \
            uuid-dev libssl-dev bc flex bison zip unzip
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"

      - name: Sync GKI kernel source
        # Deliberately no actions/cache here. A shared kernel-tree cache would
        # give this dispatch-triggered oracle default-branch cache write
        # access while it also executes downloaded and compiled code, which is
        # exactly the cache-poisoning shape workflow security analysis flags.
        # This oracle runs rarely and manually, so every run syncs cold. That
        # also removes an entire class of stale-cache build failures.
        shell: bash
        env:
          GKI_BRANCH: ${{ env.CF_GKI_BRANCH }}
        run: |
          set -euo pipefail
          mkdir -p kernelsu-gki
          cd kernelsu-gki
          if [ ! -d .repo ]; then
            repo init -u https://android.googlesource.com/kernel/manifest -b "$GKI_BRANCH" --depth=1
          fi
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle

      - name: Integrate KernelSU into the kernel tree
        shell: bash
        run: |
          set -euo pipefail
          cd kernelsu-gki
          # Fetch setup.sh from an immutable commit and verify its digest before
          # execution. This prevents a compromised mutable ref from altering the
          # oracle build (CWE-494).
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/${KERNELSU_SETUP_COMMIT}/kernel/setup.sh" -o "$RUNNER_TEMP/setup.sh"
          printf '%s  %s\n' "$KERNELSU_SETUP_SHA256" "$RUNNER_TEMP/setup.sh" | sha256sum -c -
          # setup.sh clones tiann/KernelSU and checks out KERNELSU_SOURCE_SHA.
          bash "$RUNNER_TEMP/setup.sh" "$KERNELSU_SOURCE_SHA"
          # setup.sh swallows checkout failures with `|| echo`; enforce that the
          # resolved commit is exactly the pinned one rather than trusting it.
          if [ -d "common/KernelSU/.git" ]; then
            head="$(git -C common/KernelSU rev-parse HEAD)"
          elif [ -d "KernelSU/.git" ]; then
            head="$(git -C KernelSU rev-parse HEAD)"
          else
            echo "::error::KernelSU checkout not found after setup.sh"
            exit 1
          fi
          if [ "$head" != "$KERNELSU_SOURCE_SHA" ]; then
            echo "::error::KernelSU checkout resolved to $head, expected $KERNELSU_SOURCE_SHA"
            exit 1
          fi
          echo "$head" > "$RUNNER_TEMP/kernelsu.commit"
          echo "KernelSU integrated at $head"

      - name: Build x86_64 GKI kernel
        shell: bash
        run: |
          set -euo pipefail
          cd kernelsu-gki
          tools/bazel build --config=fast //common:kernel_x86_64_dist

      - name: Collect kernel artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd kernelsu-gki
          mkdir -p "$RUNNER_TEMP/kernel-dist"
          bzimage=$(find . -path '*/dist/bzImage' -type f -print -quit)
          if [ -z "$bzimage" ]; then
            echo "::error::Could not locate the built bzImage"
            find . -name bzImage -print || true
            exit 1
          fi
          cp "$bzimage" "$RUNNER_TEMP/kernel-dist/bzImage"
          initramfs=$(find . -path '*/dist/initramfs.img' -type f -print -quit || true)
          if [ -n "$initramfs" ]; then
            cp "$initramfs" "$RUNNER_TEMP/kernel-dist/initramfs.img"
          fi
          cp "$RUNNER_TEMP/kernelsu.commit" "$RUNNER_TEMP/kernel-dist/kernelsu.commit" 2>/dev/null || true
          sha256sum "$RUNNER_TEMP/kernel-dist/"* > "$RUNNER_TEMP/kernel-dist/SHA256SUMS"
          cat "$RUNNER_TEMP/kernel-dist/SHA256SUMS"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gki-kernelsu-x86_64
          path: ${{ runner.temp }}/kernel-dist
          if-no-files-found: error
          retention-days: 7

  cuttlefish-contract:
    name: "Boot KernelSU Cuttlefish and verify keystore path"
    needs: gki-kernelsu
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Download kernel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Pin to the current run explicitly: the artifact is produced by the
          # gki-kernelsu job above, never by another run or branch.
          name: gki-kernelsu-x86_64
          path: kernel-dist
          run-id: ${{ github.run_id }}

      - name: Install Cuttlefish host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates unzip jq
          # Install the host tools from Google's official Artifact Registry
          # channel. Downloading CI run artifacts from another repository and
          # unpacking them in shell matches the untrusted-artifact download
          # pattern that workflow security analysis flags, so this harness
          # uses the documented release channel instead. Host tools track the
          # channel tip; the tested platform stays pinned via CF_ANDROID_BRANCH.
          sudo curl -fsSL https://us-apt.pkg.dev/doc/repo-signing-key.gpg \
            -o /etc/apt/trusted.gpg.d/artifact-registry.asc
          sudo chmod a+r /etc/apt/trusted.gpg.d/artifact-registry.asc
          echo "deb https://us-apt.pkg.dev/projects/android-cuttlefish-artifacts android-cuttlefish main" \
            | sudo tee /etc/apt/sources.list.d/artifact-registry.list
          sudo apt-get update
          sudo apt-get install -y cuttlefish-base cuttlefish-user
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -aG kvm,cvdnetwork,render "$USER"

      - name: Resolve and download Cuttlefish images
        shell: bash
        env:
          CF_BRANCH: ${{ env.CF_ANDROID_BRANCH }}
          CF_DEVICE: ${{ env.CF_ANDROID_DEVICE }}
        run: |
          set -euo pipefail
          target="${CF_DEVICE}-userdebug"
          build_id=$(curl -fsSL "https://ci.android.com/builds/branches/${CF_BRANCH}/status.json" \
            | jq -r ".targets[] | select(.name == \"$target\") | .last_known_good_build")
          if [ -z "$build_id" ] || [ "$build_id" = "null" ]; then
            echo "::error::No last known good build for ${target} on ${CF_BRANCH}"
            exit 1
          fi
          echo "CF_BUILD_ID=$build_id" >> "$GITHUB_ENV"
          base="https://ci.android.com/builds/submitted/${build_id}/${target}/latest/raw"
          mkdir -p "$HOME/cuttlefish"
          curl -fsSL "${base}/cvd-host_package.tar.gz" -o "$RUNNER_TEMP/host-package.tar.gz"
          curl -fsSL "${base}/${CF_DEVICE}-img-${build_id}.zip" -o "$RUNNER_TEMP/system-img.zip"
          tar xzf "$RUNNER_TEMP/host-package.tar.gz" -C "$HOME/cuttlefish"
          unzip -q "$RUNNER_TEMP/system-img.zip" -d "$HOME/cuttlefish"
          echo "CF_HOME=$HOME/cuttlefish" >> "$GITHUB_ENV"
          # Use the Cuttlefish-bundled adb so the oracle does not depend on the
          # runner image's Android SDK version.
          echo "$HOME/cuttlefish/bin" >> "$GITHUB_PATH"

      - name: Boot Cuttlefish with the KernelSU kernel
        id: boot
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          kernel_path="$PWD/kernel-dist/bzImage"
          test -s "$kernel_path" || { echo "::error::Missing bzImage"; exit 1; }
          extra=()
          if [ -s "$PWD/kernel-dist/initramfs.img" ]; then
            extra+=("-initramfs_path=$PWD/kernel-dist/initramfs.img")
          fi
          sg kvm -c "sg cvdnetwork -c 'HOME=$CF_HOME $CF_HOME/bin/launch_cvd \
            -daemon -memory_mb=6144 -cpus=4 -gpu_mode=guest_swiftshader \
            -enable_sandbox=false -report_anonymous_usage_stats=n \
            -kernel_path=$kernel_path ${extra[*]}'" || true
          # Bound the initial device wait so a failed launch cannot consume the
          # whole job timeout and skip the diagnostics/cleanup steps below.
          if ! timeout 180 adb wait-for-device; then
            echo "::error::ADB device did not become available within 3 minutes"
            exit 1
          fi
          booted=false
          for _ in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [ "$booted" != "true" ]; then
            echo "::error::Cuttlefish did not finish booting"
            tail -n 300 "$HOME/cuttlefish/cuttlefish_runtime/kernel.log" 2>/dev/null || true
            exit 1
          fi
          sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')
          release=$(adb shell getprop ro.build.version.release | tr -d '\r')
          echo "Platform: release=$release sdk=$sdk build_id=$CF_BUILD_ID"
          if [ "$sdk" != "37" ] && [ "$sdk" != "36" ]; then
            echo "::error::Unexpected platform API level: $sdk"
            exit 1
          fi
          # Platform root (via adbd) is available on userdebug and is not proof
          # of KernelSU. Assert the KernelSU runtime marker separately, because
          # the whole point of this oracle is the custom root-capable kernel.
          adb root || true
          sleep 3
          if ! timeout 60 adb wait-for-device; then
            echo "::error::ADB device did not return after adb root"
            exit 1
          fi
          # Single canonical KernelSU runtime criterion used by every step.
          if ! adb shell 'test -d /data/adb/ksu || command -v ksud >/dev/null 2>&1 || test -x /data/adb/ksu/bin/ksud'; then
            echo "::error::KernelSU runtime marker (/data/adb/ksu or ksud) is missing"
            exit 1
          fi
          echo "KernelSU runtime marker present"

      - name: Verify keystore2 attestation path
        id: keystore
        if: steps.boot.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          adb shell su -c 'service check android.security.keystore' || true
          # Baseline contract for the unmodified platform: keystore2 must be a
          # live, root-reachable service. This is the assertion the stock AVD
          # job cannot make because it has no root-capable kernel.
          adb shell su -c 'ls -l /system/bin/keystore2 /apex/com.android.keystore/bin/keystore2 2>/dev/null' || true
          if ! adb shell su -c 'ps -A | grep -q keystore'; then
            echo "::error::keystore process is not running on the oracle"
            exit 1
          fi
          # Use the same runtime criterion as the boot step so a device that was
          # accepted there cannot fail here on a stricter check.
          if ! adb shell 'test -d /data/adb/ksu || command -v ksud >/dev/null 2>&1 || test -x /data/adb/ksu/bin/ksud'; then
            echo "::error::KernelSU runtime disappeared after boot"
            exit 1
          fi

      - name: Build and install the module
        id: install_module
        if: steps.boot.outcome == 'success' && env.CF_INSTALL_MODULE == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "Building the module ZIP (this also compiles the Rust native layer)."
          ./gradlew zipRelease --warning-mode=fail --console=plain
          zip=$(ls module/release/*-release.zip | head -1)
          [ -n "$zip" ] || { echo "::error::No release module ZIP produced"; exit 1; }
          echo "Built module ZIP: $zip"
          adb push "$zip" /data/local/tmp/ct-module.zip
          adb shell su -c '/data/adb/ksu/bin/ksud module install /data/local/tmp/ct-module.zip'
          adb shell su -c 'ls -d /data/adb/modules/cleverestricky' || {
            echo "::error::Module directory not present after install"
            exit 1
          }
          # Installing the module requires a reboot for post-fs-data/service to
          # run, so the real interception check is deferred to a follow-up run.
          echo "Module installed; a reboot is required before the service contract can run."

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cuttlefish-logs
          adb logcat -d > cuttlefish-logs/logcat.txt 2>/dev/null || true
          adb shell dmesg > cuttlefish-logs/dmesg.txt 2>/dev/null || true
          cp "$HOME/cuttlefish/cuttlefish_runtime/kernel.log" cuttlefish-logs/kernel.log 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cuttlefish-diagnostics
          path: cuttlefish-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Cuttlefish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CF_HOME:-}" ] && [ -x "$CF_HOME/bin/stop_cvd" ]; then
            HOME="$CF_HOME" "$CF_HOME/bin/stop_cvd" || true
          fi

      - name: Enforce boot and keystore result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.boot.outcome }}" != "success" ]; then
            echo "::error::Cuttlefish boot contract failed"
            exit 1
          fi
          if [ "${{ steps.keystore.outcome }}" != "success" ]; then
            echo "::error::keystore2 contract failed"
            exit 1
          fi
          if [ "${{ env.CF_INSTALL_MODULE }}" = "true" ] && [ "${{ steps.install_module.outcome }}" != "success" ]; then
            echo "::error::module install contract failed"
            exit 1
          fi