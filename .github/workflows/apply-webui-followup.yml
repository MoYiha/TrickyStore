name: Apply WebUI follow-up

on:
  push:
    branches:
      - fix/v2.5.7-webui-timing-followup
    paths:
      - .github/workflows/apply-webui-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.5.7-webui-timing-followup
          fetch-depth: 0

      - name: Apply focused WebUI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          policy_path = Path('module/template/webroot/policy.js')
          policy = policy_path.read_text()

          insert_before = 'function installAppsProfileCard() {'
          if 'function installConfigurationActions() {' not in policy:
              feature = r'''
function installConfigurationActions() {
  const dashboard = document.getElementById('dashboard');
  if (!dashboard || document.getElementById('ct_restore_defaults')) return;
  const panel = [...dashboard.querySelectorAll('.panel')].find(item => /^Configuration Management$/i.test((item.querySelector('h3')?.textContent || '').trim()));
  if (!panel) return;
  const note = document.createElement('div');
  note.className = 'scope-note';
  note.style.marginTop = '12px';
  note.textContent = 'Restores module settings using the built-in default profile. Stored keyboxes and encrypted backups are not deleted.';
  const button = document.createElement('button');
  button.id = 'ct_restore_defaults';
  button.type = 'button';
  button.className = 'danger';
  button.style.width = '100%';
  button.textContent = 'Restore Defaults';
  button.onclick = async () => {
    if (global.confirm && !global.confirm('Restore module settings to defaults?')) return;
    const original = button.textContent;
    button.disabled = true;
    button.textContent = 'Restoring...';
    try {
      const body = new URLSearchParams();
      body.set('profile','default');
      await request('/api/apply_profile',{method:'POST',body});
      await request('/api/reload',{method:'POST'});
      notify('Default settings restored');
      global.setTimeout(() => global.location.reload(),600);
    } catch (error) {
      notify(error.message || 'Could not restore defaults','error');
      button.disabled = false;
      button.textContent = original;
    }
  };
  panel.append(note,button);
}

const BUILT_IN_TEMPLATE_IDS = new Set(['pixel8pro','pixel8','pixel7pro','pixel6pro','s24ultra','s23ultra','xiaomi14','oneplus11','nothing2']);
const CUSTOM_TEMPLATE_FIELDS = [
  ['id','Template ID'],['manufacturer','Manufacturer'],['model','Model'],['fingerprint','Fingerprint'],
  ['brand','Brand'],['product','Product'],['device','Device'],['release','Android release'],
  ['buildId','Build ID'],['incremental','Incremental'],['type','Build type'],['tags','Build tags'],
  ['securityPatch','Security patch']
];

function installCustomTemplateBuilder() {
  const spoof = document.getElementById('spoof');
  if (!spoof || document.getElementById('ct_custom_template_panel')) return;
  const identityPanel = [...spoof.querySelectorAll('.panel')].find(item => /^Identity Manager$/i.test((item.querySelector('h3')?.textContent || '').trim()));
  if (!identityPanel) return;
  const panel = document.createElement('div');
  panel.id = 'ct_custom_template_panel';
  panel.className = 'panel';
  const fields = CUSTOM_TEMPLATE_FIELDS.map(([key,label]) => {
    const value = key === 'type' ? 'user' : (key === 'tags' ? 'release-keys' : '');
    return `<div><label for="ct_template_${key}">${escapeHtml(label)}</label><input id="ct_template_${key}" type="text" maxlength="512" value="${escapeHtml(value)}" autocomplete="off" spellcheck="false"></div>`;
  }).join('');
  panel.innerHTML = `<details id="ct_custom_template_details"><summary><strong>Custom Templates</strong></summary><div class="scope-note" style="margin-top:12px">Create a reusable device identity template. The form stays collapsed until you open it.</div><div class="ct-choice-grid">${fields}</div><button id="ct_template_save" type="button" class="primary" style="width:100%;margin-top:14px">Save custom template</button></details>`;
  identityPanel.insertAdjacentElement('afterend',panel);
  panel.querySelector('#ct_template_save').onclick = saveCustomTemplate;
}

async function saveCustomTemplate() {
  const template = {};
  for (const [key] of CUSTOM_TEMPLATE_FIELDS) {
    const input = document.getElementById(`ct_template_${key}`);
    template[key] = input ? input.value.trim() : '';
  }
  template.id = template.id.toLowerCase();
  if (!/^[a-z0-9_-]{1,64}$/.test(template.id)) throw new Error('Template ID is invalid');
  if (BUILT_IN_TEMPLATE_IDS.has(template.id)) throw new Error('Built-in template IDs cannot be replaced');
  if (Object.entries(template).some(([key,value]) => key !== 'id' && (!value || value.length > 512))) throw new Error('All template fields are required');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(template.securityPatch)) throw new Error('Security patch must be YYYY-MM-DD');

  const current = await request('/api/templates');
  if (!Array.isArray(current)) throw new Error('Template catalog is unavailable');
  const next = current.filter(item => String(item && item.id || '').toLowerCase() !== template.id);
  next.push(template);
  const save = await bridge.fetch('/api/save',{
    method:'POST',
    body:new URLSearchParams({filename:'templates.json',content:JSON.stringify(next,null,2)})
  });
  if (!save.ok) throw new Error(await save.text());
  await request('/api/reload',{method:'POST'});
  notify('Custom template saved');
  global.setTimeout(() => global.location.reload(),600);
}

'''
              if insert_before not in policy:
                  raise SystemExit('policy insertion marker missing')
              policy = policy.replace(insert_before, feature + insert_before, 1)

          init_marker = '  installFeatureCenter();\n  installAppsProfileCard();'
          if '  installConfigurationActions();' not in policy:
              if init_marker not in policy:
                  raise SystemExit('policy initialize marker missing')
              policy = policy.replace(init_marker, '  installFeatureCenter();\n  installConfigurationActions();\n  installCustomTemplateBuilder();\n  installAppsProfileCard();', 1)

          policy_path.write_text(policy)

          ux_path = Path('module/template/webroot/ux.js')
          ux = ux_path.read_text()
          if "'Restore Defaults': 'Varsayılanlara Dön'" not in ux:
              tr_marker = "    // Complete catalogs share one source key per row to keep all built-in\n"
              if tr_marker not in ux:
                  raise SystemExit('ux Turkish catalog marker missing')
              tr_assign = '''    Object.assign(TRANSLATIONS.tr, {
        'Restore Defaults': 'Varsayılanlara Dön',
        'Restore module settings to defaults?': 'Modül ayarları varsayılanlara döndürülsün mü?',
        'Restores module settings using the built-in default profile. Stored keyboxes and encrypted backups are not deleted.': 'Yerleşik varsayılan profil ile modül ayarlarını geri yükler. Kayıtlı keyboxlar ve şifreli yedekler silinmez.',
        'Default settings restored': 'Varsayılan ayarlar geri yüklendi',
        'Could not restore defaults': 'Varsayılanlar geri yüklenemedi',
        'Custom Templates': 'Özel Şablonlar',
        'Create a reusable device identity template. The form stays collapsed until you open it.': 'Yeniden kullanılabilir bir cihaz kimliği şablonu oluşturun. Form siz açana kadar kapalı kalır.',
        'Template ID': 'Şablon Kimliği', 'Manufacturer': 'Üretici', 'Model': 'Model', 'Fingerprint': 'Parmak izi',
        'Brand': 'Marka', 'Product': 'Ürün', 'Device': 'Cihaz', 'Android release': 'Android sürümü',
        'Build ID': 'Derleme Kimliği', 'Incremental': 'Artımlı derleme', 'Build type': 'Derleme türü', 'Build tags': 'Derleme etiketleri',
        'Security patch': 'Güvenlik yaması', 'Save custom template': 'Özel şablonu kaydet',
        'Custom template saved': 'Özel şablon kaydedildi', 'Template ID is invalid': 'Şablon kimliği geçersiz',
        'Built-in template IDs cannot be replaced': 'Yerleşik şablon kimlikleri değiştirilemez',
        'All template fields are required': 'Tüm şablon alanları zorunludur',
        'Security patch must be YYYY-MM-DD': 'Güvenlik yaması YYYY-AA-GG biçiminde olmalıdır',
        'Template catalog is unavailable': 'Şablon kataloğu kullanılamıyor'
    });

'''
              ux = ux.replace(tr_marker, tr_assign + tr_marker, 1)

              rows_marker = '    ];\n\n    for (const row of COMPLETE_CATALOG_ROWS) {'
              if rows_marker not in ux:
                  raise SystemExit('ux complete catalog marker missing')
              rows = '''        ["Restore Defaults", "恢复默认设置", "Restaurar valores predeterminados", "Standardeinstellungen wiederherstellen", "Восстановить настройки по умолчанию", "Pulihkan Default", "डिफ़ॉल्ट बहाल करें", "استعادة الإعدادات الافتراضية"],
        ["Restore module settings to defaults?", "将模块设置恢复为默认值？", "¿Restaurar la configuración del módulo a los valores predeterminados?", "Moduleinstellungen auf Standardwerte zurücksetzen?", "Восстановить настройки модуля по умолчанию?", "Pulihkan pengaturan modul ke default?", "मॉड्यूल सेटिंग्स को डिफ़ॉल्ट पर बहाल करें?", "هل تريد استعادة إعدادات الوحدة إلى القيم الافتراضية؟"],
        ["Restores module settings using the built-in default profile. Stored keyboxes and encrypted backups are not deleted.", "使用内置默认配置恢复模块设置。已保存的密钥盒和加密备份不会被删除。", "Restaura la configuración del módulo con el perfil predeterminado integrado. No elimina keyboxes guardados ni copias cifradas.", "Stellt Moduleinstellungen mit dem integrierten Standardprofil wieder her. Gespeicherte Keyboxen und verschlüsselte Backups werden nicht gelöscht.", "Восстанавливает настройки модуля встроенным профилем по умолчанию. Сохранённые keybox и зашифрованные резервные копии не удаляются.", "Memulihkan pengaturan modul memakai profil default bawaan. Keybox tersimpan dan cadangan terenkripsi tidak dihapus.", "अंतर्निहित डिफ़ॉल्ट प्रोफ़ाइल से मॉड्यूल सेटिंग्स बहाल करता है। सहेजे गए keybox और एन्क्रिप्टेड बैकअप हटाए नहीं जाते।", "يستعيد إعدادات الوحدة باستخدام الملف الافتراضي المدمج. لا يتم حذف صناديق المفاتيح المحفوظة أو النسخ الاحتياطية المشفرة."],
        ["Default settings restored", "已恢复默认设置", "Valores predeterminados restaurados", "Standardeinstellungen wiederhergestellt", "Настройки по умолчанию восстановлены", "Pengaturan default dipulihkan", "डिफ़ॉल्ट सेटिंग्स बहाल की गईं", "تمت استعادة الإعدادات الافتراضية"],
        ["Could not restore defaults", "无法恢复默认设置", "No se pudieron restaurar los valores predeterminados", "Standardeinstellungen konnten nicht wiederhergestellt werden", "Не удалось восстановить настройки по умолчанию", "Tidak dapat memulihkan default", "डिफ़ॉल्ट बहाल नहीं किए जा सके", "تعذر استعادة الإعدادات الافتراضية"],
        ["Custom Templates", "自定义模板", "Plantillas personalizadas", "Benutzerdefinierte Vorlagen", "Пользовательские шаблоны", "Template Kustom", "कस्टम टेम्पलेट", "قوالب مخصصة"],
        ["Create a reusable device identity template. The form stays collapsed until you open it.", "创建可重复使用的设备身份模板。表单在打开前保持折叠。", "Crea una plantilla reutilizable de identidad del dispositivo. El formulario permanece contraído hasta que lo abras.", "Erstellt eine wiederverwendbare Geräteidentitätsvorlage. Das Formular bleibt bis zum Öffnen eingeklappt.", "Создайте многоразовый шаблон идентичности устройства. Форма остаётся свёрнутой, пока вы её не откроете.", "Buat template identitas perangkat yang dapat digunakan kembali. Form tetap tertutup sampai dibuka.", "दोबारा उपयोग योग्य डिवाइस पहचान टेम्पलेट बनाएँ। खोलने तक फ़ॉर्म बंद रहता है।", "أنشئ قالب هوية جهاز قابل لإعادة الاستخدام. يبقى النموذج مطويا حتى تفتحه."],
        ["Template ID", "模板 ID", "ID de plantilla", "Vorlagen-ID", "ID шаблона", "ID Template", "टेम्पलेट आईडी", "معرف القالب"],
        ["Manufacturer", "制造商", "Fabricante", "Hersteller", "Производитель", "Produsen", "निर्माता", "الشركة المصنعة"],
        ["Model", "型号", "Modelo", "Modell", "Модель", "Model", "मॉडल", "الطراز"],
        ["Fingerprint", "指纹", "Huella digital", "Fingerprint", "Отпечаток", "Fingerprint", "फिंगरप्रिंट", "البصمة"],
        ["Brand", "品牌", "Marca", "Marke", "Бренд", "Merek", "ब्रांड", "العلامة التجارية"],
        ["Product", "产品", "Producto", "Produkt", "Продукт", "Produk", "उत्पाद", "المنتج"],
        ["Device", "设备", "Dispositivo", "Gerät", "Устройство", "Perangkat", "डिवाइस", "الجهاز"],
        ["Android release", "Android 版本", "Versión de Android", "Android-Version", "Версия Android", "Rilis Android", "Android रिलीज़", "إصدار Android"],
        ["Build ID", "版本 ID", "ID de compilación", "Build-ID", "ID сборки", "ID Build", "बिल्ड आईडी", "معرف البناء"],
        ["Incremental", "增量版本", "Incremental", "Inkrementell", "Инкрементальная сборка", "Incremental", "इन्क्रीमेंटल", "البناء التزايدي"],
        ["Build type", "构建类型", "Tipo de compilación", "Build-Typ", "Тип сборки", "Tipe build", "बिल्ड प्रकार", "نوع البناء"],
        ["Build tags", "构建标签", "Etiquetas de compilación", "Build-Tags", "Теги сборки", "Tag build", "बिल्ड टैग", "وسوم البناء"],
        ["Security patch", "安全补丁", "Parche de seguridad", "Sicherheitspatch", "Патч безопасности", "Patch keamanan", "सुरक्षा पैच", "تصحيح الأمان"],
        ["Save custom template", "保存自定义模板", "Guardar plantilla personalizada", "Benutzerdefinierte Vorlage speichern", "Сохранить пользовательский шаблон", "Simpan template kustom", "कस्टम टेम्पलेट सहेजें", "حفظ القالب المخصص"],
        ["Custom template saved", "自定义模板已保存", "Plantilla personalizada guardada", "Benutzerdefinierte Vorlage gespeichert", "Пользовательский шаблон сохранён", "Template kustom disimpan", "कस्टम टेम्पलेट सहेजा गया", "تم حفظ القالب المخصص"],
        ["Template ID is invalid", "模板 ID 无效", "El ID de plantilla no es válido", "Vorlagen-ID ist ungültig", "Недопустимый ID шаблона", "ID template tidak valid", "टेम्पलेट आईडी अमान्य है", "معرف القالب غير صالح"],
        ["Built-in template IDs cannot be replaced", "不能替换内置模板 ID", "Los ID de plantillas integradas no se pueden reemplazar", "Integrierte Vorlagen-IDs können nicht ersetzt werden", "Встроенные ID шаблонов нельзя заменять", "ID template bawaan tidak dapat diganti", "अंतर्निहित टेम्पलेट आईडी बदले नहीं जा सकते", "لا يمكن استبدال معرفات القوالب المدمجة"],
        ["All template fields are required", "所有模板字段均为必填项", "Todos los campos de la plantilla son obligatorios", "Alle Vorlagenfelder sind erforderlich", "Все поля шаблона обязательны", "Semua kolom template wajib diisi", "सभी टेम्पलेट फ़ील्ड आवश्यक हैं", "جميع حقول القالب مطلوبة"],
        ["Security patch must be YYYY-MM-DD", "安全补丁必须为 YYYY-MM-DD", "El parche de seguridad debe tener formato YYYY-MM-DD", "Sicherheitspatch muss YYYY-MM-DD sein", "Патч безопасности должен иметь формат YYYY-MM-DD", "Patch keamanan harus YYYY-MM-DD", "सुरक्षा पैच YYYY-MM-DD होना चाहिए", "يجب أن يكون تصحيح الأمان بصيغة YYYY-MM-DD"],
        ["Template catalog is unavailable", "模板目录不可用", "El catálogo de plantillas no está disponible", "Vorlagenkatalog ist nicht verfügbar", "Каталог шаблонов недоступен", "Katalog template tidak tersedia", "टेम्पलेट कैटलॉग उपलब्ध नहीं है", "كتالوج القوالب غير متاح"],
'''
              ux = ux.replace(rows_marker, rows + rows_marker, 1)
              ux_path.write_text(ux)

          bridge_test = Path('module/webui-tests/bridge.test.js')
          tests = bridge_test.read_text()
          test_marker = "assert.match(policySource, /ct_keybox_status_panel/);\n"
          if 'ct_restore_defaults' not in tests:
              if test_marker not in tests:
                  raise SystemExit('bridge test marker missing')
              tests = tests.replace(test_marker, test_marker + "assert.match(policySource, /ct_restore_defaults/);\nassert.match(policySource, /body\.set\('profile','default'\)/);\nassert.ok(!policySource.includes('/api/reset_environment'), 'Restore Defaults must use the built-in default profile, not destructive environment reset');\nassert.match(policySource, /ct_custom_template_panel/);\nassert.match(policySource, /filename:'templates\\.json'/);\nassert.match(policySource, /BUILT_IN_TEMPLATE_IDS/);\n", 1)
              bridge_test.write_text(tests)

          loc_test = Path('module/webui-tests/localization.test.js')
          loc = loc_test.read_text()
          loc_marker = "    'Thank you for your support!'\n];"
          if "'Restore Defaults'" not in loc:
              if loc_marker not in loc:
                  raise SystemExit('localization test marker missing')
              loc = loc.replace(loc_marker, "    'Thank you for your support!',\n    'Restore Defaults',\n    'Restores module settings using the built-in default profile. Stored keyboxes and encrypted backups are not deleted.',\n    'Custom Templates',\n    'Create a reusable device identity template. The form stays collapsed until you open it.',\n    'Save custom template',\n    'Custom template saved'\n];", 1)
              loc_test.write_text(loc)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          additions = [
              '- Restored a localized WebUI Restore Defaults action backed by the built-in default profile without deleting stored keyboxes or encrypted backups.',
              '- Added a compact Identity custom-template builder; saved templates are validated by the existing templates.json path and become selectable from Profiles after reload.'
          ]
          for line in additions:
              if line not in text:
                  text = text.rstrip() + '\n' + line + '\n'
          changelog.write_text(text)
          PY

      - name: Validate WebUI regression suite
        run: |
          node --check module/template/webroot/policy.js
          node --check module/template/webroot/ux.js
          for test in module/webui-tests/*.test.js; do node "$test"; done

      - name: Commit focused changes
        shell: bash
        run: |
          git rm .github/workflows/apply-webui-followup.yml
          git config user.name "Yiğit"
          git config user.email "40565628+tryigit@users.noreply.github.com"
          git add module/template/webroot/policy.js module/template/webroot/ux.js module/webui-tests/bridge.test.js module/webui-tests/localization.test.js CHANGELOG.md
          git commit -m "feat: restore defaults and custom WebUI templates"
          git push origin HEAD:fix/v2.5.7-webui-timing-followup
