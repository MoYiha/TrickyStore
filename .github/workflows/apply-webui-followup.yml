name: Apply WebUI follow-up

on:
  push:
    branches:
      - fix/v2.5.7-webui-timing-followup
    paths:
      - .github/workflows/apply-webui-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.5.7-webui-timing-followup
          fetch-depth: 0
      - name: Apply Restore Defaults UI
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
      - name: Validate WebUI
        run: |
          node --check module/template/webroot/policy.js
          node --check module/template/webroot/ux.js
          for test in module/webui-tests/*.test.js; do node "$test"; done
      - name: Commit changes
        run: |
          git rm .github/workflows/apply-webui-followup.yml
          git config user.name "Yiğit"
          git config user.email "40565628+tryigit@users.noreply.github.com"
          git add module/template/webroot/policy.js module/template/webroot/ux.js module/webui-tests/bridge.test.js module/webui-tests/localization.test.js CHANGELOG.md
          git commit -m "feat: restore WebUI defaults control"
          git push origin HEAD:fix/v2.5.7-webui-timing-followup
