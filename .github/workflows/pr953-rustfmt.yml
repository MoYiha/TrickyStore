name: PR953 One-shot Rustfmt

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.pull_request.number == 953
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/rust-first-service-redesign
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Format Rust and self-clean
        shell: bash
        run: |
          set -euo pipefail
          cd rust
          cargo fmt --all
          cd ..
          rm -f .github/workflows/pr953-rustfmt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust .github/workflows/pr953-rustfmt.yml
          if git diff --cached --quiet; then
            echo 'No rustfmt changes required'
            exit 0
          fi
          git commit -m 'style: apply rustfmt to runtime broker'
          git push origin HEAD:agent/rust-first-service-redesign
