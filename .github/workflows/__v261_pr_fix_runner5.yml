name: Apply deep V2.6.1 keybox fixes v5
on:
  pull_request:
    types: [synchronize]
    branches: [master]
permissions:
  contents: write
jobs:
  apply-fixes:
    if: github.event.pull_request.head.ref == 'feat/v2.6.1-webui-zip-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: feat/v2.6.1-webui-zip-import
      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          runner = Path('.github/workflows/__v261_pr_fix_runner4.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n      - name: Format and validate"
          if runner.count(start) != 1 or runner.count(end) != 1:
              raise SystemExit('Could not extract structural V2.6.1 patch program')
          program = textwrap.dedent(runner.split(start, 1)[1].split(end, 1)[0])
          exec(compile(program, '<v261-keybox-structural-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          node --check module/template/webroot/ux.js
          node module/webui-tests/zip-import.test.js
          ./gradlew :service:ktlintFormat :encryptor-app:ktlintFormat --no-daemon
          ./gradlew :service:ktlintCheck :service:testDebugUnitTest :encryptor-app:ktlintCheck :encryptor-app:testDebugUnitTest --no-daemon
          (cd rust && cargo fmt --all && cargo test -p cleverestricky-daemon)
          git diff --check
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/__v261_keybox_runtime_fix.yml \
            .github/workflows/__v261_runner_repair.yml \
            .github/workflows/__v261_pr_fix_runner.yml \
            .github/workflows/__v261_pr_fix_runner2.yml \
            .github/workflows/__v261_pr_fix_runner3.yml \
            .github/workflows/__v261_pr_fix_runner4.yml \
            .github/workflows/__v261_pr_fix_runner5.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(keybox): unify storage identity and vault management"
          git push origin HEAD:feat/v2.6.1-webui-zip-import
