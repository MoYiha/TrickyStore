name: Apply deep V2.6.1 keybox fixes v5
on:
  pull_request:
    types: [synchronize]
    branches: [master]
permissions:
  contents: write
jobs:
  apply-fixes:
    if: github.event.pull_request.head.ref == 'feat/v2.6.1-webui-zip-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: feat/v2.6.1-webui-zip-import
      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          runner = Path('.github/workflows/__v261_pr_fix_runner4.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n      - name: Format and validate"
          if runner.count(start) != 1 or runner.count(end) != 1:
              raise SystemExit('Could not extract structural V2.6.1 patch program')
          program = textwrap.dedent(runner.split(start, 1)[1].split(end, 1)[0])
          exec(compile(program, '<v261-keybox-structural-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Repair regression expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'service/src/test/java/cleveres/tricky/cleverestech/ActionTest.kt',
              '"Active (1 keys)"',
              '"Active keybox"',
              expected=2,
          )

          replace_exact(
              'service/src/test/java/cleveres/tricky/cleverestech/ConfigCachingTest.kt',
              '''    private fun getCachedLegacyKeyboxes(): List<*> {
                  val field = Config::class.java.getDeclaredField("cachedLegacyKeyboxes")
                  field.isAccessible = true
                  return field.get(Config) as List<*>
              }
          ''',
              '''    private fun getCachedKeyboxCount(): Int {
                  val field = Config::class.java.getDeclaredField("storedKeyboxCache")
                  field.isAccessible = true
                  val cache = field.get(Config) as Map<*, *>
                  return cache.values.sumOf { entry ->
                      requireNotNull(entry)
                      val keyboxesField = entry.javaClass.getDeclaredField("keyboxes")
                      keyboxesField.isAccessible = true
                      (keyboxesField.get(entry) as List<*>).size
                  }
              }
          ''',
          )
          replace_exact(
              'service/src/test/java/cleveres/tricky/cleverestech/ConfigCachingTest.kt',
              'val cached1 = getCachedLegacyKeyboxes()\n        assertEquals("Should load 1 keybox", 1, cached1.size)',
              'val cached1 = getCachedKeyboxCount()\n        assertEquals("Should load 1 keybox", 1, cached1)',
          )
          replace_exact(
              'service/src/test/java/cleveres/tricky/cleverestech/ConfigCachingTest.kt',
              'val cached2 = getCachedLegacyKeyboxes()\n        assertEquals("Should reload the changed keybox", 0, cached2.size)',
              'val cached2 = getCachedKeyboxCount()\n        assertEquals("Should reload the changed keybox", 0, cached2)',
          )
          replace_exact(
              'service/src/test/java/cleveres/tricky/cleverestech/ConfigCachingTest.kt',
              'val cached3 = getCachedLegacyKeyboxes()\n        assertEquals("Should still have 0 keyboxes", 0, cached3.size)',
              'val cached3 = getCachedKeyboxCount()\n        assertEquals("Should still have 0 keyboxes", 0, cached3)',
          )

          replace_exact(
              'service/src/test/java/cleveres/tricky/cleverestech/WebServerKeyboxUXTest.kt',
              'val html = conn.inputStream.bufferedReader().readText()',
              '''val uxSource =
                  listOf(
                      File("module/template/webroot/ux.js"),
                      File("../module/template/webroot/ux.js"),
                  ).first { it.isFile }.readText()
              val html = conn.inputStream.bufferedReader().readText() + "\\n" + uxSource''',
          )

          replace_exact(
              'service/src/test/java/cleveres/tricky/cleverestech/util/KeyboxVerifierTest.kt',
              '"Too many keybox files"',
              '"Too many keybox XML files"',
          )
          PY
      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          node --check module/template/webroot/ux.js
          node module/webui-tests/zip-import.test.js
          ./gradlew :service:ktlintFormat :encryptor-app:ktlintFormat --no-daemon
          ./gradlew :service:ktlintCheck :service:testDebugUnitTest :encryptor-app:ktlintCheck :encryptor-app:testDebugUnitTest --no-daemon
          (cd rust && cargo fmt --all && cargo test -p cleverestricky-daemon)
          git diff --check
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/V261_VALIDATION_FAILURE.md \
            .github/workflows/__v261_keybox_runtime_fix.yml \
            .github/workflows/__v261_runner_repair.yml \
            .github/workflows/__v261_pr_fix_runner.yml \
            .github/workflows/__v261_pr_fix_runner2.yml \
            .github/workflows/__v261_pr_fix_runner3.yml \
            .github/workflows/__v261_pr_fix_runner4.yml \
            .github/workflows/__v261_pr_fix_runner5.yml \
            .github/workflows/__v261_pr_fix_runner6.yml \
            .github/workflows/__v261_pr_fix_runner7.yml \
            .github/workflows/__v261_pr_fix_runner8.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(keybox): unify storage identity and vault management"
          git push origin HEAD:feat/v2.6.1-webui-zip-import
