name: Finalize Identity Random Coherence

on:
  push:
    branches: [ "agent/identity-randomization" ]
    paths:
      - ".github/workflows/finalize-identity-random-coherence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Apply coherence patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/fix_identity_random_coherence.py
          python3 .github/scripts/fix_identity_random_coherence.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path('service/src/main/java/cleveres/tricky/cleverestech/WebServer.kt')
          text = path.read_text(encoding='utf-8')
          old = '''            "telephony" ->
                putFields(
                    "imei", "imsi", "iccid", "meid", "phone_number",
                    "imei2", "imsi2", "iccid2", "meid2", "phone_number2",
                    "visible_sim_count",
                )
                .also { json.put("visible_sim_count", RandomUtils.generateVisibleSimCount(allowZero = false)) }
'''
          new = '''            "telephony" -> {
                putFields(
                    "imei", "imsi", "iccid", "meid", "phone_number",
                    "imei2", "imsi2", "iccid2", "meid2", "phone_number2",
                    "visible_sim_count",
                )
                json.put("visible_sim_count", RandomUtils.generateVisibleSimCount(allowZero = false))
            }
'''
          if text.count(old) != 1:
              raise SystemExit(f'telephony block anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Validate WebUI
        shell: bash
        env:
          NODE_OPTIONS: --throw-deprecation
        run: |
          set -euo pipefail
          for script in module/template/webroot/*.js; do node --check "$script"; done
          for test_file in module/webui-tests/*.test.js; do echo "Running $test_file"; node "$test_file"; done

      - name: Run service tests
        run: ./gradlew :service:testDebugUnitTest --warning-mode=fail --console=plain --stacktrace --no-build-cache

      - name: Run Kotlin and Android lint
        run: ./gradlew ktlintCheck :service:lintDebug --warning-mode=fail --console=plain --stacktrace --no-build-cache

      - name: Commit product changes and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix_identity_random_coherence.py
          rm -f .github/workflows/finalize-identity-random-coherence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep randomized telephony identity coherent"
          git push origin HEAD:agent/identity-randomization
