name: Finalize Identity Random Coherence

on:
  push:
    branches:
      - agent/identity-randomization
    paths:
      - .github/workflows/finalize-identity-random-coherence.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Android
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Apply patch
        run: python3 .github/scripts/fix_identity_random_coherence.py
      - name: WebUI tests
        run: |
          for script in module/template/webroot/*.js; do node --check "$script"; done
          for test_file in module/webui-tests/*.test.js; do node "$test_file"; done
      - name: Service tests
        run: ./gradlew :service:testDebugUnitTest --warning-mode=fail --console=plain --no-build-cache
      - name: Lint
        run: ./gradlew ktlintCheck :service:lintDebug --warning-mode=fail --console=plain --no-build-cache
      - name: Finalize
        run: |
          rm .github/scripts/fix_identity_random_coherence.py
          rm .github/workflows/finalize-identity-random-coherence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep randomized telephony identity coherent"
          git push origin HEAD:agent/identity-randomization
