name: Security Regression

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    name: "🔐 Dependency Security & Unit Tests"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Validate Bouncy Castle coordinates
        shell: bash
        run: |
          set -euo pipefail
          for artifact in bcpkix-jdk18on bcprov-jdk18on bcutil-jdk18on; do
            version=$(sed -n "s/^${artifact} = \"\([^\"]*\)\"/\1/p" gradle/libs.versions.toml | head -n1)
            if [[ -z "$version" ]]; then
              echo "::error::Missing version for org.bouncycastle:${artifact}"
              exit 1
            fi
            url="https://repo.maven.apache.org/maven2/org/bouncycastle/${artifact}/${version}/${artifact}-${version}.pom"
            echo "Checking org.bouncycastle:${artifact}:${version}"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --output /dev/null "$url"
          done

      - name: Enforce Bouncy Castle test-only security baseline
        shell: bash
        run: |
          set -euo pipefail
          resolved_version() {
            artifact="$1"
            configuration="$2"
            output=$(./gradlew :service:dependencyInsight --dependency "org.bouncycastle:${artifact}" --configuration "$configuration" --console=plain)
            printf '%s\n' "$output" | sed -nE "s/^org\.bouncycastle:${artifact}:([^[:space:]]+).*/\1/p" | head -n1
          }
          enforce_minimum() {
            artifact="$1"
            minimum="$2"
            configuration="$3"
            resolved=$(resolved_version "$artifact" "$configuration")
            if [[ -z "$resolved" ]]; then
              echo "::error::Could not resolve org.bouncycastle:${artifact} from ${configuration}"
              exit 1
            fi
            lowest=$(printf '%s\n%s\n' "$minimum" "$resolved" | sort -V | head -n1)
            if [[ "$lowest" != "$minimum" ]]; then
              echo "::error::org.bouncycastle:${artifact} resolved to $resolved below security baseline $minimum"
              exit 1
            fi
            echo "org.bouncycastle:${artifact} test oracle resolved to $resolved (minimum $minimum)"
          }
          for artifact in bcprov-jdk18on bcpkix-jdk18on bcutil-jdk18on; do
            runtime=$(resolved_version "$artifact" debugRuntimeClasspath)
            if [[ -n "$runtime" ]]; then
              echo "::error::org.bouncycastle:${artifact}:$runtime leaked into production debugRuntimeClasspath"
              exit 1
            fi
          done
          enforce_minimum bcprov-jdk18on 1.84 debugUnitTestRuntimeClasspath
          enforce_minimum bcpkix-jdk18on 1.84 debugUnitTestRuntimeClasspath
          enforce_minimum bcutil-jdk18on 1.84 debugUnitTestRuntimeClasspath

      - name: Validate installer extraction security
        shell: bash
        run: bash module/install-tests/verify_extract_security.test.sh

      - name: Validate all WebUI syntax and behavior
        shell: bash
        env:
          NODE_OPTIONS: --throw-deprecation
        run: |
          set -euo pipefail
          for script in module/template/webroot/*.js; do
            node --check "$script"
          done
          for test_file in module/webui-tests/*.test.js; do
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Guard Identity and policy semantics
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :service:testDebugUnitTest \
            --tests 'cleveres.tricky.cleverestech.PolicyStateTest' \
            --tests 'cleveres.tricky.cleverestech.LegacyIdentityMarkersTest' \
            --tests 'cleveres.tricky.cleverestech.IdentityPolicyContractTest' \
            --tests 'cleveres.tricky.cleverestech.PolicyMutationCoordinatorTest' \
            --tests 'cleveres.tricky.cleverestech.WebServerIdentityTest' \
            --warning-mode=fail --console=plain --stacktrace --no-build-cache

      - name: Guard Binder cache regressions
        working-directory: rust
        env:
          RUSTFLAGS: "-D warnings"
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cleverestricky-native-core platform::tests::binder_fd_cache_keeps_colliding_descriptors_resident -- --exact
          cargo test -p cleverestricky-native-core platform::tests::binder_fd_cache_replaces_reused_descriptor_identity -- --exact
          cargo test -p cleverestricky-native-core platform::tests::fast_binder_cache_keeps_alternating_exchange_sites_hot -- --exact

      - name: Run Android JVM unit tests
        id: android_jvm_tests
        continue-on-error: true
        run: ./gradlew :service:testDebugUnitTest :stub:testDebugUnitTest :encryptor-app:testDebugUnitTest --warning-mode=fail --console=plain --stacktrace --no-build-cache --rerun-tasks

      - name: Show Android JVM test failures
        if: steps.android_jvm_tests.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          found=false
          while IFS= read -r report; do
            found=true
            echo "===== $report ====="
            python3 - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          root = ET.parse(path).getroot()
          for case in root.findall("testcase"):
              failures = list(case.findall("failure")) + list(case.findall("error"))
              for failure in failures:
                  name = case.get("name", "<unnamed>")
                  cls = case.get("classname", "<unknown>")
                  message = failure.get("message", "")
                  text = (failure.text or "").strip()
                  print(f"FAILED: {cls} > {name}")
                  if message:
                      print(message)
                  if text:
                      print(text)
          PY
          done < <(find service stub encryptor-app -type f -path '*/build/test-results/*/TEST-*.xml' -print | sort)
          if [[ "$found" != "true" ]]; then
            echo "::warning::Android JVM tests failed but no XML test report was found"
          fi

      - name: Upload Android JVM failure reports
        if: steps.android_jvm_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-jvm-failure-reports
          path: |
            service/build/test-results
            service/build/reports/tests
            stub/build/test-results
            stub/build/reports/tests
            encryptor-app/build/test-results
            encryptor-app/reports/tests
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Enforce Android JVM unit test result
        if: steps.android_jvm_tests.outcome == 'failure'
        run: exit 1

  device-smoke-gate:
    name: "📱 Device Smoke Evidence"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require head-bound device smoke evidence for core runtime changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          device_bound=false
          while IFS= read -r path; do
            case "$path" in
              service/src/main/*|stub/src/main/*|rust/*|module/template/*|module/*.sh)
                echo "Device-bound production change: $path"
                device_bound=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")

          if [[ "$device_bound" != "true" ]]; then
            echo "No device-bound production paths changed; device smoke evidence is not required."
            exit 0
          fi

          python3 - <<'PY'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY", "")
          head = os.environ["HEAD_SHA"].strip()

          result = re.search(r"(?mi)^Device-Smoke-Result:\s*PASS\s*$", body)
          tested_head = re.search(r"(?mi)^Device-Smoke-Head:\s*([0-9a-f]{40})\s*$", body)
          target = re.search(r"(?mi)^Device-Smoke-Target:\s*(.+?)\s*$", body)

          errors = []
          if result is None:
              errors.append("missing 'Device-Smoke-Result: PASS'")
          if tested_head is None or tested_head.group(1).lower() != head.lower():
              errors.append(f"Device-Smoke-Head must equal current PR head {head}")
          if target is None or target.group(1).strip().lower() in {"pending", "n/a", "none"}:
              errors.append("Device-Smoke-Target must identify the tested device / Android / root-manager target")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              print("::error::Core device-runtime changes cannot be merge-ready from host CI alone. Run the required smoke on a supported KernelSU/APatch device and record head-bound evidence in the PR body.")
              sys.exit(1)

          print(f"Device smoke evidence is bound to final head {head} on {target.group(1).strip()}")
          PY

  dependency-submission:
    name: "📦 Submit Gradle Dependency Graph"
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: security-regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Submit resolved Gradle dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: generate-and-submit
