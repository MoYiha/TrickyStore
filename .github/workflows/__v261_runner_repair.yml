name: Repair V2.6.1 keybox fix runner
on:
  push:
    branches: [feat/v2.6.1-webui-zip-import]
    paths: [.github/workflows/__v261_runner_repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: feat/v2.6.1-webui-zip-import
      - name: Repair and hand off
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/__v261_keybox_runtime_fix.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('uses: actions/checkout@v4', 'uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1')
          text = text.replace(' — ', ' - ')
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/__v261_runner_repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/__v261_keybox_runtime_fix.yml
          git commit -m "ci: repair keybox fix runner"
          git push origin HEAD:feat/v2.6.1-webui-zip-import
