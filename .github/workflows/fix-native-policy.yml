name: Fix native source policy

on:
  push:
    branches:
      - feat/v2.5.7-final
    paths:
      - .github/workflows/fix-native-policy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v2.5.7-final
          fetch-depth: 0
      - name: Permit reviewed kernel identity native sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build.yml')
          s = p.read_text()
          old = "            ! -path './module/src/main/cpp/external/*' \\\n            ! -path './module/src/main/cpp/binder_interceptor.cpp' -print)"
          new = "            ! -path './module/src/main/cpp/external/*' \\\n            ! -path './module/src/main/cpp/binder_interceptor.cpp' \\\n            ! -path './module/src/main/cpp/kernel_identity.cpp' -print)"
          if old not in s:
              raise SystemExit('native allowlist marker missing')
          s = s.replace(old, new, 1)
          oldh = "                './rust/native-core/include/cleverestricky_native_core.h') ;;"
          newh = "                './rust/native-core/include/cleverestricky_native_core.h'|\\\n                './module/src/main/cpp/kernel_identity.hpp') ;;"
          if oldh not in s:
              raise SystemExit('header allowlist marker missing')
          s = s.replace(oldh, newh, 1)
          p.write_text(s)
          PY
          rm .github/workflows/fix-native-policy.yml
          git config user.name "Yiğit"
          git config user.email "40565628+tryigit@users.noreply.github.com"
          git add -A
          git commit -m "ci: allow reviewed kernel identity native sources"
          git push origin HEAD:feat/v2.5.7-final
