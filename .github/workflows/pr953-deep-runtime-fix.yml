                  unfocusedContainerColor = CleveresInputBackground,
                  disabledContainerColor = CleveresInputBackground,
                  focusedBorderColor = CleveresAccent,
                  unfocusedBorderColor = CleveresBorder,
                  focusedTextColor = CleveresForeground,
                  unfocusedTextColor = CleveresForeground,
                  focusedLabelColor = CleveresAccent,
                  unfocusedLabelColor = CleveresMuted,
                  focusedSupportingTextColor = CleveresMuted,
                  unfocusedSupportingTextColor = CleveresMuted,
              )

          '''
          activity = replace_once(activity, "class SecureMainActivity : ComponentActivity() {\n", theme_and_locale + "class SecureMainActivity : ComponentActivity() {\n", "theme insertion")
          activity = replace_once(
              activity,
              '''class SecureMainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
          ''',
              '''class SecureMainActivity : ComponentActivity() {
              override fun attachBaseContext(newBase: Context) {
                  super.attachBaseContext(LocaleController.wrap(newBase))
              }

              override fun onCreate(savedInstanceState: Bundle?) {
          ''',
              "legacy locale context",
          )
          activity = replace_once(
              activity,
              '''        setContent {
                  MaterialTheme(colorScheme = darkColorScheme()) {
                      SecureEncryptorApp()
                  }
