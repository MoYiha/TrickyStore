                  modifier = Modifier.fillMaxSize().padding(padding).padding(20.dp),
          ''',
              '''        containerColor = CleveresBackground,
              ) { padding ->
              Column(
                  modifier =
                      Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .verticalScroll(rememberScrollState())
                          .padding(20.dp),
          ''',
              "create scaffold",
          )
          activity = replace_once(
              activity,
              '''        ) {
              Text(stringResource(R.string.security_title), fontWeight = FontWeight.SemiBold)
              Text(stringResource(R.string.security_body), style = MaterialTheme.typography.bodySmall)

              OutlinedTextField(
          ''',
              '''        ) {
              Card(
                  colors = CardDefaults.cardColors(containerColor = CleveresPanel),
                  border = BorderStroke(1.dp, CleveresBorder),
                  shape = RoundedCornerShape(18.dp),
                  modifier = Modifier.fillMaxWidth(),
              ) {
                  Column(modifier = Modifier.padding(16.dp)) {
                      Text(stringResource(R.string.security_title), fontWeight = FontWeight.SemiBold)
                      Text(
                          stringResource(R.string.security_body),
                          style = MaterialTheme.typography.bodySmall,
                          color = CleveresMuted,
                      )
                  }
              }

              OutlinedTextField(
          ''',
              "security panel",
          )
          # Apply old input surface styling to the three text fields.
          activity = activity.replace(
              "                modifier = Modifier.fillMaxWidth(),\n            )",
              "                modifier = Modifier.fillMaxWidth(),\n                colors = vaultTextFieldColors(),\n            )",
              3,
          )
          activity = replace_once(
              activity,
              '''            Button(onClick = { save(false) }, enabled = canSave, modifier = Modifier.fillMaxWidth()) {
          ''',
              '''            Button(
                  onClick = { save(false) },
                  enabled = canSave,
                  modifier = Modifier.fillMaxWidth(),
                  colors = ButtonDefaults.buttonColors(
                      containerColor = CleveresAccent,
                      contentColor = CleveresBackground,
                      disabledContainerColor = CleveresPanelElevated,
                      disabledContentColor = CleveresMuted,
                  ),
              ) {
          ''',
              "save button",
          )
          activity_path.write_text(activity)

          # Add the visible language selector labels to every locale without changing the locale set.
          translations = {
              "values/strings.xml": ("Language", "System default"),
              "values-tr/strings.xml": ("Dil", "Sistem varsayılanı"),
              "values-de/strings.xml": ("Sprache", "Systemstandard"),
              "values-es/strings.xml": ("Idioma", "Predeterminado del sistema"),
              "values-ru/strings.xml": ("Язык", "Системный язык"),
              "values-in/strings.xml": ("Bahasa", "Default sistem"),
              "values-hi/strings.xml": ("भाषा", "सिस्टम डिफ़ॉल्ट"),
              "values-ar/strings.xml": ("اللغة", "إعداد النظام الافتراضي"),
              "values-zh-rCN/strings.xml": ("语言", "系统默认"),
          }
          res_root = Path("encryptor-app/src/main/res")
          for relative, (language, system_default) in translations.items():
              path = res_root / relative
              text = path.read_text()
              if 'name="language"' in text or 'name="system_default"' in text:
                  raise SystemExit(f"locale labels already exist unexpectedly in {path}")
              text = text.replace(
                  "</resources>",
                  f'    <string name="language">{language}</string>\n'
                  f'    <string name="system_default">{system_default}</string>\n'
                  "</resources>",
              )
              path.write_text(text)

          # Permanent startup-order regression test for the Android adapter.
          startup_test = Path("service/src/test/java/cleveres/tricky/cleverestech/MainStartupContractTest.kt")
          startup_test.write_text(r'''package cleveres.tricky.cleverestech

          import java.io.File
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class MainStartupContractTest {
              @Test
              fun `web ui adapter registers before backend readiness gate`() {
                  val source = locate("src/main/java/cleveres/tricky/cleverestech/Main.kt", "service/src/main/java/cleveres/tricky/cleverestech/Main.kt").readText()
                  val mainStart = source.indexOf("fun main(args: Array<String>)")
                  val registration = source.indexOf("startWebUiBridge(configDir, isTampered)", mainStart)
                  val backendWait = source.indexOf("NativeBackend.awaitReady(BACKEND_STARTUP_TIMEOUT_MS)", mainStart)

                  assertTrue("main entry point missing", mainStart >= 0)
                  assertTrue("native WebUI registration missing", registration > mainStart)
                  assertTrue("backend readiness gate missing", backendWait > mainStart)
                  assertTrue("WebUI must register before backend readiness can block startup", registration < backendWait)
              }

              private fun locate(vararg candidates: String): File =
                  candidates.map(::File).firstOrNull(File::isFile)
                      ?: error("Could not locate ${candidates.joinToString()}")
          }
          ''')

          # Permanent startup-order regression test for Linux peer credentials.
          rust_test = Path("rust/backend/tests/startup_privilege_order.rs")
          rust_test.parent.mkdir(parents=True, exist_ok=True)
          rust_test.write_text(r'''#[test]
          fn backend_listener_is_created_only_after_privilege_drop() {
              let source = include_str!("../src/main.rs");
              let start = source.find("fn run() -> io::Result<()> {").expect("run function");
              let end = source[start..]
                  .find("\n}\n\nfn parse_adapter_pid")
                  .map(|offset| start + offset)
                  .expect("run function end");
              let run = &source[start..end];

              let broker = run.find("take_broker_stream()?").expect("broker authentication");
              let harden = run.find("harden_process()?").expect("privilege drop");
              let listener = run
                  .find("bind_abstract(BACKEND_SOCKET_NAME)?")
                  .expect("backend listener");

              assert!(broker < harden, "the inherited root broker must be authenticated before dropping uid/gid");
              assert!(harden < listener, "the public backend listener must be bound after dropping to the unprivileged identity");
          }
          ''')

          # Extend mobile contract tests so visual/security/localization layers cannot be silently removed again.
          mobile_test_path = Path("encryptor-app/src/test/java/cleveres/tricky/encryptor/MobileSecurityContractTest.kt")
          mobile_test = mobile_test_path.read_text()
          mobile_test = replace_once(
              mobile_test,
              '''        assertTrue(activity.contains("WindowManager.LayoutParams.FLAG_SECURE"))
              assertTrue(activity.contains("context.noBackupFilesDir"))
          ''',
              '''        assertTrue(activity.contains("WindowManager.LayoutParams.FLAG_SECURE"))
              assertTrue(activity.contains("private fun CleveresTheme"))
              assertTrue(activity.contains("private fun LanguagePicker"))
              assertTrue(activity.contains("LocaleManager::class.java"))
              assertTrue(activity.contains("Color(0xFFE7E5E4)"))
              assertTrue(activity.contains("context.noBackupFilesDir"))
          ''',
              "mobile UI contract",
          )
          mobile_test_path.write_text(mobile_test)

          locale_test_path = Path("encryptor-app/src/test/java/cleveres/tricky/encryptor/LocalizationParityTest.kt")
          locale_test = locale_test_path.read_text()
          locale_test = replace_once(
              locale_test,
              '''        assertEquals(setOf("en") + localeDirectories.values, configured)
              }
          ''',
              '''        assertEquals(setOf("en") + localeDirectories.values, configured)

              val activitySource =
                  locate(
                      "src/main/java/cleveres/tricky/encryptor/SecureMainActivity.kt",
                      "encryptor-app/src/main/java/cleveres/tricky/encryptor/SecureMainActivity.kt",
                  ).readText()
              assertTrue("In-app language picker is missing", activitySource.contains("private fun LanguagePicker"))
              for (locale in configured) {
                  assertTrue("In-app language picker is missing $locale", activitySource.contains("Language(\"$locale\""))
              }
              }
          ''',
              "localization picker contract",
          )
          locale_test_path.write_text(locale_test)
          PY

      - name: Format sources
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew ktlintFormat --warning-mode=fail --console=plain
          (cd rust && cargo fmt --all)

      - name: Verify startup regression gates
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :service:testDebugUnitTest --tests '*MainStartupContractTest' \
            :encryptor-app:testDebugUnitTest --tests '*LocalizationParityTest' \
            :encryptor-app:testDebugUnitTest --tests '*MobileSecurityContractTest' \
            --warning-mode=fail --console=plain
          (cd rust && cargo test -p cleverestricky-backend --test startup_privilege_order --verbose)

      - name: Run exact Android unit and lint gates
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew ktlintCheck \
            :service:testDebugUnitTest :stub:testDebugUnitTest :encryptor-app:testDebugUnitTest \
            :service:lintDebug :stub:lintDebug :encryptor-app:lintDebug \
            --warning-mode=fail --console=plain

      - name: Run Rust backend gates
        shell: bash
        run: |
          set -euo pipefail
          cd rust
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo clippy -p cleverestricky-backend --all-targets -- -D warnings
          cargo test -p cleverestricky-backend --verbose

      - name: Commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr953-deep-runtime-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: restore runtime startup and secure mobile UX'
          git push origin HEAD:agent/rust-first-service-redesign
