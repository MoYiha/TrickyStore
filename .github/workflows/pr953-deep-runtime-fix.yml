name: PR953 Deep Runtime Fix

on:
  push:
    branches: ["agent/rust-first-service-redesign"]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: retry PR953 deep runtime fix'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/rust-first-service-redesign
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Apply runtime and secure UX repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one regex match, found {count}")
              return updated

          # Backend: authenticate inherited root broker, drop privileges, THEN expose the
          # abstract listener. Android's SO_PEERCRED validation must observe uid/gid 9999.
          backend_path = Path("rust/backend/src/main.rs")
          backend = backend_path.read_text()
          backend = regex_once(
              backend,
              r"fn run\(\) -> io::Result<\(\)> \{\n\s*let adapter_pid = parse_adapter_pid\(\)\?;\n\s*backend_instance::initialize\(\)\?;\n\s*let mut broker = take_broker_stream\(\)\?;\n\s*let listener = bind_abstract\(BACKEND_SOCKET_NAME\)\?;\n\s*harden_process\(\)\?;\n\s*serve\(listener, adapter_pid, &mut broker\)\n\}",
              textwrap.dedent('''\
              fn run() -> io::Result<()> {
                  let adapter_pid = parse_adapter_pid()?;
                  // Authenticate the inherited privileged broker before permanently dropping
                  // credentials, then expose the backend listener only as the unprivileged uid/gid.
                  let mut broker = take_broker_stream()?;
                  harden_process()?;
                  backend_instance::initialize()?;
                  let listener = bind_abstract(BACKEND_SOCKET_NAME)?;
                  serve(listener, adapter_pid, &mut broker)
              }'''),
              "backend startup order",
          )
          backend_path.write_text(backend)

          # Android adapter: register WebUI before waiting for backend readiness so diagnostics
          # remain reachable and the adapter pid is published even while backend recovers.
          main_path = Path("service/src/main/java/cleveres/tricky/cleverestech/Main.kt")
          main = main_path.read_text()
          constants_anchor = "private const val BACKEND_STARTUP_TIMEOUT_MS = 30_000L\n"
          helper = textwrap.dedent('''\

          private const val WEB_UI_START_ATTEMPTS = 12
          private const val WEB_UI_START_INITIAL_DELAY_MS = 50L
          private const val WEB_UI_START_MAX_DELAY_MS = 1_000L

          private fun startWebUiBridge(
              configDir: File,
              isTampered: Boolean,
          ): WebUiBridge? {
              val bridge = WebUiBridge(WebServer(0, configDir, isTampered), configDir)
              var retryDelayMs = WEB_UI_START_INITIAL_DELAY_MS
              repeat(WEB_UI_START_ATTEMPTS) { attempt ->
                  try {
                      bridge.start()
                      if (attempt > 0) {
                          Logger.i("Native WebUI adapter registered after ${attempt + 1} attempts")
                      }
                      return bridge
                  } catch (error: Exception) {
                      Logger.e("Native WebUI adapter registration attempt ${attempt + 1} failed", error)
                  }

                  if (attempt + 1 < WEB_UI_START_ATTEMPTS) {
                      try {
                          Thread.sleep(retryDelayMs)
                      } catch (_: InterruptedException) {
                          Thread.currentThread().interrupt()
                          return null
                      }
                      retryDelayMs = minOf(retryDelayMs * 2, WEB_UI_START_MAX_DELAY_MS)
                  }
              }
              return null
          }
          ''')
          main = replace_once(main, constants_anchor, constants_anchor + helper, "Main helper insertion")

          old_tamper = textwrap.dedent('''\
                  if (isTampered) {
                      runCatching { WebUiBridge(WebServer(0, configDir, true), configDir).start() }
                          .onFailure { Logger.e("Failed to start native WebUI lockdown endpoint", it) }
                      Logger.e("Main: Running in tamper lockdown; native interceptors will not be registered")
                      while (true) {
                          delay(60000)
                      }
                  }

                  while (!NativeBackend.awaitReady(BACKEND_STARTUP_TIMEOUT_MS)) {
          ''')
          new_tamper = textwrap.dedent('''\
                  val webUiBridge = startWebUiBridge(configDir, isTampered)
                  if (webUiBridge == null) {
                      Logger.e("Main: Native WebUI adapter could not register; exiting for supervisor retry")
                      return@runBlocking
                  }

                  if (isTampered) {
                      Logger.e("Main: Running in tamper lockdown; native interceptors will not be registered")
                      while (true) {
                          delay(60000)
                      }
                  }

                  while (!NativeBackend.awaitReady(BACKEND_STARTUP_TIMEOUT_MS)) {
          ''')
          # These blocks live inside runBlocking with 8-space indentation. Add it after dedent.
          indent = "        "
          old_tamper = "\n".join(indent + line if line else "" for line in old_tamper.splitlines()) + "\n"
          new_tamper = "\n".join(indent + line if line else "" for line in new_tamper.splitlines()) + "\n"
          main = replace_once(main, old_tamper, new_tamper, "early WebUI registration")

          late_bridge = textwrap.dedent('''\
                  try {
                      WebUiBridge(WebServer(0, configDir), configDir).start()
                  } catch (e: Exception) {
                      KeyboxDirectoryRefreshWatcher.stop()
                      CertificatePolicyWatcher.stop()
                      Logger.e("Failed to start native WebUI bridge", e)
                      Logger.e("Main: Exiting so the module supervisor can restore native WebUI service")
                      return@runBlocking
                  }

          ''')
          late_bridge = "\n".join(indent + line if line else "" for line in late_bridge.splitlines()) + "\n"
          main = replace_once(main, late_bridge, "", "remove late WebUI registration")
          main_path.write_text(main)

          # Mobile app: keep FLAG_SECURE + Rust crypto + noBackup vault, restore the original
          # monochrome visual identity and an explicit application language chooser.
          activity_path = Path("encryptor-app/src/main/java/cleveres/tricky/encryptor/SecureMainActivity.kt")
          activity = activity_path.read_text()

          import_replacements = [
              ("import android.content.ClipData\n", "import android.app.Activity\nimport android.app.LocaleManager\nimport android.content.ClipData\n"),
              ("import android.content.Context\n", "import android.content.Context\nimport android.content.ContextWrapper\nimport android.content.res.Configuration\n"),
              ("import android.os.Bundle\n", "import android.os.Build\nimport android.os.Bundle\nimport android.os.LocaleList\n"),
              ("import androidx.compose.foundation.layout.height\n", "import androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.heightIn\n"),
              ("import androidx.compose.material.icons.filled.Add\n", "import androidx.compose.material.icons.filled.Add\nimport androidx.compose.material.icons.filled.Check\n"),
              ("import androidx.compose.material.icons.filled.Lock\n", "import androidx.compose.material.icons.filled.Language\nimport androidx.compose.material.icons.filled.Lock\n"),
              ("import androidx.compose.ui.Modifier\n", "import androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.platform.LocalContext\n"),
              ("import java.io.IOException\n", "import java.io.IOException\nimport java.util.Locale\n"),
          ]
          for old, new in import_replacements:
              activity = replace_once(activity, old, new, f"mobile import {old.strip()}")

          mobile_support = textwrap.dedent('''\
          private val CleveresVaultColors =
              darkColorScheme(
                  background = Color(0xFF0A0A0B),
                  surface = Color(0xFF151516),
                  surfaceVariant = Color(0xFF111113),
                  primary = Color(0xFFF4F4F5),
                  onPrimary = Color(0xFF0A0A0B),
                  primaryContainer = Color(0xFFE7E5E4),
                  onPrimaryContainer = Color(0xFF0A0A0B),
                  secondary = Color(0xFFE7E5E4),
                  onSecondary = Color(0xFF0A0A0B),
                  onBackground = Color(0xFFF4F4F5),
                  onSurface = Color(0xFFF4F4F5),
                  onSurfaceVariant = Color(0xFF9CA3AF),
                  outline = Color(0xFF303033),
                  error = Color(0xFFFB7185),
              )

          internal object LocaleController {
              internal data class Language(
                  val tag: String,
                  val label: String,
              )

              internal val languages =
                  listOf(
                      Language("", "System"),
                      Language("en", "English"),
                      Language("tr", "Türkçe"),
                      Language("de", "Deutsch"),
                      Language("es", "Español"),
                      Language("ru", "Русский"),
                      Language("ar", "العربية"),
                      Language("hi", "हिन्दी"),
                      Language("in", "Bahasa Indonesia"),
                      Language("zh-CN", "简体中文"),
                  )

              private const val PREFS = "cleveres_locale"
              private const val KEY = "language_tag"

              private fun storedTag(context: Context): String =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY, "").orEmpty()

              private fun normalizeTag(tag: String): String = if (tag == "id") "in" else tag

              internal fun selectedTag(context: Context): String {
                  if (Build.VERSION.SDK_INT >= 33) {
                      return normalizeTag(
                          context
                              .getSystemService(LocaleManager::class.java)
                              .applicationLocales
                              .toLanguageTags()
                              .substringBefore(','),
                      )
                  }
                  return normalizeTag(storedTag(context))
              }

              internal fun apply(
                  activity: Activity,
                  tag: String,
              ) {
                  require(languages.any { it.tag == tag }) { "Unsupported locale" }
                  if (Build.VERSION.SDK_INT >= 33) {
                      activity.getSystemService(LocaleManager::class.java).applicationLocales =
                          if (tag.isBlank()) LocaleList.getEmptyLocaleList() else LocaleList.forLanguageTags(tag)
                  } else {
                      activity.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .edit()
                          .apply {
                              if (tag.isBlank()) remove(KEY) else putString(KEY, tag)
                          }
                          .apply()
                      activity.recreate()
                  }
              }

              internal fun wrap(context: Context): Context {
                  if (Build.VERSION.SDK_INT >= 33) return context
                  val tag = storedTag(context)
                  if (tag.isBlank()) return context
                  val locale = Locale.forLanguageTag(tag)
                  val configuration = Configuration(context.resources.configuration)
                  configuration.setLocale(locale)
                  configuration.setLayoutDirection(locale)
                  return context.createConfigurationContext(configuration)
              }
          }

          private fun Context.findActivity(): Activity? {
              var current: Context = this
              while (current is ContextWrapper) {
                  if (current is Activity) return current
                  current = current.baseContext
              }
              return current as? Activity
          }

          @Composable
          private fun LanguagePicker() {
              val context = LocalContext.current
              val selectedTag = LocaleController.selectedTag(context)
              val selected = LocaleController.languages.firstOrNull { it.tag == selectedTag } ?: LocaleController.languages.first()
              val systemDefault = stringResource(R.string.system_default)
              var open by remember { mutableStateOf(false) }

              OutlinedButton(onClick = { open = true }) {
                  Icon(Icons.Default.Language, contentDescription = stringResource(R.string.language))
                  Text(
                      text = if (selected.tag.isBlank()) systemDefault else selected.label,
                      modifier = Modifier.padding(start = 8.dp),
                  )
              }

              if (open) {
                  AlertDialog(
                      onDismissRequest = { open = false },
                      title = { Text(stringResource(R.string.language)) },
                      text = {
                          LazyColumn(modifier = Modifier.heightIn(max = 420.dp)) {
                              items(LocaleController.languages, key = { it.tag }) { language ->
                                  TextButton(
                                      onClick = {
                                          open = false
                                          context.findActivity()?.let { LocaleController.apply(it, language.tag) }
                                      },
                                      modifier = Modifier.fillMaxWidth(),
                                  ) {
                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          verticalAlignment = Alignment.CenterVertically,
                                      ) {
                                          Text(
                                              text = if (language.tag.isBlank()) systemDefault else language.label,
                                              modifier = Modifier.weight(1f),
                                          )
                                          if (language.tag == selected.tag) {
                                              Icon(Icons.Default.Check, contentDescription = null)
                                          }
                                      }
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { open = false }) {
                              Text(stringResource(R.string.cancel))
                          }
                      },
                  )
              }
          }

          ''')
          activity = replace_once(activity, "class SecureMainActivity : ComponentActivity() {\n", mobile_support + "class SecureMainActivity : ComponentActivity() {\n", "mobile support insertion")
          activity = replace_once(
              activity,
              "class SecureMainActivity : ComponentActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n",
              "class SecureMainActivity : ComponentActivity() {\n    override fun attachBaseContext(newBase: Context) {\n        super.attachBaseContext(LocaleController.wrap(newBase))\n    }\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n",
              "legacy locale context",
          )
          activity = replace_once(
              activity,
              "MaterialTheme(colorScheme = darkColorScheme()) {",
              "MaterialTheme(colorScheme = CleveresVaultColors) {",
              "monochrome theme",
          )
          activity = activity.replace("androidx.compose.ui.platform.LocalContext.current", "LocalContext.current")
          activity = replace_once(
              activity,
              "                Text(text = stringResource(R.string.vault_summary, files.size, formatBytes(files.sumOf { it.length() })))\n",
              "                Column(horizontalAlignment = Alignment.End) {\n                    LanguagePicker()\n                    Text(\n                        text = stringResource(R.string.vault_summary, files.size, formatBytes(files.sumOf { it.length() })),\n                        style = MaterialTheme.typography.bodySmall,\n                    )\n                }\n",
              "language picker header",
          )
          activity_path.write_text(activity)

          translations = {
              "values/strings.xml": ("Language", "System default"),
              "values-tr/strings.xml": ("Dil", "Sistem varsayılanı"),
              "values-de/strings.xml": ("Sprache", "Systemstandard"),
              "values-es/strings.xml": ("Idioma", "Predeterminado del sistema"),
              "values-ru/strings.xml": ("Язык", "Системный язык"),
              "values-in/strings.xml": ("Bahasa", "Default sistem"),
              "values-hi/strings.xml": ("भाषा", "सिस्टम डिफ़ॉल्ट"),
              "values-ar/strings.xml": ("اللغة", "إعداد النظام الافتراضي"),
              "values-zh-rCN/strings.xml": ("语言", "系统默认"),
          }
          res_root = Path("encryptor-app/src/main/res")
          for relative, (language, system_default) in translations.items():
              path = res_root / relative
              text = path.read_text()
              if 'name="language"' in text or 'name="system_default"' in text:
                  raise SystemExit(f"locale labels already exist unexpectedly in {path}")
              text = text.replace(
                  "</resources>",
                  f'    <string name="language">{language}</string>\n'
                  f'    <string name="system_default">{system_default}</string>\n'
                  "</resources>",
              )
              path.write_text(text)

          startup_test = Path("service/src/test/java/cleveres/tricky/cleverestech/MainStartupContractTest.kt")
          startup_test.write_text(textwrap.dedent('''\
          package cleveres.tricky.cleverestech

          import java.io.File
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class MainStartupContractTest {
              @Test
              fun `web ui adapter registers before backend readiness gate`() {
                  val source = locateRoot().resolve("service/src/main/java/cleveres/tricky/cleverestech/Main.kt").readText()
                  val entry = source.indexOf("fun main(args: Array<String>)")
                  val registration = source.indexOf("startWebUiBridge(configDir, isTampered)", entry)
                  val backendWait = source.indexOf("NativeBackend.awaitReady(BACKEND_STARTUP_TIMEOUT_MS)", entry)
                  assertTrue(entry >= 0)
                  assertTrue(registration > entry)
                  assertTrue(backendWait > registration)
              }

              private fun locateRoot(): File {
                  var current = File(requireNotNull(System.getProperty("user.dir"))).canonicalFile
                  repeat(6) {
                      if (File(current, "service").isDirectory && File(current, "rust").isDirectory) return current
                      current = current.parentFile ?: return@repeat
                  }
                  error("Repository root not found")
              }
          }
          '''))

          rust_test = Path("rust/backend/tests/startup_privilege_order.rs")
          rust_test.parent.mkdir(parents=True, exist_ok=True)
          rust_test.write_text(textwrap.dedent('''\
          #[test]
          fn backend_listener_is_created_only_after_privilege_drop() {
              let source = include_str!("../src/main.rs");
              let start = source.find("fn run() -> io::Result<()> {").expect("run function");
              let end = source[start..]
                  .find("\n}\n\nfn parse_adapter_pid")
                  .map(|offset| start + offset)
                  .expect("run function end");
              let run = &source[start..end];

              let broker = run.find("take_broker_stream()?").expect("broker authentication");
              let harden = run.find("harden_process()?").expect("privilege drop");
              let listener = run.find("bind_abstract(BACKEND_SOCKET_NAME)?").expect("backend listener");
              assert!(broker < harden);
              assert!(harden < listener);
          }
          '''))

          mobile_test_path = Path("encryptor-app/src/test/java/cleveres/tricky/encryptor/MobileSecurityContractTest.kt")
          mobile_test = mobile_test_path.read_text()
          mobile_test = replace_once(
              mobile_test,
              '        assertTrue(activity.contains("WindowManager.LayoutParams.FLAG_SECURE"))\n',
              '        assertTrue(activity.contains("WindowManager.LayoutParams.FLAG_SECURE"))\n'
              '        assertTrue(activity.contains("CleveresVaultColors"))\n'
              '        assertTrue(activity.contains("private fun LanguagePicker"))\n'
              '        assertTrue(activity.contains("LocaleManager::class.java"))\n',
              "mobile UI contract",
          )
          mobile_test_path.write_text(mobile_test)

          locale_test_path = Path("encryptor-app/src/test/java/cleveres/tricky/encryptor/LocalizationParityTest.kt")
          locale_test = locale_test_path.read_text()
          locale_anchor = '        assertEquals(setOf("en") + localeDirectories.values, configured)\n'
          locale_check = textwrap.dedent('''\

                  val activitySource =
                      locate(
                          "src/main/java/cleveres/tricky/encryptor/SecureMainActivity.kt",
                          "encryptor-app/src/main/java/cleveres/tricky/encryptor/SecureMainActivity.kt",
                      ).readText()
                  assertTrue("In-app language picker is missing", activitySource.contains("private fun LanguagePicker"))
                  for (locale in configured) {
                      assertTrue("In-app language picker is missing $locale", activitySource.contains("Language(\\\"$locale\\\""))
                  }
          ''')
          locale_check = "\n".join("        " + line if line else "" for line in locale_check.splitlines()) + "\n"
          locale_test = replace_once(locale_test, locale_anchor, locale_anchor + locale_check, "locale picker contract")
          locale_test_path.write_text(locale_test)
          PY

      - name: Format changed sources
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew ktlintFormat --warning-mode=fail --console=plain
          (cd rust && cargo fmt --all)

      - name: Run targeted regression gates
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :service:testDebugUnitTest --tests '*MainStartupContractTest' \
            :encryptor-app:testDebugUnitTest --tests '*LocalizationParityTest' \
            :encryptor-app:testDebugUnitTest --tests '*MobileSecurityContractTest' \
            --warning-mode=fail --console=plain
          (cd rust && cargo test -p cleverestricky-backend --test startup_privilege_order --verbose)

      - name: Run exact Android unit and lint gates
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew ktlintCheck \
            :service:testDebugUnitTest :stub:testDebugUnitTest :encryptor-app:testDebugUnitTest \
            :service:lintDebug :stub:lintDebug :encryptor-app:lintDebug \
            --warning-mode=fail --console=plain

      - name: Run Rust backend gates
        shell: bash
        run: |
          set -euo pipefail
          cd rust
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo clippy -p cleverestricky-backend --all-targets -- -D warnings
          cargo test -p cleverestricky-backend --verbose

      - name: Commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr953-deep-runtime-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: restore runtime startup and secure mobile UX'
          git push origin HEAD:agent/rust-first-service-redesign
