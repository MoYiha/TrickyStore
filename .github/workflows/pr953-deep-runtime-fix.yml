          activity = activity.replace(
              "import java.io.IOException\n",
              "import java.io.IOException\nimport java.util.Locale\n",
              1,
          )

          theme_and_locale = r'''
          private val CleveresBackground = Color(0xFF0A0A0B)
          private val CleveresForeground = Color(0xFFF4F4F5)
          private val CleveresMuted = Color(0xFF9CA3AF)
          private val CleveresAccent = Color(0xFFE7E5E4)
          private val CleveresPanel = Color(0xFF151516)
          private val CleveresPanelElevated = Color(0xFF1C1C1E)
          private val CleveresBorder = Color(0xFF303033)
          private val CleveresInputBackground = Color(0xFF111113)
          private val CleveresSuccess = Color(0xFF4ADE80)
          private val CleveresDanger = Color(0xFFFB7185)

          @Composable
          private fun CleveresTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme =
                      darkColorScheme(
                          background = CleveresBackground,
                          surface = CleveresPanel,
                          surfaceVariant = CleveresInputBackground,
