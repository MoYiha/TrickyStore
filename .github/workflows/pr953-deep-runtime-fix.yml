                      modifier = Modifier.fillMaxWidth(),
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(14.dp),
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          Surface(
                              shape = RoundedCornerShape(12.dp),
                              color = CleveresPanelElevated,
                          ) {
                              Icon(
                                  Icons.Default.Lock,
                                  contentDescription = null,
                                  tint = CleveresSuccess,
                                  modifier = Modifier.padding(10.dp),
                              )
                          }
                          Column(modifier = Modifier.weight(1f).padding(start = 12.dp)) {
                              Text(stringResource(R.string.vault_title), fontWeight = FontWeight.SemiBold)
                              Text(
                                  stringResource(R.string.vault_summary, files.size, formatBytes(files.sumOf { it.length() })),
                                  color = CleveresMuted,
                                  style = MaterialTheme.typography.bodySmall,
                              )
                          }
                      }
                  }
              }
          },
          '''
          activity = replace_once(activity, old_top, new_top, "vault header")
          activity = replace_once(
