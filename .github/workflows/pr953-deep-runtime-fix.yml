name: PR953 Deep Runtime Fix

on:
  push:
    branches: ["agent/rust-first-service-redesign"]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: install PR953 deep runtime fix runner'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/rust-first-service-redesign
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Apply deep runtime and mobile UI repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # 1) The unprivileged backend must bind/listen only after dropping credentials.
          backend_path = Path("rust/backend/src/main.rs")
          backend = backend_path.read_text()
          backend = replace_once(
              backend,
              '''fn run() -> io::Result<()> {
              let adapter_pid = parse_adapter_pid()?;
              backend_instance::initialize()?;
              let mut broker = take_broker_stream()?;
              let listener = bind_abstract(BACKEND_SOCKET_NAME)?;
              harden_process()?;
              serve(listener, adapter_pid, &mut broker)
          }
          ''',
              '''fn run() -> io::Result<()> {
              let adapter_pid = parse_adapter_pid()?;
              // Authenticate the inherited privileged broker while we still have the original
              // process credentials, then permanently drop privileges before exposing any listener.
              let mut broker = take_broker_stream()?;
              harden_process()?;
              backend_instance::initialize()?;
              let listener = bind_abstract(BACKEND_SOCKET_NAME)?;
              serve(listener, adapter_pid, &mut broker)
          }
          ''',
              "backend startup order",
          )
          backend_path.write_text(backend)

          # 2) Register the Android WebUI adapter before waiting for the Rust backend. This keeps
          # diagnostics reachable during backend recovery and closes the spawn/pid-publication race.
          main_path = Path("service/src/main/java/cleveres/tricky/cleverestech/Main.kt")
          main = main_path.read_text()
          main = replace_once(
              main,
              '''private const val CONFIG_DIR_MODE = 448
          private const val BACKEND_STARTUP_TIMEOUT_MS = 30_000L
          ''',
              '''private const val CONFIG_DIR_MODE = 448
          private const val BACKEND_STARTUP_TIMEOUT_MS = 30_000L
          private const val WEB_UI_START_ATTEMPTS = 8
          private const val WEB_UI_START_INITIAL_DELAY_MS = 50L
          private const val WEB_UI_START_MAX_DELAY_MS = 1_000L

          private fun startWebUiBridge(
              configDir: File,
              isTampered: Boolean,
          ): WebUiBridge? {
              val bridge = WebUiBridge(WebServer(0, configDir, isTampered), configDir)
              var retryDelayMs = WEB_UI_START_INITIAL_DELAY_MS
              repeat(WEB_UI_START_ATTEMPTS) { attempt ->
                  try {
                      bridge.start()
                      if (attempt > 0) {
                          Logger.i("Native WebUI adapter registered after ${attempt + 1} attempts")
                      }
                      return bridge
                  } catch (error: Exception) {
                      Logger.e("Native WebUI adapter registration attempt ${attempt + 1} failed", error)
                  }

                  if (attempt + 1 < WEB_UI_START_ATTEMPTS) {
                      try {
                          Thread.sleep(retryDelayMs)
                      } catch (_: InterruptedException) {
                          Thread.currentThread().interrupt()
                          return null
                      }
                      retryDelayMs = minOf(retryDelayMs * 2, WEB_UI_START_MAX_DELAY_MS)
                  }
              }
              return null
          }
          ''',
              "Main startup helper",
          )
          main = replace_once(
              main,
              '''        if (isTampered) {
              runCatching { WebUiBridge(WebServer(0, configDir, true), configDir).start() }
                  .onFailure { Logger.e("Failed to start native WebUI lockdown endpoint", it) }
              Logger.e("Main: Running in tamper lockdown; native interceptors will not be registered")
              while (true) {
                  delay(60000)
              }
          }

          while (!NativeBackend.awaitReady(BACKEND_STARTUP_TIMEOUT_MS)) {
          ''',
              '''        val webUiBridge = startWebUiBridge(configDir, isTampered)
          if (webUiBridge == null) {
              Logger.e("Main: Native WebUI adapter could not register; exiting for supervisor retry")
              return@runBlocking
          }

          if (isTampered) {
              Logger.e("Main: Running in tamper lockdown; native interceptors will not be registered")
              while (true) {
                  delay(60000)
              }
          }

          while (!NativeBackend.awaitReady(BACKEND_STARTUP_TIMEOUT_MS)) {
          ''',
              "early WebUI registration",
          )
          main = replace_once(
              main,
              '''        try {
              WebUiBridge(WebServer(0, configDir), configDir).start()
          } catch (e: Exception) {
              KeyboxDirectoryRefreshWatcher.stop()
              CertificatePolicyWatcher.stop()
              Logger.e("Failed to start native WebUI bridge", e)
              Logger.e("Main: Exiting so the module supervisor can restore native WebUI service")
              return@runBlocking
          }

          KeyboxAutoCleaner.start()
          ''',
              '''        KeyboxAutoCleaner.start()
          ''',
              "remove late WebUI registration",
          )
          main_path.write_text(main)

          # 3) Preserve the hardened Rust/no-backup mobile architecture, but restore the original
          # black/white visual identity and add an explicit in-app language chooser.
          activity_path = Path("encryptor-app/src/main/java/cleveres/tricky/encryptor/SecureMainActivity.kt")
          activity = activity_path.read_text()

          activity = activity.replace(
              "import android.content.ClipData\n",
              "import android.app.Activity\nimport android.app.LocaleManager\nimport android.content.ClipData\n",
              1,
          )
          activity = activity.replace(
              "import android.content.Context\n",
              "import android.content.Context\nimport android.content.ContextWrapper\nimport android.content.res.Configuration\n",
              1,
          )
          activity = activity.replace(
              "import android.os.Bundle\n",
              "import android.os.Build\nimport android.os.Bundle\nimport android.os.LocaleList\n",
              1,
          )
          activity = activity.replace(
              "import androidx.compose.foundation.layout.Arrangement\n",
              "import androidx.compose.foundation.BorderStroke\nimport androidx.compose.foundation.layout.Arrangement\n",
              1,
          )
          activity = activity.replace(
              "import androidx.compose.foundation.lazy.items\n",
              "import androidx.compose.foundation.lazy.items\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.shape.CircleShape\nimport androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.foundation.verticalScroll\n",
              1,
          )
          activity = activity.replace(
              "import androidx.compose.material.icons.filled.Add\n",
              "import androidx.compose.material.icons.filled.Add\nimport androidx.compose.material.icons.filled.Check\n",
              1,
          )
          activity = activity.replace(
              "import androidx.compose.material.icons.filled.Lock\n",
              "import androidx.compose.material.icons.filled.Language\nimport androidx.compose.material.icons.filled.Lock\n",
              1,
          )
          activity = activity.replace(
              "import androidx.compose.material3.Button\n",
              "import androidx.compose.material3.Button\nimport androidx.compose.material3.ButtonDefaults\nimport androidx.compose.material3.Card\nimport androidx.compose.material3.CardDefaults\n",
              1,
          )
          activity = activity.replace(
              "import androidx.compose.material3.OutlinedTextField\n",
              "import androidx.compose.material3.OutlinedTextField\nimport androidx.compose.material3.OutlinedTextFieldDefaults\n",
              1,
          )
          activity = activity.replace(
              "import androidx.compose.material3.TextButton\n",
              "import androidx.compose.material3.Surface\nimport androidx.compose.material3.TextButton\n",
              1,
          )
          activity = activity.replace(
              "import androidx.compose.material3.TopAppBar\n",
              "import androidx.compose.material3.TopAppBar\nimport androidx.compose.material3.TopAppBarDefaults\n",
              1,
          )
          activity = activity.replace(
              "import androidx.compose.ui.Modifier\n",
              "import androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.platform.LocalContext\n",
              1,
