name: PR953 Deep Runtime Fix

on:
  push:
    branches: ["agent/rust-first-service-redesign"]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: apply PR953 deep runtime repair'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/rust-first-service-redesign
          fetch-depth: 0

      - name: Apply device-runtime and mobile UX repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # Backend listener must be created after permanent uid/gid drop so Android's
          # SO_PEERCRED verification sees the intended unprivileged identity.
          p = Path("rust/backend/src/main.rs")
          s = p.read_text()
          old = '''fn run() -> io::Result<()> {
              let adapter_pid = parse_adapter_pid()?;
              backend_instance::initialize()?;
              let mut broker = take_broker_stream()?;
              let listener = bind_abstract(BACKEND_SOCKET_NAME)?;
              harden_process()?;
              serve(listener, adapter_pid, &mut broker)
          }'''.replace("          ", "")
          new = '''fn run() -> io::Result<()> {
              let adapter_pid = parse_adapter_pid()?;
              // Authenticate the inherited privileged broker first, then drop credentials
              // permanently before exposing any listener to Android clients.
              let mut broker = take_broker_stream()?;
              harden_process()?;
              backend_instance::initialize()?;
              let listener = bind_abstract(BACKEND_SOCKET_NAME)?;
              serve(listener, adapter_pid, &mut broker)
          }'''.replace("          ", "")
          s = one(s, old, new, "backend startup order")
          p.write_text(s)

          # Register the Android WebUI adapter before waiting for Rust backend readiness.
          # This keeps diagnostics and resource/file service reachable during backend recovery.
          p = Path("service/src/main/java/cleveres/tricky/cleverestech/Main.kt")
          s = p.read_text()
          anchor = "private const val BACKEND_STARTUP_TIMEOUT_MS = 30_000L\n"
          helper = r'''
          private const val WEB_UI_START_ATTEMPTS = 12
          private const val WEB_UI_START_INITIAL_DELAY_MS = 50L
          private const val WEB_UI_START_MAX_DELAY_MS = 1_000L

          private fun startWebUiBridge(
              configDir: File,
              isTampered: Boolean,
          ): WebUiBridge? {
              val bridge = WebUiBridge(WebServer(0, configDir, isTampered), configDir)
              var retryDelayMs = WEB_UI_START_INITIAL_DELAY_MS
              repeat(WEB_UI_START_ATTEMPTS) { attempt ->
                  try {
                      bridge.start()
                      if (attempt > 0) {
                          Logger.i("Native WebUI adapter registered after ${attempt + 1} attempts")
                      }
                      return bridge
                  } catch (error: Exception) {
                      Logger.e("Native WebUI adapter registration attempt ${attempt + 1} failed", error)
                  }
                  if (attempt + 1 < WEB_UI_START_ATTEMPTS) {
                      try {
                          Thread.sleep(retryDelayMs)
                      } catch (_: InterruptedException) {
                          Thread.currentThread().interrupt()
                          return null
                      }
                      retryDelayMs = minOf(retryDelayMs * 2, WEB_UI_START_MAX_DELAY_MS)
                  }
              }
              return null
          }

          '''.replace("          ", "")
          s = one(s, anchor, anchor + helper, "webui helper")
          old = '''        if (isTampered) {
              runCatching { WebUiBridge(WebServer(0, configDir, true), configDir).start() }
                  .onFailure { Logger.e("Failed to start native WebUI lockdown endpoint", it) }
              Logger.e("Main: Running in tamper lockdown; native interceptors will not be registered")
              while (true) {
                  delay(60000)
              }
          }

          while (!NativeBackend.awaitReady(BACKEND_STARTUP_TIMEOUT_MS)) {'''.replace("          ", "")
          new = '''        val webUiBridge = startWebUiBridge(configDir, isTampered)
          if (webUiBridge == null) {
              Logger.e("Main: Native WebUI adapter could not register; exiting for supervisor retry")
              return@runBlocking
          }

          if (isTampered) {
              Logger.e("Main: Running in tamper lockdown; native interceptors will not be registered")
              while (true) {
                  delay(60000)
              }
          }

          while (!NativeBackend.awaitReady(BACKEND_STARTUP_TIMEOUT_MS)) {'''.replace("          ", "")
          s = one(s, old, new, "early webui registration")
          late = '''        try {
              WebUiBridge(WebServer(0, configDir), configDir).start()
          } catch (e: Exception) {
              KeyboxDirectoryRefreshWatcher.stop()
              CertificatePolicyWatcher.stop()
              Logger.e("Failed to start native WebUI bridge", e)
              Logger.e("Main: Exiting so the module supervisor can restore native WebUI service")
              return@runBlocking
          }

          '''.replace("          ", "")
          s = one(s, late, "", "remove late webui registration")
          p.write_text(s)

          # Keep hardened SecureMainActivity, but restore the deliberate monochrome palette
          # and app-local language chooser instead of Material defaults.
          p = Path("encryptor-app/src/main/java/cleveres/tricky/encryptor/SecureMainActivity.kt")
          s = p.read_text()
          s = one(
              s,
              "class SecureMainActivity : ComponentActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {",
              "class SecureMainActivity : ComponentActivity() {\n    override fun attachBaseContext(newBase: Context) {\n        super.attachBaseContext(LocaleController.wrap(newBase))\n    }\n\n    override fun onCreate(savedInstanceState: Bundle?) {",
              "locale base context",
          )
          s = one(s, "MaterialTheme(colorScheme = darkColorScheme()) {", "MaterialTheme(colorScheme = CleveresVaultColors) {", "vault theme")
          summary = "                Text(text = stringResource(R.string.vault_summary, files.size, formatBytes(files.sumOf { it.length() })))\n"
          replacement = '''                Column(horizontalAlignment = Alignment.End) {
                      LanguagePicker()
                      Text(
                          text = stringResource(R.string.vault_summary, files.size, formatBytes(files.sumOf { it.length() })),
                          style = MaterialTheme.typography.bodySmall,
                      )
                  }
          '''.replace("          ", "")
          s = one(s, summary, replacement, "language picker header")
          p.write_text(s)

          Path("encryptor-app/src/main/java/cleveres/tricky/encryptor/VaultExperience.kt").write_text(r'''package cleveres.tricky.encryptor

          import android.app.Activity
          import android.app.LocaleManager
          import android.content.Context
          import android.content.ContextWrapper
          import android.content.res.Configuration
          import android.os.Build
          import android.os.LocaleList
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.heightIn
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Check
          import androidx.compose.material.icons.filled.Language
          import androidx.compose.material3.AlertDialog
          import androidx.compose.material3.Icon
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.OutlinedButton
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.stringResource
          import androidx.compose.ui.unit.dp
          import java.util.Locale

          internal val CleveresVaultColors =
              darkColorScheme(
                  background = Color(0xFF0A0A0B),
                  surface = Color(0xFF151516),
                  surfaceVariant = Color(0xFF111113),
                  primary = Color(0xFFF4F4F5),
                  onPrimary = Color(0xFF0A0A0B),
                  primaryContainer = Color(0xFFE7E5E4),
                  onPrimaryContainer = Color(0xFF0A0A0B),
                  secondary = Color(0xFFE7E5E4),
                  onSecondary = Color(0xFF0A0A0B),
                  onBackground = Color(0xFFF4F4F5),
                  onSurface = Color(0xFFF4F4F5),
                  onSurfaceVariant = Color(0xFF9CA3AF),
                  outline = Color(0xFF303033),
                  error = Color(0xFFFB7185),
              )

          internal object LocaleController {
              internal data class Language(val tag: String, val label: String)

              internal val languages =
                  listOf(
                      Language("", "System"),
                      Language("en", "English"),
                      Language("tr", "Türkçe"),
                      Language("de", "Deutsch"),
                      Language("es", "Español"),
                      Language("ru", "Русский"),
                      Language("ar", "العربية"),
                      Language("hi", "हिन्दी"),
                      Language("in", "Bahasa Indonesia"),
                      Language("zh-CN", "简体中文"),
                  )

              private const val PREFS = "cleveres_locale"
              private const val KEY = "language_tag"

              private fun storedTag(context: Context): String =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY, "").orEmpty()

              private fun normalizeTag(tag: String): String = if (tag == "id") "in" else tag

              internal fun selectedTag(context: Context): String =
                  if (Build.VERSION.SDK_INT >= 33) {
                      normalizeTag(
                          context.getSystemService(LocaleManager::class.java)
                              .applicationLocales
                              .toLanguageTags()
                              .substringBefore(','),
                      )
                  } else {
                      normalizeTag(storedTag(context))
                  }

              internal fun apply(activity: Activity, tag: String) {
                  require(languages.any { it.tag == tag }) { "Unsupported locale" }
                  if (Build.VERSION.SDK_INT >= 33) {
                      activity.getSystemService(LocaleManager::class.java).applicationLocales =
                          if (tag.isBlank()) LocaleList.getEmptyLocaleList() else LocaleList.forLanguageTags(tag)
                  } else {
                      activity.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .edit()
                          .apply {
                              if (tag.isBlank()) remove(KEY) else putString(KEY, tag)
                          }
                          .apply()
                      activity.recreate()
                  }
              }

              internal fun wrap(context: Context): Context {
                  if (Build.VERSION.SDK_INT >= 33) return context
                  val tag = storedTag(context)
                  if (tag.isBlank()) return context
                  val locale = Locale.forLanguageTag(tag)
                  val configuration = Configuration(context.resources.configuration)
                  configuration.setLocale(locale)
                  configuration.setLayoutDirection(locale)
                  return context.createConfigurationContext(configuration)
              }
          }

          private fun Context.findActivity(): Activity? {
              var current: Context = this
              while (current is ContextWrapper) {
                  if (current is Activity) return current
                  current = current.baseContext
              }
              return current as? Activity
          }

          @Composable
          internal fun LanguagePicker() {
              val context = LocalContext.current
              val selectedTag = LocaleController.selectedTag(context)
              val selected = LocaleController.languages.firstOrNull { it.tag == selectedTag } ?: LocaleController.languages.first()
              val systemDefault = stringResource(R.string.system_default)
              var open by remember { mutableStateOf(false) }

              OutlinedButton(onClick = { open = true }) {
                  Icon(Icons.Default.Language, contentDescription = stringResource(R.string.language))
                  Text(
                      text = if (selected.tag.isBlank()) systemDefault else selected.label,
                      modifier = Modifier.padding(start = 8.dp),
                  )
              }

              if (open) {
                  AlertDialog(
                      onDismissRequest = { open = false },
                      title = { Text(stringResource(R.string.language)) },
                      text = {
                          LazyColumn(modifier = Modifier.heightIn(max = 420.dp)) {
                              items(LocaleController.languages, key = { it.tag }) { language ->
                                  TextButton(
                                      onClick = {
                                          open = false
                                          context.findActivity()?.let { LocaleController.apply(it, language.tag) }
                                      },
                                      modifier = Modifier.fillMaxWidth(),
                                  ) {
                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          verticalAlignment = Alignment.CenterVertically,
                                      ) {
                                          Text(
                                              text = if (language.tag.isBlank()) systemDefault else language.label,
                                              modifier = Modifier.weight(1f),
                                          )
                                          if (language.tag == selected.tag) {
                                              Icon(Icons.Default.Check, contentDescription = null)
                                          }
                                      }
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { open = false }) {
                              Text(stringResource(R.string.cancel))
                          }
                      },
                  )
              }
          }
          '''.replace("          ", ""))

          translations = {
              "values/strings.xml": ("Language", "System default"),
              "values-tr/strings.xml": ("Dil", "Sistem varsayılanı"),
              "values-de/strings.xml": ("Sprache", "Systemstandard"),
              "values-es/strings.xml": ("Idioma", "Predeterminado del sistema"),
              "values-ru/strings.xml": ("Язык", "Системный язык"),
              "values-in/strings.xml": ("Bahasa", "Default sistem"),
              "values-hi/strings.xml": ("भाषा", "सिस्टम डिफ़ॉल्ट"),
              "values-ar/strings.xml": ("اللغة", "إعداد النظام الافتراضي"),
              "values-zh-rCN/strings.xml": ("语言", "系统默认"),
          }
          root = Path("encryptor-app/src/main/res")
          for rel, (language, system_default) in translations.items():
              path = root / rel
              text = path.read_text()
              if 'name="language"' in text:
                  raise SystemExit(f"language labels already exist: {path}")
              text = text.replace(
                  "</resources>",
                  f'    <string name="language">{language}</string>\n'
                  f'    <string name="system_default">{system_default}</string>\n'
                  "</resources>",
              )
              path.write_text(text)

          Path("service/src/test/java/cleveres/tricky/cleverestech/MainStartupContractTest.kt").write_text(r'''package cleveres.tricky.cleverestech

          import java.io.File
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class MainStartupContractTest {
              @Test
              fun `web ui adapter registers before backend readiness gate`() {
                  val root = locateRoot()
                  val source = File(root, "service/src/main/java/cleveres/tricky/cleverestech/Main.kt").readText()
                  val entry = source.indexOf("fun main(args: Array<String>)")
                  val registration = source.indexOf("startWebUiBridge(configDir, isTampered)", entry)
                  val backendWait = source.indexOf("NativeBackend.awaitReady(BACKEND_STARTUP_TIMEOUT_MS)", entry)
                  assertTrue(entry >= 0)
                  assertTrue(registration > entry)
                  assertTrue(backendWait > registration)
              }

              private fun locateRoot(): File {
                  var current = File(requireNotNull(System.getProperty("user.dir"))).canonicalFile
                  repeat(6) {
                      if (File(current, "service").isDirectory && File(current, "rust").isDirectory) return current
                      current = current.parentFile ?: return@repeat
                  }
                  error("Repository root not found")
              }
          }
          '''.replace("          ", ""))

          Path("rust/backend/tests/startup_privilege_order.rs").apply {
              parentFile.mkdirs()
              write_text = None
          }
          Path("rust/backend/tests/startup_privilege_order.rs").write_text(r'''#[test]
          fn backend_listener_is_created_only_after_privilege_drop() {
              let source = include_str!("../src/main.rs");
              let start = source.find("fn run() -> io::Result<()> {").expect("run function");
              let end = source[start..]
                  .find("\n}\n\nfn parse_adapter_pid")
                  .map(|offset| start + offset)
                  .expect("run function end");
              let run = &source[start..end];
              let broker = run.find("take_broker_stream()?").expect("broker authentication");
              let harden = run.find("harden_process()?").expect("privilege drop");
              let listener = run.find("bind_abstract(BACKEND_SOCKET_NAME)?").expect("backend listener");
              assert!(broker < harden);
              assert!(harden < listener);
          }
          '''.replace("          ", ""))

          # Contract guard for the UX/security split.
          p = Path("encryptor-app/src/test/java/cleveres/tricky/encryptor/MobileSecurityContractTest.kt")
          s = p.read_text()
          marker = '        assertTrue(activity.contains("WindowManager.LayoutParams.FLAG_SECURE"))\n'
          s = one(
              s,
              marker,
              marker +
              '        assertTrue(activity.contains("CleveresVaultColors"))\n' +
              '        assertTrue(activity.contains("LanguagePicker()"))\n',
              "mobile UX contract",
          )
          p.write_text(s)
          PY

          # The strange attribute assignment above is intentionally rejected if Python ever reaches
          # it; correct it explicitly so any partial script bug fails before commit.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rust/backend/tests/startup_privilege_order.rs")
          if not path.is_file():
              raise SystemExit("startup privilege regression test was not created")
          PY

          rm -f .github/workflows/pr953-deep-runtime-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: restore device runtime and mobile experience'
          git push origin HEAD:agent/rust-first-service-redesign
