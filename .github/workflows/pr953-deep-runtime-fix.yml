          }

          internal object LocaleController {
              internal data class Language(
                  val tag: String,
                  val label: String,
              )

              internal val languages =
                  listOf(
                      Language("", "System"),
                      Language("en", "English"),
                      Language("tr", "Türkçe"),
                      Language("de", "Deutsch"),
                      Language("es", "Español"),
                      Language("ru", "Русский"),
                      Language("ar", "العربية"),
                      Language("hi", "हिन्दी"),
                      Language("in", "Bahasa Indonesia"),
                      Language("zh-CN", "简体中文"),
                  )

              private const val PREFS = "cleveres_locale"
              private const val KEY = "language_tag"

              private fun storedTag(context: Context): String =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY, "").orEmpty()

              internal fun selectedTag(context: Context): String {
                  if (Build.VERSION.SDK_INT >= 33) {
                      return context
                          .getSystemService(LocaleManager::class.java)
                          .applicationLocales
                          .toLanguageTags()
                          .substringBefore(',')
                  }
                  return storedTag(context)
              }

              internal fun apply(
                  activity: Activity,
                  tag: String,
              ) {
                  require(languages.any { it.tag == tag }) { "Unsupported locale" }
                  if (Build.VERSION.SDK_INT >= 33) {
                      activity.getSystemService(LocaleManager::class.java).applicationLocales =
                          if (tag.isBlank()) LocaleList.getEmptyLocaleList() else LocaleList.forLanguageTags(tag)
                  } else {
                      val editor = activity.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                      if (tag.isBlank()) editor.remove(KEY) else editor.putString(KEY, tag)
                      editor.apply()
                      activity.recreate()
                  }
              }

              internal fun wrap(context: Context): Context {
                  if (Build.VERSION.SDK_INT >= 33) return context
                  val tag = storedTag(context)
                  if (tag.isBlank()) return context
                  val locale = Locale.forLanguageTag(tag)
                  val configuration = Configuration(context.resources.configuration)
                  configuration.setLocale(locale)
                  configuration.setLayoutDirection(locale)
                  return context.createConfigurationContext(configuration)
              }
          }

          private fun Context.findActivity(): Activity? {
              var current: Context = this
              while (current is ContextWrapper) {
                  if (current is Activity) return current
                  current = current.baseContext
              }
              return current as? Activity
          }

          @Composable
          private fun LanguagePicker(modifier: Modifier = Modifier) {
              val context = LocalContext.current
              val selectedTag = LocaleController.selectedTag(context)
              val selected = LocaleController.languages.firstOrNull { it.tag == selectedTag } ?: LocaleController.languages.first()
              var open by remember { mutableStateOf(false) }
              val systemLabel = stringResource(R.string.system_default)

              OutlinedButton(
                  onClick = { open = true },
                  modifier = modifier,
                  border = BorderStroke(1.dp, CleveresBorder),
              ) {
                  Icon(Icons.Default.Language, contentDescription = stringResource(R.string.language))
                  Text(
                      if (selected.tag.isBlank()) systemLabel else selected.label,
                      modifier = Modifier.padding(start = 8.dp),
                  )
              }

              if (open) {
                  AlertDialog(
                      onDismissRequest = { open = false },
                      title = { Text(stringResource(R.string.language)) },
                      text = {
                          Column {
                              LocaleController.languages.forEach { language ->
                                  TextButton(
                                      onClick = {
                                          open = false
                                          context.findActivity()?.let { LocaleController.apply(it, language.tag) }
                                      },
                                      modifier = Modifier.fillMaxWidth(),
                                  ) {
                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          verticalAlignment = Alignment.CenterVertically,
                                      ) {
                                          Text(
                                              if (language.tag.isBlank()) systemLabel else language.label,
                                              modifier = Modifier.weight(1f),
                                          )
                                          if (language.tag == selected.tag) {
                                              Icon(Icons.Default.Check, contentDescription = null, tint = CleveresSuccess)
                                          }
                                      }
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { open = false }) {
                              Text(stringResource(R.string.cancel))
                          }
                      },
                      containerColor = CleveresPanelElevated,
                  )
              }
          }

          @Composable
          private fun vaultTextFieldColors() =
