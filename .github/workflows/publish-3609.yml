name: Publish existing 3609 artifacts

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download 3609 module artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: 9829879406
          path: release-assets
          merge-multiple: true
          skip-decompress: true
          github-token: ${{ github.token }}

      - name: Download 3609 Encryptor App artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: 9829879687
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Publish 3609 assets to V2.7.2
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: V2.7.2
          files: release-assets/*
