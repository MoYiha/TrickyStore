name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: "🛡️ Quality Gate & Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: "🐚 Shell Script Linting (Shellcheck)"
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck module/template/*.sh

      - name: "🎨 Kotlin Format & Quality (Ktlint)"
        run: ./gradlew ktlintCheck

      - name: "📱 Android Static Analysis (Lint)"
        run: ./gradlew :service:lintDebug :stub:lintDebug :encryptor-app:lintDebug

      - name: "Native source and documentation policy"
        run: |
          unexpected_native=$(find . -type f \
            \( -name '*.c' -o -name '*.C' -o -name '*.cc' -o -name '*.cpp' \
               -o -name '*.cxx' -o -name '*.c++' -o -name '*.m' -o -name '*.mm' \
               -o -name '*.ixx' -o -name '*.cppm' \) \
            ! -path './.git/*' \
            ! -path '*/build/*' \
            ! -path './rust/target/*' \
            ! -path './module/src/main/cpp/external/*' \
            ! -path './module/src/main/cpp/binder_interceptor.cpp' -print)
          if [ -n "$unexpected_native" ]; then
            echo "::error::Unexpected first party C or C++ source detected"
            printf '%s\n' "$unexpected_native"
            exit 1
          fi
          unexpected_headers=$(find . -type f \
            \( -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \
               -o -name '*.h++' -o -name '*.inc' -o -name '*.inl' \
               -o -name '*.ipp' -o -name '*.tpp' \) \
            ! -path './.git/*' \
            ! -path '*/build/*' \
            ! -path './rust/target/*' \
            ! -path './module/src/main/cpp/external/*' -print | while IFS= read -r header; do
              case "$header" in
                './module/src/main/cpp/binder/include/binder/Binder.h'|\
                './module/src/main/cpp/binder/include/binder/Common.h'|\
                './module/src/main/cpp/binder/include/binder/IBinder.h'|\
                './module/src/main/cpp/binder/include/binder/IPCThreadState.h'|\
                './module/src/main/cpp/binder/include/binder/Parcel.h'|\
                './module/src/main/cpp/binder/include/binder/unique_fd.h'|\
                './module/src/main/cpp/binder/include/kernel/binder.h'|\
                './module/src/main/cpp/binder/include/utils/Errors.h'|\
                './module/src/main/cpp/binder/include/utils/RefBase.h'|\
                './module/src/main/cpp/binder/include/utils/String16.h'|\
                './module/src/main/cpp/binder/include/utils/StrongPointer.h'|\
                './module/src/main/cpp/binder/include/utils/Vector.h'|\
                './rust/native-core/include/cleverestricky_native_core.h') ;;
                *) printf '%s\n' "$header" ;;
              esac
            done)
          if [ -n "$unexpected_headers" ]; then
            echo "::error::Unexpected first party native header detected"
            printf '%s\n' "$unexpected_headers"
            exit 1
          fi
          long_dash_pattern=$(printf '\342\200\224|\342\200\223')
          if grep -RInE --exclude-dir=.git --exclude-dir=build --exclude-dir=target \
            "$long_dash_pattern" .; then
            echo "::error::Unsupported long dash character detected"
            exit 1
          fi
          if grep -RIn -- '-' README.md docs; then
            echo "::error::README and feature documents must not use dash characters"
            exit 1
          fi

  rust-test:
    name: "🦀 Rust Checks & Tests"
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      RUSTFLAGS: "-D warnings"
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Security Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build:
    name: "🛠️ Build Module"
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "🔒 SELinux Policy Validation"
        run: |
          echo "=== Checking sepolicy.rule for missing semicolons ==="
          ERRORS=0
          LINE_NUM=0
          while IFS= read -r line; do
            LINE_NUM=$((LINE_NUM + 1))
            trimmed=$(echo "$line" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
            [ -z "$trimmed" ] && continue
            [[ "$trimmed" == \#* ]] && continue
            [[ "$trimmed" == type\ * ]] && continue

            if echo "$trimmed" | grep -qE '^(allow|dontaudit|neverallow|auditallow) '; then
              statement=$(echo "$trimmed" | sed 's/#.*//' | sed 's/[[:space:]]*$//')
              if [[ "$statement" != *";" ]]; then
                echo "::error file=module/template/sepolicy.rule,line=$LINE_NUM::Missing semicolon: $trimmed"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done < module/template/sepolicy.rule
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

      - name: "📱 KernelSU/APatch Module Structure Validation"
        run: |
          ERRORS=0
          for f in module.prop customize.sh service.sh post-fs-data.sh sepolicy.rule webroot/index.html webroot/bridge.js; do
            if [ ! -f "module/template/$f" ]; then
              echo "::error::Missing required module file: module/template/$f"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ -e module/template/action.sh ]; then
            echo "::error::Legacy external WebUI launcher must not be packaged"
            ERRORS=$((ERRORS + 1))
          fi
          for script in module/template/customize.sh module/template/service.sh module/template/post-fs-data.sh; do
            if [ -f "$script" ]; then
              if ! bash -n "$script" 2>/dev/null; then
                echo "::error file=$script::Shell syntax error"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

      - name: Native WebUI syntax validation
        run: |
          node --check module/template/webroot/bridge.js
          node <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('module/template/webroot/index.html', 'utf8')
          const blocks = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]))
          if (blocks.length !== 1) throw new Error('Unexpected inline script count')
          new Function(blocks[0][2])
          NODE

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Lint Android Rust targets
        working-directory: rust
        run: |
          cargo clippy --workspace --all-targets --target aarch64-linux-android -- -D warnings
          cargo clippy --workspace --all-targets --target x86_64-linux-android -- -D warnings

      - name: Run Unit Tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      - name: Report Failed Tests
        if: ${{ failure() && steps.unit_tests.outcome == 'failure' }}
        shell: bash
        run: |
          python3 <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          def local_name(tag):
              return tag.rsplit("}", 1)[-1]

          def command_escape(value):
              return (value or "").replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def property_escape(value):
              return command_escape(value).replace(":", "%3A").replace(",", "%2C")

          reports = sorted(glob.glob("**/build/test-results/**/TEST-*.xml", recursive=True))
          failures = []
          parse_errors = []
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError) as exc:
                  parse_errors.append((report, str(exc)))
                  continue
              for case in root.iter():
                  if local_name(case.tag) != "testcase":
                      continue
                  failure = None
                  for child in case:
                      if local_name(child.tag) in {"failure", "error"}:
                          failure = child
                          break
                  if failure is None:
                      continue
                  failures.append((
                      report,
                      case.get("classname", "unknown"),
                      case.get("name", "unknown"),
                      (failure.get("message") or "").strip(),
                      (failure.text or "").strip(),
                  ))

          for report, error in parse_errors:
              print(f"::warning title=JUnit parse warning::{command_escape(report + ': ' + error)}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          summary = []
          if not failures:
              message = "Gradle reported a unit-test failure, but no failed JUnit testcase was found. Inspect the Gradle output above."
              print(f"::error title=Unit test failure::{command_escape(message)}")
              summary.extend(["## Unit test failure", "", message, ""])
          else:
              summary.extend([f"## Failed unit tests ({len(failures)})", ""])
              for index, (report, classname, name, message, trace) in enumerate(failures, 1):
                  label = f"{classname} > {name}"
                  detail = message or (trace.splitlines()[0] if trace else "Test failed")
                  print(f"::error title={property_escape(label)}::{command_escape(detail)}")
                  print(f"\n=== FAILED TEST {index}/{len(failures)}: {label} ===")
                  print(f"Report: {report}")
                  if message:
                      print(f"Message: {message}")
                  if trace:
                      print("Stack trace:")
                      print(trace[:12000])
                      if len(trace) > 12000:
                          print("... stack trace truncated after 12000 characters ...")
                  summary.extend([f"### {index}. `{label}`", "", f"Report: `{report}`", ""])
                  if message:
                      summary.extend([f"**Message:** {message}", ""])
                  if trace:
                      summary.extend(["```text", trace[:4000], "```", ""])

          print(f"\nParsed {len(reports)} JUnit report files; found {len(failures)} failed test cases.")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as output:
                  output.write("\n".join(summary) + "\n")
          PY

      - name: Upload failed test reports
        if: ${{ failure() && steps.unit_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: failed-unit-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Android Artifacts
        run: |
          ./gradlew zipRelease
          ./gradlew zipDebug
          ./gradlew :encryptor-app:assembleRelease

      - name: Verify native artifact hardening
        run: |
          module_root=module/build/outputs/module/release/lib
          for abi in arm64-v8a x86_64; do
            injector="$module_root/$abi/inject"
            webui_bridge="$module_root/$abi/webui_bridge"
            library="$module_root/$abi/libcleverestricky.so"
            for binary in "$injector" "$webui_bridge" "$library"; do
              test -s "$binary"
              readelf -W -l "$binary" | grep -q 'GNU_RELRO'
              readelf -W -d "$binary" | grep -q 'BIND_NOW'
              readelf -W -l "$binary" | awk '
                $1 == "GNU_STACK" { found = 1; if ($0 ~ /RWE/) exit 2 }
                END { if (!found) exit 1 }
              '
            done
            readelf -W -l "$injector" | grep -q '/system/bin/linker64'
            readelf -W -l "$webui_bridge" | grep -q '/system/bin/linker64'
            exports=$(readelf -W --dyn-syms "$library" |
              awk '$5 == "GLOBAL" && $7 != "UND" && $8 != "" { print $8 }' |
              sort -u)
            expected_exports=$(printf 'entry\nresume')
            test "$exports" = "$expected_exports"
          done

      - name: Upload release zip
        uses: actions/upload-artifact@v7
        with:
          name: CleveresTricky-release
          path: "module/release/*-release.zip"
          if-no-files-found: error
          compression-level: 0

      - name: Upload debug zip
        uses: actions/upload-artifact@v7
        with:
          name: CleveresTricky-debug
          path: "module/release/*-debug.zip"
          if-no-files-found: error
          compression-level: 0

      - name: Upload Encryptor App
        uses: actions/upload-artifact@v7
        with:
          name: EncryptorApp
          path: "encryptor-app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          compression-level: 0

  release:
    name: "📦 Publish Release"
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release zip
        uses: actions/download-artifact@v8
        with:
          name: CleveresTricky-release
          path: release-assets

      - name: Download debug zip
        uses: actions/download-artifact@v8
        with:
          name: CleveresTricky-debug
          path: release-assets

      - name: Download Encryptor App
        uses: actions/download-artifact@v8
        with:
          name: EncryptorApp
          path: release-assets

      - name: Check release version
        id: release_version
        shell: bash
        run: |
          version=$(sed -n 's/^val verName by extra("[vV]\{0,1\}\([^"]*\)").*/\1/p' build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::Could not read verName from build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/V$version" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.release_version.outputs.create == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "V${{ steps.release_version.outputs.version }}"
          name: "Release V${{ steps.release_version.outputs.version }}"
          generate_release_notes: true
          files: "release-assets/*"
