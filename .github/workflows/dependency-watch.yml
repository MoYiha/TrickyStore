name: "Dependency Watch"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-watch
  cancel-in-progress: false

jobs:
  watch:
    name: "Resolve and report dependency drift"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'

      - name: Resolve snapshot and open drift PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="gradle/resolved-versions.snapshot"
          NEW_SNAPSHOT="$(mktemp)"
          {
            echo "# AUTO-GENERATED by .github/workflows/dependency-watch.yml - do not edit by hand."
            echo "# Each line: <source> <group>:<name>=<resolved-version>"
            echo "# Only the gradle wrapper stays manual; it has no floating mechanism."
          } > "$NEW_SNAPSHOT"

          dump_direct() {
            ./gradlew "$1:dependencies" --configuration "$2" --console=plain > /tmp/deptree.txt
            awk -v src="$1:$2" '/^[+\\]--- [^ ]+:[^ ]+:[^ ]+/ {
              s = substr($0, 6)
              sub(/ \([^()]*\)$/, "", s)
              n = split(s, arrow, " -> ")
              ver = (n > 1) ? arrow[2] : ""
              split(arrow[1], coord, ":")
              if (ver == "") ver = coord[3]
              if (coord[3] != "" && ver != "") print src " " coord[1] ":" coord[2] "=" ver
            }' /tmp/deptree.txt >> "$NEW_SNAPSHOT"
          }

          dump_direct :service debugUnitTestRuntimeClasspath
          dump_direct :service debugAndroidTestRuntimeClasspath
          dump_direct :stub debugCompileClasspath
          dump_direct :encryptor-app debugUnitTestRuntimeClasspath

          ./gradlew buildEnvironment --console=plain > /tmp/buildenv.txt
          for art in org.bouncycastle:bcprov-jdk18on io.netty:netty-codec-http io.netty:netty-codec-http2 io.netty:netty-codec io.netty:netty-handler-proxy ch.qos.logback:logback-core ch.qos.logback:logback-classic com.android.tools.build:gradle org.jetbrains.kotlin:kotlin-gradle-plugin; do
            line=$(grep -m1 -F "${art}:" /tmp/buildenv.txt || true)
            if [[ -z "$line" ]]; then
              echo "::warning::buildscript artifact not listed anymore: $art"
              continue
            fi
            if [[ "$line" == *" -> "* ]]; then
              ver="${line##* -> }"
            else
              ver="${line##*:}"
            fi
            ver="${ver%% *}"
            ver="${ver%%)*}"
            echo "buildscript ${art}=${ver}" >> "$NEW_SNAPSHOT"
          done

          {
            head -n 3 "$NEW_SNAPSHOT"
            tail -n +4 "$NEW_SNAPSHOT" | LC_ALL=C sort -u
          } > /tmp/final.snapshot
          mv /tmp/final.snapshot "$NEW_SNAPSHOT"

          if cmp -s "$SNAPSHOT" "$NEW_SNAPSHOT"; then
            echo "Dependency snapshot unchanged."
            exit 0
          fi
          diff -u "$SNAPSHOT" "$NEW_SNAPSHOT" > /tmp/snapshot.diff || true

          BRANCH="chore/dependency-watch"
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH"
          fi
          cp "$NEW_SNAPSHOT" "$SNAPSHOT"
          git add "$SNAPSHOT"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(deps): refresh resolved dependency snapshot"
          git push --force-with-lease origin "$BRANCH"

          BODY_FILE="$(mktemp)"
          {
            echo "Automated dependency drift detected by the daily Dependency Watch."
            echo
            echo '```diff'
            head -c 6000 /tmp/snapshot.diff
            echo '```'
            echo
            echo "Merge to acknowledge; CI on this PR validates the new resolutions."
          } > "$BODY_FILE"
          if ! gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
            gh pr create --title "chore(deps): dependency updates detected" --label dependencies --reviewer tryigit --assignee tryigit --body-file "$BODY_FILE"
          fi
