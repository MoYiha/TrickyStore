name: Apply core keystore lifecycle fix

on:
  push:
    branches:
      - agent/core-protection-identity-ui
    paths:
      - .github/fix-core-keystore.py
      - .github/workflows/fix-core-keystore.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-protection-identity-ui
          fetch-depth: 0
      - name: Apply fix
        run: python3 .github/fix-core-keystore.py
      - name: Commit fix
        run: |
          rm -f .github/fix-core-keystore.py .github/workflows/fix-core-keystore.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep core keystore interception active"
          git push origin HEAD:agent/core-protection-identity-ui
