name: Consolidate WebUI ZIP implementation

on:
  push:
    branches:
      - feat/v2.6.1-webui-zip-import
    paths:
      - .github/workflows/__consolidate_webui.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate runtime assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('module/template/webroot')
          core = (root / 'ux-core.js').read_text(encoding='utf-8')
          zip_feature = (root / 'zip-import.js').read_text(encoding='utf-8')
          marker = "    const MAX_SUPPORTED_FILES = 10000;"
          if marker not in zip_feature:
              raise SystemExit('ZIP importer marker missing')
          # ux.js remains the single UX/localization runtime owner required by AGENTS.md.
          combined = core.rstrip() + "\n\n// ZIP keybox import UX; single-owner compatibility hook for the legacy inline upload controller.\n" + zip_feature.lstrip()
          (root / 'ux.js').write_text(combined, encoding='utf-8')
          (root / 'ux-core.js').unlink()
          (root / 'zip-import.js').unlink()

          build = Path('module/build.gradle.kts')
          text = build.read_text(encoding='utf-8')
          text = text.replace('RuntimePayloadFloor("webroot/ux.js", 500),\n            RuntimePayloadFloor("webroot/ux-core.js", 250_000),\n            RuntimePayloadFloor("webroot/zip-import.js", 15_000),', 'RuntimePayloadFloor("webroot/ux.js", 250_000),')
          build.write_text(text, encoding='utf-8')

          for test_name in ['custom-template-localization.test.js', 'localization.test.js']:
              path = Path('module/webui-tests') / test_name
              text = path.read_text(encoding='utf-8').replace("module/template/webroot/ux-core.js", "module/template/webroot/ux.js")
              path.write_text(text, encoding='utf-8')

          test = Path('module/webui-tests/zip-import.test.js')
          text = test.read_text(encoding='utf-8')
          text = text.replace("module/template/webroot/zip-import.js", "module/template/webroot/ux.js")
          test.write_text(text, encoding='utf-8')

          index = Path('module/template/webroot/index.html')
          index_text = index.read_text(encoding='utf-8')
          if 'accept=".xml,.cbox"' not in index_text:
              raise SystemExit('picker accept anchor missing')
          index_text = index_text.replace('accept=".xml,.cbox"', 'accept=".xml,.cbox,.zip"', 1)
          if 'Or click to select .xml or .cbox' in index_text:
              index_text = index_text.replace('Or click to select .xml or .cbox', 'Or click to select .xml, .cbox or .zip', 1)
          index.write_text(index_text, encoding='utf-8')

          # Runtime file set must remain fixed.
          extras = [p.name for p in root.iterdir() if p.suffix in {'.js', '.css'} and p.name not in {'bridge.js', 'policy.js', 'ux.js'}]
          if extras:
              raise SystemExit('unexpected WebUI runtime assets: ' + ', '.join(extras))
          PY
      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e module/template/webroot/ux-core.js
          test ! -e module/template/webroot/zip-import.js
          grep -Fq 'const MAX_SUPPORTED_FILES = 10000;' module/template/webroot/ux.js
          grep -Fq 'MAX_FILE_BYTES = 10 * 1024 * 1024' module/template/webroot/ux.js
          grep -Fq 'I understand that every supported XML/CBOX file in this ZIP will be imported individually.' module/template/webroot/ux.js
          grep -Fq 'accept=".xml,.cbox,.zip"' module/template/webroot/index.html
          grep -Fq 'RuntimePayloadFloor("webroot/ux.js", 250_000)' module/build.gradle.kts
          ! grep -q 'ux-core.js\|zip-import.js' module/build.gradle.kts
          git diff --check
      - name: Commit consolidated implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/__consolidate_webui.yml
          git add module/template/webroot module/build.gradle.kts module/webui-tests
          git commit -m "fix(webui): keep ZIP import in the single UX owner"
          git push origin HEAD:feat/v2.6.1-webui-zip-import
