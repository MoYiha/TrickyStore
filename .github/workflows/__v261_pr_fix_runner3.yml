name: Apply deep V2.6.1 keybox fixes v3
on:
  pull_request:
    types: [synchronize]
    branches: [master]
permissions:
  contents: write
jobs:
  apply-fixes:
    if: github.event.pull_request.head.ref == 'feat/v2.6.1-webui-zip-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: feat/v2.6.1-webui-zip-import
      - name: Apply indentation-safe source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          config = Path('service/src/main/java/cleveres/tricky/cleverestech/Config.kt')
          text = config.read_text(encoding='utf-8')
          old_reset = '''        cachedLegacyKeyboxes = emptyList()
                  lastKeyboxModified = 0
                  lastKeyboxLength = 0
                  directoryKeyboxCache.clear()
          '''
          if text.count(old_reset) != 2:
              raise SystemExit(f'Config reset contract changed: expected 2 blocks, found {text.count(old_reset)}')
          config.write_text(text.replace(old_reset, '''        storedKeyboxCache.clear()
          ''', 1), encoding='utf-8')

          runner = Path('.github/workflows/__v261_pr_fix_runner.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n\n      - name: Targeted validation"
          if runner.count(start) != 1 or runner.count(end) != 1:
              raise SystemExit('Could not extract original patch program')
          program = textwrap.dedent(runner.split(start, 1)[1].split(end, 1)[0])

          old_helper = '''def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: exact anchor count={count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))
          '''
          new_helper = r'''def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count == 1:
                  write(path, text.replace(old, new, 1))
                  return

              # YAML block indentation must never decide whether a source patch matches.
              # Fall back to a line-anchored, indentation-insensitive form and still require
              # exactly one semantic match.
              lines = old.splitlines()
              if not lines:
                  raise SystemExit(f'{path}: empty replacement anchor')
              pattern = r'(?m)^' + r'\n'.join(r'[ \t]*' + re.escape(line.lstrip(' \t')) for line in lines)
              if old.endswith('\n'):
                  pattern += r'\n'
              matches = list(re.finditer(pattern, text))
              if len(matches) != 1:
                  raise SystemExit(f'{path}: semantic anchor count={len(matches)}: {old[:100]!r}')
              match = matches[0]
              base = re.match(r'[ \t]*', match.group(0)).group(0)
              normalized = textwrap.dedent(new)
              replacement = '\n'.join((base + line) if line else '' for line in normalized.split('\n'))
              write(path, text[:match.start()] + replacement + text[match.end():])
          '''
          if program.count(old_helper) != 1:
              raise SystemExit('replace_once helper contract changed')
          program = program.replace(old_helper, textwrap.dedent(new_helper), 1)
          exec(compile(program, '<v261-keybox-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          node --check module/template/webroot/ux.js
          node module/webui-tests/zip-import.test.js
          ./gradlew :service:ktlintFormat :encryptor-app:ktlintFormat --no-daemon
          ./gradlew :service:ktlintCheck :service:testDebugUnitTest :encryptor-app:ktlintCheck :encryptor-app:testDebugUnitTest --no-daemon
          (cd rust && cargo fmt --all && cargo test -p cleverestricky-daemon)
          git diff --check
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/__v261_pr_fix_runner2.yml .github/workflows/__v261_pr_fix_runner3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(keybox): unify storage identity and vault management"
          git push origin HEAD:feat/v2.6.1-webui-zip-import
