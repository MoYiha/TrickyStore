name: Apply deep V2.6.1 keybox fixes v2
on:
  pull_request:
    types: [synchronize]
    branches: [master]
permissions:
  contents: write
jobs:
  apply-fixes:
    if: github.event.pull_request.head.ref == 'feat/v2.6.1-webui-zip-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: feat/v2.6.1-webui-zip-import
      - name: Apply corrected source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          config = Path('service/src/main/java/cleveres/tricky/cleverestech/Config.kt')
          text = config.read_text(encoding='utf-8')
          old = '''        cachedLegacyKeyboxes = emptyList()
                  lastKeyboxModified = 0
                  lastKeyboxLength = 0
                  directoryKeyboxCache.clear()
          '''
          if text.count(old) != 2:
              raise SystemExit(f'Config reset contract changed: expected 2 blocks, found {text.count(old)}')
          text = text.replace(old, '''        storedKeyboxCache.clear()
          ''', 1)
          config.write_text(text, encoding='utf-8')

          runner = Path('.github/workflows/__v261_pr_fix_runner.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n\n      - name: Targeted validation"
          if runner.count(start) != 1 or runner.count(end) != 1:
              raise SystemExit('Could not extract original validated patch program')
          program = runner.split(start, 1)[1].split(end, 1)[0]
          program = textwrap.dedent(program)
          exec(compile(program, '<v261-keybox-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check module/template/webroot/ux.js
          node module/webui-tests/zip-import.test.js
          ./gradlew :service:ktlintFormat :encryptor-app:ktlintFormat --no-daemon
          ./gradlew :service:ktlintCheck :service:testDebugUnitTest :encryptor-app:ktlintCheck :encryptor-app:testDebugUnitTest --no-daemon
          (cd rust && cargo fmt --all && cargo test -p cleverestricky-daemon)
          git diff --check
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/__v261_pr_fix_runner2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(keybox): unify storage identity and vault management"
          git push origin HEAD:feat/v2.6.1-webui-zip-import
