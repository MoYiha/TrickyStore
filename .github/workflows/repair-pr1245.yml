name: Repair PR 1245 Rustfmt

on:
  pull_request_target:
    types: [synchronize, opened, reopened]
    branches: ["master"]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: ${{ github.event.pull_request.number == 1245 }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Apply rustfmt and push only the formatting repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          if git diff --quiet -- rust/daemon/src/main.rs; then
            echo "Rustfmt already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/daemon/src/main.rs
          git commit -m "style: rustfmt daemon source"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Queue Build workflow for repaired branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${{ github.event.pull_request.head.ref }}"
