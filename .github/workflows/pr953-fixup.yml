name: PR 953 Fixup

on:
  push:
    branches:
      - agent/rust-first-service-redesign
    paths:
      - .github/workflows/pr953-fixup.yml

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current master and apply semantic fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          if git merge --no-ff --no-commit origin/master; then
            echo 'Expected semantic conflicts were not produced.' >&2
            exit 1
          fi
          python3 .github/scripts/pr953_fixup.py

      - name: Format and validate Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cd rust
          cargo fmt --all
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Validate shell payloads
        shell: bash
        run: |
          set -euo pipefail
          bash -n module/template/customize.sh
          bash -n module/template/action.sh
          bash -n module/template/service.sh
          bash -n module/template/post-fs-data.sh

      - name: Run service unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :service:testDebugUnitTest --warning-mode=fail --console=plain --no-build-cache

      - name: Commit and push final fixup tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m 'fix: stabilize runtime lifecycle and keybox activation'
          git push origin HEAD:agent/rust-first-service-redesign
