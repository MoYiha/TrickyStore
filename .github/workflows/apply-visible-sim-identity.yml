name: Validate Visible SIM Identity

on:
  push:
    branches: [ "agent/identity-randomization" ]
    paths:
      - ".github/workflows/apply-visible-sim-identity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Repair staging script typo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_visible_sim_identity.py')
          text = path.read_text(encoding='utf-8')
          old = '''    addition = (\\n        f"            'Visible SIM count': {visible!r}, "\\n        f"'Limits the active subscription list returned to selected apps. It never creates SIMs that are not present.': {note!r}, "\\n        f"'Randomize Telephony': {group!r},\\n"\\n    )'''
          new = '''    addition = (\n        f"            'Visible SIM count': {visible!r}, "\n        f"'Limits the active subscription list returned to selected apps. It never creates SIMs that are not present.': {note!r}, "\n        f"'Randomize Telephony': {group!r},\\n"\n    )'''
          if old not in text:
              raise SystemExit('staging typo anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/apply_visible_sim_identity.py

      - name: Apply visible SIM identity patch
        run: python3 .github/scripts/apply_visible_sim_identity.py

      - name: Validate WebUI
        shell: bash
        env:
          NODE_OPTIONS: --throw-deprecation
        run: |
          set -euo pipefail
          for script in module/template/webroot/*.js; do node --check "$script"; done
          for test_file in module/webui-tests/*.test.js; do echo "Running $test_file"; node "$test_file"; done

      - name: Run service unit tests
        run: ./gradlew :service:testDebugUnitTest --warning-mode=fail --console=plain --stacktrace --no-build-cache

      - name: Run Kotlin and Android lint
        run: ./gradlew ktlintCheck :service:lintDebug --warning-mode=fail --console=plain --stacktrace --no-build-cache

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service module stub
          git diff --cached --check
          git commit -m "feat: add bounded SIM visibility identity"
          git push origin HEAD:agent/identity-randomization
