name: Repair V2.5.4 Encryptor APK

on:
  push:
    branches: [ "master" ]
    paths:
      - ".github/workflows/repair-v2.5.4-encryptor.yml"
  workflow_dispatch:

concurrency:
  group: repair-v2.5.4-encryptor
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  repair:
    name: "🔐 Repair V2.5.4 Encryptor APK"
    runs-on: ubuntu-latest
    env:
      REPAIR_TAG: V2.5.4
    steps:
      - name: Check out V2.5.4 source
        uses: actions/checkout@v7
        with:
          ref: V2.5.4
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare persistent signing key
        shell: bash
        env:
          ENCRYPTOR_KEYSTORE_BASE64: ${{ secrets.ENCRYPTOR_KEYSTORE_BASE64 }}
          ENCRYPTOR_KEYSTORE_PASSWORD: ${{ secrets.ENCRYPTOR_KEYSTORE_PASSWORD }}
          ENCRYPTOR_KEY_ALIAS: ${{ secrets.ENCRYPTOR_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ENCRYPTOR_KEYSTORE_BASE64 ENCRYPTOR_KEYSTORE_PASSWORD ENCRYPTOR_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/encryptor-release.jks"
          printf '%s' "$ENCRYPTOR_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass "$ENCRYPTOR_KEYSTORE_PASSWORD" \
            -alias "$ENCRYPTOR_KEY_ALIAS" >/dev/null
          echo "ENCRYPTOR_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build V2.5.4 unsigned Encryptor APK
        run: ./gradlew :encryptor-app:assembleRelease --warning-mode=fail --console=plain

      - name: Sign and verify V2.5.4 Encryptor APK
        shell: bash
        env:
          ENCRYPTOR_KEYSTORE_PASSWORD: ${{ secrets.ENCRYPTOR_KEYSTORE_PASSWORD }}
          ENCRYPTOR_KEY_ALIAS: ${{ secrets.ENCRYPTOR_KEY_ALIAS }}
          ENCRYPTOR_KEY_PASSWORD: ${{ secrets.ENCRYPTOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ENCRYPTOR_KEYSTORE_PASSWORD ENCRYPTOR_KEY_ALIAS ENCRYPTOR_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          unsigned="encryptor-app/build/outputs/apk/release/encryptor-app-release-unsigned.apk"
          [ -f "$unsigned" ] || { echo "::error::Expected unsigned V2.5.4 APK is missing"; exit 1; }

          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n1)
          [ -n "$build_tools" ] || { echo "::error::Android build-tools were not found"; exit 1; }
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"
          [ -x "$zipalign" ] || { echo "::error::zipalign was not found"; exit 1; }
          [ -x "$apksigner" ] || { echo "::error::apksigner was not found"; exit 1; }

          mkdir -p repair-assets
          aligned="$RUNNER_TEMP/encryptor-app-release-aligned.apk"
          "$zipalign" -f 4 "$unsigned" "$aligned"
          "$apksigner" sign \
            --ks "$ENCRYPTOR_KEYSTORE_PATH" \
            --ks-key-alias "$ENCRYPTOR_KEY_ALIAS" \
            --ks-pass env:ENCRYPTOR_KEYSTORE_PASSWORD \
            --key-pass env:ENCRYPTOR_KEY_PASSWORD \
            --out repair-assets/encryptor-app-release.apk \
            "$aligned"
          "$apksigner" verify --verbose --print-certs repair-assets/encryptor-app-release.apk

      - name: Download existing V2.5.4 module asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$REPAIR_TAG" \
            --pattern 'CleveresTricky-*-release.zip' \
            --dir repair-assets \
            --clobber
          shopt -s nullglob
          zips=(repair-assets/CleveresTricky-*-release.zip)
          [ "${#zips[@]}" -eq 1 ] || { echo "::error::Expected exactly one V2.5.4 module release ZIP"; exit 1; }
          unzip -tq "${zips[0]}" >/dev/null

      - name: Create repaired checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd repair-assets
            sha256sum -- CleveresTricky-*-release.zip encryptor-app-release.apk | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Attest repaired release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: repair-assets/SHA256SUMS

      - name: Replace broken V2.5.4 APK assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in encryptor-app-release-unsigned.apk encryptor-app-release.apk SHA256SUMS; do
            gh release delete-asset "$REPAIR_TAG" "$asset" --yes >/dev/null 2>&1 || true
          done
          gh release upload "$REPAIR_TAG" \
            repair-assets/encryptor-app-release.apk \
            repair-assets/SHA256SUMS \
            --clobber

      - name: Verify repaired release listing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$REPAIR_TAG" --json assets --jq '.assets[].name')
          printf '%s\n' "$assets"
          grep -Fx 'encryptor-app-release.apk' <<<"$assets" >/dev/null || {
            echo "::error::Signed Encryptor APK is missing from $REPAIR_TAG"
            exit 1
          }
          if grep -Fx 'encryptor-app-release-unsigned.apk' <<<"$assets" >/dev/null; then
            echo "::error::Unsigned Encryptor APK is still present in $REPAIR_TAG"
            exit 1
          fi
