name: Finalize Encryptor streaming flow
on:
  push:
    branches: [feat/v2.6.1-webui-zip-import]
    paths: [.github/workflows/__finalize_encryptor.yml]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch Create CBOX flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('encryptor-app/src/main/java/cleveres/tricky/encryptor/SecureMainActivity.kt')
          s=p.read_text()
          s=s.replace('import androidx.compose.runtime.DisposableEffect\n','')
          old='''    var keyboxes by remember { mutableStateOf<List<SelectedKeybox>>(emptyList()) }\n    var sourceName by remember { mutableStateOf<String?>(null) }\n    var publicKey by remember { mutableStateOf<String?>(null) }\n    var showPassword by remember { mutableStateOf(false) }\n    var saving by remember { mutableStateOf(false) }\n\n    DisposableEffect(Unit) {\n        onDispose {\n            keyboxes.forEach { it.bytes.fill(0) }\n            password = ""\n            confirmation = ""\n        }\n    }\n'''
          new='''    var sourceUri by remember { mutableStateOf<Uri?>(null) }\n    var sourceName by remember { mutableStateOf<String?>(null) }\n    var publicKey by remember { mutableStateOf<String?>(null) }\n    var showPassword by remember { mutableStateOf(false) }\n    var saving by remember { mutableStateOf(false) }\n'''
          if old not in s: raise SystemExit('state anchor missing')
          s=s.replace(old,new,1)
          a=s.index('    val picker =\n',s.index('private fun CreateScreen'))
          b=s.index('    val authorValid',a)
          picker='''    val picker =\n        rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri: Uri? ->\n            if (uri == null) return@rememberLauncherForActivityResult\n            scope.launch {\n                val selectedName =\n                    withContext(Dispatchers.IO) {\n                        try {\n                            context.contentResolver.openInputStream(uri)?.use { input ->\n                                if (input.read() < 0) throw IOException("input is empty")\n                            } ?: throw IOException("input unavailable")\n                            displayName(context, uri) ?: "keybox.xml"\n                        } catch (_: Exception) {\n                            null\n                        }\n                    }\n                if (selectedName == null) {\n                    snackbar.showSnackbar(xmlFailed)\n                } else {\n                    sourceUri = uri\n                    sourceName = selectedName\n                }\n            }\n        }\n\n'''
          s=s[:a]+picker+s[b:]
          s=s.replace('            keyboxes.isNotEmpty() &&\n','            sourceUri != null &&\n',1)
          a=s.index('    fun save() {',s.index('private fun CreateScreen'))
          b=s.index('    Scaffold(',a)
          save='''    fun save() {\n        val selectedUri = sourceUri ?: return\n        val selectedName = sourceName ?: "keybox.xml"\n        saving = true\n        val selectedAuthor = author\n        val selectedPassword = password\n        scope.launch {\n            val outcome =\n                withContext(Dispatchers.IO) {\n                    try {\n                        val allocator = VaultStore.newBatchNameAllocator(context, selectedAuthor)\n                        MobileCrypto.encryptAndSaveStreaming(\n                            noBackupDirectory = context.noBackupFilesDir.absolutePath,\n                            author = selectedAuthor,\n                            password = selectedPassword,\n                        ) { encryptOne ->\n                            context.contentResolver.openInputStream(selectedUri)?.use { input ->\n                                try {\n                                    KeyboxImportReader.process(\n                                        input = input,\n                                        displayName = selectedName,\n                                        validateXml = NativeCrypto::validateKeyboxXml,\n                                    ) { displayName, bytes ->\n                                        encryptOne(allocator.allocate(displayName), bytes)\n                                    }\n                                } catch (error: IOException) {\n                                    throw IllegalArgumentException("invalid keybox source", error)\n                                }\n                            } ?: throw IllegalArgumentException("input unavailable")\n                        }\n                    } catch (_: IllegalArgumentException) {\n                        MobileCrypto.EncryptResult.INVALID_INPUT\n                    } catch (_: Exception) {\n                        MobileCrypto.EncryptResult.NATIVE_FAILURE\n                    }\n                }\n            saving = false\n            when (outcome) {\n                MobileCrypto.EncryptResult.SUCCESS -> {\n                    sourceUri = null\n                    sourceName = null\n                    password = ""\n                    confirmation = ""\n                    snackbar.showSnackbar(encryptSuccess)\n                    onBack()\n                }\n                MobileCrypto.EncryptResult.INVALID_INPUT -> snackbar.showSnackbar(xmlFailed)\n                MobileCrypto.EncryptResult.SIGNING_FAILURE -> snackbar.showSnackbar(signingUnavailable)\n                MobileCrypto.EncryptResult.NATIVE_FAILURE -> {\n                    Log.w(LOG_TAG, "Native streamed keybox encryption failed")\n                    snackbar.showSnackbar(encryptFailed)\n                }\n            }\n        }\n    }\n\n'''
          s=s[:a]+save+s[b:]
          a=s.find('                    if (keyboxes.isNotEmpty()) {')
          if a>=0:
              b=s.index('                    Text(stringResource(R.string.xml_limit)',a)
              s=s[:a]+s[b:]
          old='''                        if (saving) {\n                            CircularProgressIndicator(modifier = Modifier.height(20.dp))\n                        } else {\n                            Text(stringResource(R.string.encrypt_save))\n                        }\n'''
          new='''                        if (saving) {\n                            Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {\n                                CircularProgressIndicator(modifier = Modifier.height(20.dp))\n                                Text(stringResource(R.string.encrypting))\n                            }\n                        } else {\n                            Text(stringResource(R.string.encrypt_save))\n                        }\n'''
          if old not in s: raise SystemExit('loading anchor missing')
          s=s.replace(old,new,1)
          tail=s[s.index('private fun CreateScreen'):]
          if 'List<SelectedKeybox>' in tail or 'KeyboxImportReader.read' in tail: raise SystemExit('old retained batch flow remains')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/__finalize_encryptor.yml
          git add encryptor-app/src/main/java/cleveres/tricky/encryptor/SecureMainActivity.kt
          git commit -m "perf(encryptor): stream selected ZIP during CBOX creation"
          git push origin HEAD:feat/v2.6.1-webui-zip-import
