name: Rust Fuzz Smoke

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "rust/**"
      - ".github/workflows/fuzz-smoke.yml"
  workflow_dispatch:

concurrency:
  group: fuzz-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fuzz-smoke:
    name: "🧪 Rust Fuzz Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust/fuzz
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          toolchain: nightly

      - name: Cache fuzz dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-0.13.2-${{ hashFiles('rust/fuzz/Cargo.toml', 'rust/*/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-0.13.2-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz CTIP frame parser
        run: cargo fuzz run ipc_frame -- -runs=500 -max_len=65536 -timeout=2

      - name: Fuzz keybox XML parser
        run: >-
          cargo fuzz run keybox_xml --
          -runs=500
          -max_len=1048576
          -timeout=2
          -dict=dictionaries/keybox_xml.dict

      - name: Fuzz attestation ASN.1 rewrite
        run: cargo fuzz run attestation_asn1 -- -runs=500 -max_len=65536 -timeout=2

      - name: Fuzz certificate rewrite wire
        run: cargo fuzz run certificate_rewrite_wire -- -runs=500 -max_len=1048576 -timeout=2

      - name: Fuzz CRL parser and wire
        run: cargo fuzz run crl_wire -- -runs=500 -max_len=1048576 -timeout=2

      - name: Fuzz CBOX parser and decrypt framing
        run: cargo fuzz run cbox_framing -- -runs=500 -max_len=1048576 -timeout=2

      - name: Fuzz backup envelope
        run: cargo fuzz run backup_envelope -- -runs=500 -max_len=1048576 -timeout=2

      - name: Fuzz policy and config parser
        run: cargo fuzz run policy_config -- -runs=500 -max_len=1048576 -timeout=2
