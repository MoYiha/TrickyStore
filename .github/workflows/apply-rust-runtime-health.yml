name: Apply Rust Runtime Health Patch

on:
  push:
    branches: [ "fix/rust-native-runtime-health" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rust-native-runtime-health
          fetch-depth: 0
      - name: Apply branch patch
        run: python3 tools/apply_runtime_health_patch.py
      - name: Commit branch patch
        run: |
          rm -f .github/workflows/apply-rust-runtime-health.yml .runtime-health-trigger tools/apply_runtime_health_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use Rust native health in WebUI"
          git push origin HEAD:fix/rust-native-runtime-health
