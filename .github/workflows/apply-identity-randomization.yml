name: Finalize Identity Randomization

on:
  push:
    branches: [ "agent/identity-randomization" ]
    paths:
      - ".github/workflows/apply-identity-randomization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Reuse localized Identity description and remove diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('module/template/webroot/policy.js')
          text = path.read_text(encoding='utf-8')
          old = 'Optional identity substitution. Enable only the paths you need.'
          new = 'Enable only the identity paths you need. Disabled paths do not start optional interceptors.'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Identity description, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/identity-patch-error.txt

      - name: Validate WebUI syntax and behavior
        shell: bash
        env:
          NODE_OPTIONS: --throw-deprecation
        run: |
          set -euo pipefail
          for script in module/template/webroot/*.js; do
            node --check "$script"
          done
          for test_file in module/webui-tests/*.test.js; do
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Run service JVM unit tests
        run: ./gradlew :service:testDebugUnitTest --warning-mode=fail --console=plain --stacktrace --no-build-cache

      - name: Commit final source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/template/webroot/policy.js
          git add -u .github/identity-patch-error.txt || true
          git diff --cached --check
          git commit -m "fix: keep Identity controls fully localized"
          git push origin HEAD:agent/identity-randomization
