name: Rust Lockfile Check

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "rust/**"
      - ".github/**"
      - "service/**"
      - "encryptor-app/**"
  workflow_dispatch:

concurrency:
  group: rust-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint-diagnostic-pr953:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 953
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/rust-first-service-redesign
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Capture Encryptor lint report
        shell: bash
        run: |
          set +e
          ./gradlew :encryptor-app:lintDebug --warning-mode=fail --console=plain
          status=$?
          set -e
          {
            echo "exit_status=$status"
            echo
            find encryptor-app -type f -name 'lint-results-*.txt' -print | sort | while IFS= read -r report; do
              echo "===== $report ====="
              cat "$report"
              echo
            done
          } > .github/lint-diagnostic.txt

      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/lint-diagnostic.txt
          git commit -m 'chore: capture PR953 lint diagnostic'
          git push origin HEAD:agent/rust-first-service-redesign

  lockfile:
    if: github.event_name != 'pull_request' || github.event.pull_request.number != 953
    name: "🔒 Rust Lockfile"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Regenerate workspace lockfile
        run: cargo generate-lockfile

      - name: Verify committed lockfile is current
        run: git diff --exit-code -- Cargo.lock

      - name: Upload regenerated lockfile on mismatch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-cargo-lock
          path: rust/Cargo.lock
          if-no-files-found: error
          compression-level: 0