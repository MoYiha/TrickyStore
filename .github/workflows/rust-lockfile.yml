name: Rust Lockfile Check

on:
  push:
    branches: [ "master" ]
    paths:
      - ".github/workflows/rust-lockfile.yml"

permissions:
  contents: write

jobs:
  finish-pr983:
    if: ${{ !contains(github.event.head_commit.message, '[restore-pr983-tests]') }}
    name: "🔒 PR983 test migration"
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dependabot/cargo/rust/signing-x509-stack-78622533b0
          fetch-depth: 0

      - name: Migrate certificate test traits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/certificate-core/tests/rewrite.rs')
          text = p.read_text()
          old = '''    use p256::ecdsa::{Signature as EcSignature, VerifyingKey as EcVerifyingKey};
    use rsa::pkcs1v15::{Signature as RsaSignature, VerifyingKey as RsaVerifyingKey};
    use rsa::pkcs8::DecodePublicKey as _;
    use sha2::Sha256;
    use signature::Verifier;
'''
          new = '''    use p256::ecdsa::{Signature as EcSignature, VerifyingKey as EcVerifyingKey};
    use p256::pkcs8::DecodePublicKey as _;
    use rsa::pkcs1v15::{Signature as RsaSignature, VerifyingKey as RsaVerifyingKey};
    use rsa::pkcs8::DecodePublicKey as _;
    use rsa_sha2::Sha256 as RsaSha256;
    use rsa_signature::Verifier as _;
    use signature::Verifier as _;
'''
          if old not in text:
              raise SystemExit('verify_signature import block changed unexpectedly')
          text = text.replace(old, new)
          text = text.replace('RsaVerifyingKey::<Sha256>::new(key)', 'RsaVerifyingKey::<RsaSha256>::new(key)')
          p.write_text(text)
          PY

      - name: Validate full Rust workspace
        working-directory: rust
        shell: bash
        env:
          RUSTFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Push validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/certificate-core/tests/rewrite.rs
          git commit -m "fix(rust): migrate certificate test traits"
          git push origin HEAD:dependabot/cargo/rust/signing-x509-stack-78622533b0

      - name: Restore Rust Lockfile workflow
        if: always()
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B master origin/master
          git show "${BEFORE_SHA}:.github/workflows/rust-lockfile.yml" > .github/workflows/rust-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rust-lockfile.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: restore Rust Lockfile workflow [restore-pr983-tests]"
            git push origin HEAD:master
          fi
