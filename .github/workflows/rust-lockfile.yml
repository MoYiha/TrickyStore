name: Rust Lockfile Check

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "rust/**"
      - ".github/workflows/rust-lockfile.yml"
  workflow_dispatch:

concurrency:
  group: rust-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# TEMPORARY SELF-HEAL: this permission/commit step is removed immediately after Cargo writes the
# canonical lockfile to the same first-party PR branch. It never runs for forks.
permissions:
  contents: write

jobs:
  lockfile:
    name: "🔒 Rust Lockfile"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Regenerate workspace lockfile
        run: cargo generate-lockfile

      - name: Commit canonical lockfile when Cargo changed it
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- rust/Cargo.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/Cargo.lock
          git commit -m 'chore(rust): regenerate canonical Cargo.lock'
          git push origin "HEAD:${HEAD_REF}"

      - name: Verify committed lockfile is current
        run: git diff --exit-code -- Cargo.lock

      - name: Upload regenerated lockfile on mismatch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-cargo-lock
          path: rust/Cargo.lock
          if-no-files-found: error
          compression-level: 0
