name: Rust Lockfile Check

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "rust/**"
      - ".github/**"
      - "service/**"
      - "encryptor-app/**"
  workflow_dispatch:

concurrency:
  group: rust-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format-pr953:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 953
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/rust-first-service-redesign
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Normalize Kotlin and Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew ktlintFormat --warning-mode=fail --console=plain
          (cd rust && cargo fmt --all)

      - name: Remove obsolete import and commit
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^import androidx\.compose\.material3\.darkColorScheme$/d' encryptor-app/src/main/java/cleveres/tricky/encryptor/SecureMainActivity.kt
          git show ad90e82673df37e2366831ea356811aeb25bcfc5:.github/workflows/rust-lockfile.yml > .github/workflows/rust-lockfile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style: normalize device repair sources'
          git push origin HEAD:agent/rust-first-service-redesign

  lockfile:
    if: github.event_name != 'pull_request' || github.event.pull_request.number != 953
    name: "🔒 Rust Lockfile"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Regenerate workspace lockfile
        run: cargo generate-lockfile

      - name: Verify committed lockfile is current
        run: git diff --exit-code -- Cargo.lock

      - name: Upload regenerated lockfile on mismatch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-cargo-lock
          path: rust/Cargo.lock
          if-no-files-found: error
          compression-level: 0