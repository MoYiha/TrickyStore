name: Rust Lockfile Check

on:
  push:
    branches: [ "master" ]
    paths:
      - ".github/workflows/rust-lockfile.yml"

permissions:
  contents: write

jobs:
  migrate-pr983:
    if: ${{ !contains(github.event.head_commit.message, '[restore-pr983-runner]') }}
    name: "🔒 PR983 migration"
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dependabot/cargo/rust/signing-x509-stack-78622533b0
          fetch-depth: 0

      - name: Apply compatibility migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected snippet missing in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          cert = 'rust/certificate-core/src/lib.rs'
          replace(cert,
              'use p256::pkcs8::{DecodePrivateKey as _, DecodePublicKey as _};\n',
              'use p256::pkcs8::{DecodePrivateKey as _, DecodePublicKey as _};\nuse rsa::pkcs8::{DecodePrivateKey as _, DecodePublicKey as _};\n')
          replace(cert,
              'use sha2::Sha256;\nuse signature::{SignatureEncoding, Signer, Verifier};\n',
              'use rsa_sha2::Sha256 as RsaSha256;\nuse rsa_signature::{SignatureEncoding as _, Signer as _, Verifier as _};\nuse signature::{Signer as _, Verifier as _};\n')
          replace(cert, 'RsaSigningKey<Sha256>', 'RsaSigningKey<RsaSha256>')
          replace(cert, 'RsaSigningKey::<Sha256>', 'RsaSigningKey::<RsaSha256>')
          replace(cert, 'RsaVerifyingKey::<Sha256>', 'RsaVerifyingKey::<RsaSha256>')

          crypto = 'rust/crypto-core/src/lib.rs'
          replace(crypto,
              'use p256::ecdsa::{Signature as EcSignature, VerifyingKey as EcVerifyingKey};\n',
              'use p256::ecdsa::{Signature as EcSignature, VerifyingKey as EcVerifyingKey};\nuse p256::pkcs8::DecodePublicKey as _;\n')
          replace(crypto, 'use rsa::pkcs8::DecodePublicKey;\n', 'use rsa::pkcs8::DecodePublicKey as _;\n')
          replace(crypto,
              'use rsa::RsaPublicKey;\nuse serde::Deserialize;\n',
              'use rsa::RsaPublicKey;\nuse rsa_sha2::Sha256 as RsaSha256;\nuse serde::Deserialize;\n')
          replace(crypto, 'use signature::hazmat::PrehashVerifier;\n', '')
          replace(crypto, 'RsaVerifyingKey::<Sha256>::new(public_key)', 'RsaVerifyingKey::<RsaSha256>::new(public_key)')
          replace(crypto,
              'return RsaVerifyingKey::<RsaSha256>::new(public_key)\n            .verify_prehash(&digest, &signature)\n            .is_ok();',
              'let verifier = RsaVerifyingKey::<RsaSha256>::new(public_key);\n        return rsa_signature::hazmat::PrehashVerifier::verify_prehash(\n            &verifier,\n            &digest,\n            &signature,\n        )\n        .is_ok();')
          replace(crypto,
              'public_key.verify_prehash(&digest, &signature).is_ok()',
              'signature::hazmat::PrehashVerifier::verify_prehash(&public_key, &digest, &signature)\n        .is_ok()')

          keybox = 'rust/keybox-core/src/lib.rs'
          replace(keybox,
              'use p256::pkcs8::{DecodePrivateKey, EncodePrivateKey, EncodePublicKey};\n',
              'use p256::pkcs8::{DecodePrivateKey as _, EncodePrivateKey as _, EncodePublicKey as _};\n')
          replace(keybox,
              'use rsa::pkcs1::DecodeRsaPrivateKey;\n',
              'use rsa::pkcs1::DecodeRsaPrivateKey;\nuse rsa::pkcs8::{DecodePrivateKey as _, EncodePrivateKey as _, EncodePublicKey as _};\n')
          PY

      - name: Regenerate lockfile and validate
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo test --workspace

      - name: Push validated PR fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git commit -m "fix(rust): migrate signing stack compatibility"
          git push origin HEAD:dependabot/cargo/rust/signing-x509-stack-78622533b0

      - name: Restore Rust Lockfile workflow
        if: always()
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B master origin/master
          git show "${BEFORE_SHA}:.github/workflows/rust-lockfile.yml" > .github/workflows/rust-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rust-lockfile.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: restore Rust Lockfile workflow [restore-pr983-runner]"
            git push origin HEAD:master
          fi
