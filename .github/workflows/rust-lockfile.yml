name: Rust Lockfile Check

on:
  push:
    branches: [ "agent/rust-first-service-redesign" ]
  pull_request:
    branches: [ "master" ]
    paths:
      - "rust/**"
      - ".github/workflows/rust-lockfile.yml"
  workflow_dispatch:

concurrency:
  group: rust-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  repair-pr953:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: run compact PR953 repair'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/rust-first-service-redesign
          fetch-depth: 0

      - name: Apply device repair
        run: python3 .github/pr953_repair.py

      - name: Commit repaired tree
        shell: bash
        run: |
          set -euo pipefail
          git show ad90e82673df37e2366831ea356811aeb25bcfc5:.github/workflows/rust-lockfile.yml > .github/workflows/rust-lockfile.yml
          rm -f .github/pr953_repair.py .github/workflows/pr953-deep-runtime-fix.yml .github/workflows/pr953-device-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: restore device runtime and mobile experience'
          git push origin HEAD:agent/rust-first-service-redesign

  lockfile:
    if: github.event_name != 'push'
    name: "🔒 Rust Lockfile"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Regenerate workspace lockfile
        run: cargo generate-lockfile

      - name: Verify committed lockfile is current
        run: git diff --exit-code -- Cargo.lock

      - name: Upload regenerated lockfile on mismatch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-cargo-lock
          path: rust/Cargo.lock
          if-no-files-found: error
          compression-level: 0