name: Rust Lockfile Check

on:
  push:
    branches: [ "master" ]
    paths:
      - ".github/workflows/rust-lockfile.yml"

permissions:
  contents: write

jobs:
  validate-pr983:
    if: ${{ !contains(github.event.head_commit.message, '[restore-pr983]') }}
    name: "🔒 PR983 migration validation"
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dependabot/cargo/rust/signing-x509-stack-78622533b0
          fetch-depth: 0

      - name: Regenerate and validate Rust workspace
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test --workspace

      - name: Push generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(rust): regenerate signing stack lockfile"
            git push origin HEAD:dependabot/cargo/rust/signing-x509-stack-78622533b0
          fi

      - name: Restore workflow
        if: always()
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B master origin/master
          git show "${BEFORE_SHA}:.github/workflows/rust-lockfile.yml" > .github/workflows/rust-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rust-lockfile.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: restore Rust Lockfile workflow [restore-pr983]"
            git push origin HEAD:master
          fi
