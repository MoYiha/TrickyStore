name: Repository Cleanup

on:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Purge stale branches and Actions history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          stale_branches=(
            "agent/identity-security-patch-layout"
            "agent/identity-toggle-panel-fix"
            "agent/dashboard-identity-toggle-final"
            "agent/release-curation-final"
            "agent/actions-ui-cleanup"
            "agent/actions-history-cleanup"
            "agent/actions-history-cleanup-runner"
            "cleanup-safety-anchor"
            "fix/v261-runtime-hotfix"
            "fix/v261-runtime-hotfix-actual"
            "fix/v261-runtime-hotfix-ci"
            "fix/v261-runtime-hotfix-ci2"
            "fix/v261-runtime-hotfix-clean"
            "fix/v261-runtime-hotfix-final"
            "fix/v261-runtime-hotfix-release"
            "fix/v261-runtime-hotfix-review"
            "fix/v261-runtime-hotfix-use-this"
          )

          for branch in "${stale_branches[@]}"; do
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch" >/dev/null 2>&1 || true
          done

          gh api --paginate "repos/$repo/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(((.head_branch // "") | startswith("agent/")) or ((.head_branch // "") | startswith("fix/v261-runtime-hotfix")) or ((.head_branch // "") == "cleanup-safety-anchor")) | .id' \
            | while read -r run_id; do
                [ -z "$run_id" ] && continue
                [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
                gh api -X DELETE "repos/$repo/actions/runs/$run_id" >/dev/null 2>&1 || true
              done

          gh api --paginate "repos/$repo/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id,.name,.path] | @tsv' \
            | while IFS=$'\t' read -r workflow_id workflow_name workflow_path; do
                stale=0
                case "$workflow_path" in
                  .github/workflows/__*) stale=1 ;;
                esac
                if echo "$workflow_name" | grep -Eiq '(diagnostic|diag|apply release|release patch|workflow patch|release workflow patch)'; then
                  stale=1
                fi
                [ "$stale" = "1" ] || continue
                gh api --paginate "repos/$repo/actions/workflows/$workflow_id/runs?per_page=100" --jq '.workflow_runs[].id' \
                  | while read -r run_id; do
                      [ -z "$run_id" ] && continue
                      [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
                      gh api -X DELETE "repos/$repo/actions/runs/$run_id" >/dev/null 2>&1 || true
                    done
                gh api -X PUT "repos/$repo/actions/workflows/$workflow_id/disable" >/dev/null 2>&1 || true
              done

          file_sha="$(gh api "repos/$repo/contents/.github/workflows/copilot-setup-steps.yml?ref=master" --jq .sha)"
          gh api -X DELETE "repos/$repo/contents/.github/workflows/copilot-setup-steps.yml" \
            -f message='ci: finish Actions cleanup [skip ci]' \
            -f sha="$file_sha" \
            -f branch='master' >/dev/null

          gh api -X DELETE "repos/$repo/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
