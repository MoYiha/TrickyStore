name: Apply deep V2.6.1 keybox fixes
on:
  pull_request:
    types: [synchronize]
    branches: [master]
permissions:
  contents: write
jobs:
  apply-fixes:
    if: github.event.pull_request.head.ref == 'feat/v2.6.1-webui-zip-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: feat/v2.6.1-webui-zip-import
      - name: Apply source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(content, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: exact anchor count={count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement, flags=re.S):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: regex anchor count={count}: {pattern[:120]}')
              write(path, updated)

          inventory = r'''package cleveres.tricky.cleverestech

          import java.io.File
          import java.nio.file.Files
          import java.nio.file.LinkOption
          import java.util.Locale

          /** One bounded inventory for keybox sources visible to both runtime and WebUI. */
          internal object StoredKeyboxInventory {
              enum class Scope(
                  val apiValue: String,
                  val fileScope: KeyboxLoader.FileScope?,
              ) {
                  ROOT("root", KeyboxLoader.FileScope.CONFIG_ROOT),
                  KEYBOXES("keyboxes", KeyboxLoader.FileScope.KEYBOX_DIRECTORY),
              }

              data class Source(
                  val scope: Scope,
                  val filename: String,
                  val file: File,
              ) {
                  val id: String
                      get() = "${scope.apiValue}:$filename"
                  val isXml: Boolean
                      get() = filename.endsWith(".xml", ignoreCase = true)
                  val isCbox: Boolean
                      get() = filename.endsWith(".cbox", ignoreCase = true)
              }

              const val MAX_ACTIVE_XML_SOURCES = 64
              const val MAX_STORED_SOURCES = 256
              const val MAX_FILENAME_BYTES = 255
              const val MAX_XML_BYTES = 10L * 1024 * 1024

              fun list(configDir: File): List<Source> {
                  val output = ArrayList<Source>()
                  scan(configDir, Scope.ROOT, allowCbox = false, output)
                  val keyboxDir = File(configDir, "keyboxes")
                  if (Files.isDirectory(keyboxDir.toPath(), LinkOption.NOFOLLOW_LINKS)) {
                      scan(keyboxDir, Scope.KEYBOXES, allowCbox = true, output)
                  }
                  output.sortWith(
                      compareBy<Source> { it.filename.lowercase(Locale.ROOT) }
                          .thenBy { it.scope.apiValue },
                  )
                  return output
              }

              fun runtimeXmlSources(configDir: File): List<Source> {
                  val sources = list(configDir).filter { it.isXml }
                  require(sources.size <= MAX_ACTIVE_XML_SOURCES) { "Too many keybox XML files" }
                  val seen = HashSet<String>()
                  sources.forEach { source ->
                      require(seen.add(source.filename.lowercase(Locale.ROOT))) {
                          "Duplicate keybox filename across storage scopes"
                      }
                  }
                  return sources
              }

              fun resolve(
                  configDir: File,
                  scopeValue: String,
                  filename: String,
              ): Source? {
                  val scope = Scope.entries.firstOrNull { it.apiValue == scopeValue } ?: return null
                  if (!isSafeStoredName(filename, allowCbox = scope == Scope.KEYBOXES)) return null
                  val directory = if (scope == Scope.ROOT) configDir else File(configDir, "keyboxes")
                  val candidate = File(directory, filename)
                  if (candidate.parentFile?.canonicalFile != directory.canonicalFile) return null
                  if (!Files.isRegularFile(candidate.toPath(), LinkOption.NOFOLLOW_LINKS)) return null
                  return Source(scope, filename, candidate)
              }

              private fun scan(
                  directory: File,
                  scope: Scope,
                  allowCbox: Boolean,
                  output: MutableList<Source>,
              ) {
                  if (!Files.isDirectory(directory.toPath(), LinkOption.NOFOLLOW_LINKS)) return
                  Files.newDirectoryStream(directory.toPath()).use { entries ->
                      for (entry in entries) {
                          val filename = entry.fileName.toString()
                          if (!isSafeStoredName(filename, allowCbox)) continue
                          if (!Files.isRegularFile(entry, LinkOption.NOFOLLOW_LINKS)) continue
                          require(output.size < MAX_STORED_SOURCES) { "Too many stored keybox sources" }
                          output += Source(scope, filename, entry.toFile())
                      }
                  }
              }

              private fun isSafeStoredName(
                  filename: String,
                  allowCbox: Boolean,
              ): Boolean {
                  if (filename.isEmpty() || filename.startsWith('.') || filename.contains('/') || filename.contains('\\') || filename.contains('\u0000')) return false
                  if (filename.toByteArray(Charsets.UTF_8).size > MAX_FILENAME_BYTES) return false
                  if (filename.any { it.code < 0x20 || it.code == 0x7f }) return false
                  return filename.endsWith(".xml", ignoreCase = true) ||
                      (allowCbox && filename.endsWith(".cbox", ignoreCase = true))
              }
          }
          '''
          write('service/src/main/java/cleveres/tricky/cleverestech/StoredKeyboxInventory.kt', textwrap.dedent(inventory))

          # Source-level count and public certificate #3 serial.
          cert = 'service/src/main/java/cleveres/tricky/cleverestech/keystore/CertHack.java'
          replace_once(cert, 'import java.security.cert.CertificateFactory;\n', 'import java.security.cert.CertificateFactory;\nimport java.security.cert.X509Certificate;\n')
          cert_anchor = '''    public static int getKeyboxCount() {
                  if (!KeyboxLoader.isActiveSetHealthy()) {
                      throw new IllegalStateException("Rust keybox backend activation is unavailable");
                  }
                  return getPublishedKeyboxCountForTesting();
              }
          '''
          cert_extra = cert_anchor + '''
              /** Counts active keybox sources, not EC/RSA key records inside each source. */
              public static int getKeyboxSourceCount() {
                  if (!KeyboxLoader.isActiveSetHealthy()) {
                      throw new IllegalStateException("Rust keybox backend activation is unavailable");
                  }
                  return state.keyboxFiles.size();
              }

              public static String getDeviceCertificateSerial(String filename) {
                  if (filename == null) return null;
                  List<KeyBox> boxes = state.keyboxFiles.get(filename);
                  if (boxes == null) return null;
                  for (KeyBox box : boxes) {
                      String serial = getDeviceCertificateSerial(box);
                      if (serial != null) return serial;
                  }
                  return null;
              }

              public static String getDeviceCertificateSerial(KeyBox keybox) {
                  if (keybox == null || keybox.certificates().size() < 3) return null;
                  Certificate certificate = keybox.certificates().get(2);
                  if (!(certificate instanceof X509Certificate x509)) return null;
                  return x509.getSerialNumber().toString(16).toUpperCase(Locale.ROOT);
              }
          '''
          replace_once(cert, cert_anchor, cert_extra)

          # Config: root/*.xml and keyboxes/*.xml use the same bounded source cache.
          config = 'service/src/main/java/cleveres/tricky/cleverestech/Config.kt'
          regex_once(
              config,
              r'    @Volatile\n    private var cachedLegacyKeyboxes: List<CertHack\.KeyBox> = emptyList\(\).*?    fun updateKeyBoxes\(\) =',
              '''    private data class KeyboxFileCache(
                  val lastModified: Long,
                  val length: Long,
                  val keyboxes: List<CertHack.KeyBox>,
              )

              private val storedKeyboxCache = ConcurrentHashMap<String, KeyboxFileCache>()

              fun updateKeyBoxes() =''',
          )
          replace_once(
              config,
              '''        cachedLegacyKeyboxes = emptyList()
                  lastKeyboxModified = 0
                  lastKeyboxLength = 0
                  directoryKeyboxCache.clear()
          ''',
              '''        storedKeyboxCache.clear()
          ''',
          )
          regex_once(
              config,
              r'            val legacyFile = File\(root, KEYBOX_FILE\).*?            if \(refreshExternalSources\) CboxManager\.refresh\(\)',
              '''            val storedSources = StoredKeyboxInventory.runtimeXmlSources(root)
              Logger.d("updateKeyBoxes: scanning ${storedSources.size} stored XML sources")
              val currentFiles = HashSet<String>()
              storedSources.forEach { source ->
                  currentFiles.add(source.id)
                  val file = source.file
                  if (file.length() !in 1..StoredKeyboxInventory.MAX_XML_BYTES) {
                      storedKeyboxCache.remove(source.id)
                      Logger.w("Ignoring empty or oversized keybox file: ${source.filename}")
                      return@forEach
                  }
                  val lastMod = file.lastModified()
                  val length = file.length()
                  val cached = storedKeyboxCache[source.id]
                  if (cached != null && cached.lastModified == lastMod && cached.length == length) {
                      allKeyboxes.addAll(cached.keyboxes)
                  } else {
                      try {
                          val parsed = KeyboxLoader.parseFile(
                              requireNotNull(source.scope.fileScope),
                              source.filename,
                          )
                          storedKeyboxCache[source.id] = KeyboxFileCache(lastMod, length, parsed)
                          allKeyboxes.addAll(parsed)
                          Logger.i("Reloaded keybox source: ${source.id}")
                      } catch (error: RustBackendUnavailableException) {
                          throw error
                      } catch (error: Exception) {
                          storedKeyboxCache.remove(source.id)
                          Logger.e("Failed to parse keybox source: ${source.id}", error)
                      }
                  }
              }
              val cacheIterator = storedKeyboxCache.keys.iterator()
              while (cacheIterator.hasNext()) {
                  if (!currentFiles.contains(cacheIterator.next())) cacheIterator.remove()
              }

              if (refreshExternalSources) CboxManager.refresh()''',
          )

          # Rust file broker: root scope accepts safe XML basenames, not only keybox.xml.
          broker = 'rust/daemon/src/keybox_file_broker.rs'
          replace_once(broker, 'const LEGACY_KEYBOX: &str = "keybox.xml";\n', '')
          replace_once(
              broker,
              '''    let directory = match scope {
                  SCOPE_CONFIG_ROOT => {
                      if name != LEGACY_KEYBOX {
                          return Err(invalid("root keybox request is not whitelisted"));
                      }
                      None
                  }
                  SCOPE_KEYBOX_DIRECTORY => {
                      if !name
                          .get(name.len().saturating_sub(4)..)
                          .is_some_and(|suffix| suffix.eq_ignore_ascii_case(".xml"))
                      {
                          return Err(invalid("keybox directory request must target XML"));
                      }
                      Some(root.open_child(KEYBOX_DIRECTORY)?)
                  }
                  _ => return Err(invalid("unknown keybox file scope")),
              };
          ''',
              '''    if !safe_xml_basename(name) {
                  return Err(invalid("keybox request must target a safe XML basename"));
              }
              let directory = match scope {
                  SCOPE_CONFIG_ROOT => None,
                  SCOPE_KEYBOX_DIRECTORY => Some(root.open_child(KEYBOX_DIRECTORY)?),
                  _ => return Err(invalid("unknown keybox file scope")),
              };
          ''',
          )
          replace_once(
              broker,
              'fn snapshot_opened_keybox(opened: OpenedKeybox) -> io::Result<File> {\n',
              '''fn safe_xml_basename(name: &str) -> bool {
              !name.is_empty()
                  && !name.starts_with('.')
                  && !name.contains('/')
                  && !name.contains('\\\\')
                  && !name.bytes().any(|byte| byte == 0 || byte < 0x20 || byte == 0x7f)
                  && name
                      .get(name.len().saturating_sub(4)..)
                      .is_some_and(|suffix| suffix.eq_ignore_ascii_case(".xml"))
          }

          fn snapshot_opened_keybox(opened: OpenedKeybox) -> io::Result<File> {
          ''',
          )
          regex_once(
              broker,
              r'    #\[test\]\n    fn opens_only_whitelisted_legacy_and_directory_xml_files\(\) \{.*?\n    \}\n',
              '''    #[test]
              fn opens_root_and_directory_xml_basenames_only() {
                  let test = TestRoot::new();
                  fs::write(test.path.join("keybox.xml"), b"legacy").unwrap();
                  fs::write(test.path.join("A1B2C3.xml"), b"named-root").unwrap();
                  fs::write(
                      test.path.join(KEYBOX_DIRECTORY).join("A B.XML"),
                      b"directory",
                  )
                  .unwrap();
                  let root = TrustedDir::open(&test.path).unwrap();

                  assert_eq!(open_requested_from(&root, &request(SCOPE_CONFIG_ROOT, "keybox.xml")).unwrap().size, 6);
                  assert_eq!(open_requested_from(&root, &request(SCOPE_CONFIG_ROOT, "A1B2C3.xml")).unwrap().size, 10);
                  assert_eq!(open_requested_from(&root, &request(SCOPE_KEYBOX_DIRECTORY, "A B.XML")).unwrap().size, 9);

                  for name in ["../root.xml", "sub/root.xml", ".hidden.xml", "not-cbox.txt"] {
                      assert!(open_requested_from(&root, &request(SCOPE_CONFIG_ROOT, name)).is_err());
                  }
                  assert!(open_requested_from(&root, &request(SCOPE_KEYBOX_DIRECTORY, "not-cbox.txt")).is_err());
                  assert!(open_requested_from(&root, &request(9, "x.xml")).is_err());
              }
          ''',
          )

          # Verification: parse first, then resolve CRL generation. Parsing may itself recover a restarted backend.
          verifier = 'service/src/main/java/cleveres/tricky/cleverestech/util/KeyboxVerifier.kt'
          replace_once(verifier, 'import cleveres.tricky.cleverestech.RustBackendUnavailableException\n', 'import cleveres.tricky.cleverestech.RustBackendUnavailableException\nimport cleveres.tricky.cleverestech.StoredKeyboxInventory\n')
          replace_once(
              verifier,
              '''    data class Result(
                  val file: File,
                  val filename: String,
                  val status: Status,
                  val details: String,
              )
          ''',
              '''    data class Result(
                  val file: File,
                  val filename: String,
                  val status: Status,
                  val details: String,
                  val storageId: String = "",
                  val certificateSerial: String? = null,
              )
          ''',
          )
          regex_once(
              verifier,
              r'    private fun verifyWithSource\(\n        configDir: File,\n        crlFetcher: \(\) -> RevocationSource\?,\n    \): List<Result> \{.*?\n        return results\n    \}',
              '''    private fun verifyWithSource(
                  configDir: File,
                  crlFetcher: () -> RevocationSource?,
              ): List<Result> {
                  if (!Files.isDirectory(configDir.toPath(), LinkOption.NOFOLLOW_LINKS)) {
                      return listOf(Result(File(""), "Global", Status.ERROR, "Config directory not found"))
                  }
                  val sources =
                      try {
                          StoredKeyboxInventory.runtimeXmlSources(configDir)
                      } catch (error: Exception) {
                          Logger.e("Failed to enumerate stored keyboxes", error)
                          return listOf(Result(File(""), "Global", Status.ERROR, error.message ?: "Failed to scan keyboxes"))
                      }
                  val results = ArrayList<Result>(sources.size)
                  for (source in sources) {
                      results.add(
                          checkFile(
                              source.file,
                              requireNotNull(source.scope.fileScope),
                              source.filename,
                              source.id,
                              crlFetcher,
                          ),
                      )
                  }
                  return results
              }''',
          )
          replace_once(
              verifier,
              '''    private fun checkFile(
                  file: File,
                  scope: KeyboxLoader.FileScope,
                  filename: String,
                  crl: RevocationSource,
              ): Result =
          ''',
              '''    private fun checkFile(
                  file: File,
                  scope: KeyboxLoader.FileScope,
                  filename: String,
                  storageId: String,
                  crlFetcher: () -> RevocationSource?,
              ): Result =
          ''',
          )
          replace_once(
              verifier,
              '''            val keyboxes = KeyboxLoader.parseFile(scope, filename)
                  if (keyboxes.isEmpty()) {
                      return Result(file, file.name, Status.INVALID, "No valid keyboxes found or parse error")
                  }

                  for (keybox in keyboxes) {
          ''',
              '''            val keyboxes = KeyboxLoader.parseFile(scope, filename)
                  if (keyboxes.isEmpty()) {
                      return Result(file, file.name, Status.INVALID, "No valid keybox found or parse error", storageId)
                  }
                  // parseFile can discover a Rust backend restart and rebuild backend-owned CRL state.
                  // Resolve the handle only after that recovery boundary so this request never keeps
                  // using the pre-recovery generation on its first manual verification attempt.
                  val crl = crlFetcher()
                      ?: return Result(file, file.name, Status.ERROR, "Failed to initialize CRL index", storageId)
                  val deviceSerial = keyboxes.asSequence().mapNotNull(CertHack::getDeviceCertificateSerial).firstOrNull()

                  for (keybox in keyboxes) {
          ''',
          )
          replace_once(verifier, '                        return Result(file, file.name, Status.REVOKED, "Certificate with SN $serial is revoked")\n', '                        return Result(file, file.name, Status.REVOKED, "Certificate with SN $serial is revoked", storageId, deviceSerial)\n')
          replace_once(verifier, '                    Status.INVALID -> return Result(file, file.name, Status.INVALID, "Keybox structure is invalid")\n', '                    Status.INVALID -> return Result(file, file.name, Status.INVALID, "Keybox structure is invalid", storageId, deviceSerial)\n')
          replace_once(verifier, '                    Status.ERROR -> return Result(file, file.name, Status.ERROR, "Rust CRL backend unavailable")\n', '                    Status.ERROR -> return Result(file, file.name, Status.ERROR, "Rust CRL backend unavailable", storageId, deviceSerial)\n')
          replace_once(verifier, '            Result(file, file.name, Status.VALID, "Active (${keyboxes.size} keys)")\n', '            Result(file, file.name, Status.VALID, "Active keybox", storageId, deviceSerial)\n')
          replace_once(verifier, '            Result(file, file.name, Status.ERROR, "Rust backend unavailable")\n', '            Result(file, file.name, Status.ERROR, "Rust backend unavailable", storageId)\n')
          replace_once(verifier, '            Result(file, file.name, Status.ERROR, "Error: ${error.javaClass.simpleName}")\n', '            Result(file, file.name, Status.ERROR, "Error: ${error.javaClass.simpleName}", storageId)\n')

          # Web server: source-aware inventory, source count, scoped and bulk deletion, verification metadata.
          web = 'service/src/main/java/cleveres/tricky/cleverestech/WebServer.kt'
          regex_once(
              web,
              r'    private fun listKeyboxes\(\): List<String> \{.*?\n    \}\n',
              '''    private fun listKeyboxes(): List<String> =
              StoredKeyboxInventory.list(configDir)
                  .map { it.filename }
                  .distinct()

              private fun keyboxInventoryJson(): String {
                  val array = JSONArray()
                  StoredKeyboxInventory.list(configDir).forEach { source ->
                      array.put(
                          JSONObject()
                              .put("id", source.id)
                              .put("scope", source.scope.apiValue)
                              .put("filename", source.filename)
                              .put("type", if (source.isCbox) "cbox" else "xml")
                              .put("certificate_serial", CertHack.getDeviceCertificateSerial(source.filename) ?: ""),
                      )
                  }
                  return array.toString()
              }
          ''',
          )
          replace_once(
              web,
              '''        if (uri == "/api/keyboxes" && method == Method.GET) {
                  val keyboxes = listKeyboxes()
                  val array = JSONArray(keyboxes)
                  return secureResponse(Response.Status.OK, "application/json", array.toString())
              }
          ''',
              '''        if (uri == "/api/keyboxes" && method == Method.GET) {
                  val keyboxes = listKeyboxes()
                  val array = JSONArray(keyboxes)
                  return secureResponse(Response.Status.OK, "application/json", array.toString())
              }

              if (uri == "/api/keybox_inventory" && method == Method.GET) {
                  return try {
                      secureResponse(Response.Status.OK, "application/json", keyboxInventoryJson())
                  } catch (error: Exception) {
                      Logger.e("Failed to enumerate stored keyboxes", error)
                      secureResponse(Response.Status.INTERNAL_ERROR, "text/plain", "Failed to enumerate stored keyboxes")
                  }
              }
          ''',
          )
          text = read(web).replace('CertHack.getKeyboxCount()', 'CertHack.getKeyboxSourceCount()')
          write(web, text)
          regex_once(
              web,
              r'        if \(uri == "/api/delete_keybox" && method == Method\.POST\) \{.*?        if \(uri == "/api/verify_keyboxes" && method == Method\.POST\) \{',
              '''        if (uri == "/api/delete_keybox" && method == Method.POST) {
                  val map = HashMap<String, String>()
                  try {
                      session.parseBody(map)
                  } catch (error: Exception) {
                      return secureResponse(Response.Status.BAD_REQUEST, "text/plain", "Failed to parse body")
                  }
                  val filename = getParam(session, "filename")
                  val scope = getParam(session, "scope") ?: "keyboxes"
                  if (filename != null) {
                      synchronized(fileLock) {
                          val source = StoredKeyboxInventory.resolve(configDir, scope, filename)
                              ?: return secureResponse(Response.Status.BAD_REQUEST, "text/plain", "Invalid keybox source")
                          if (source.file.delete()) {
                              if (source.isCbox) {
                                  Files.deleteIfExists(File(source.file.parentFile, "${source.filename}.cache").toPath())
                                  CboxManager.refresh()
                              }
                              if (!updateKeyboxesFromConfiguredRevocationSource()) return keyboxActivationFailureResponse()
                              return secureResponse(Response.Status.OK, "text/plain", "Deleted")
                          }
                          return secureResponse(Response.Status.INTERNAL_ERROR, "text/plain", "Failed to delete file")
                      }
                  }
                  return secureResponse(Response.Status.BAD_REQUEST, "text/plain", "Invalid filename")
              }

              if (uri == "/api/delete_keyboxes" && method == Method.POST) {
                  val map = HashMap<String, String>()
                  try {
                      session.parseBody(map)
                  } catch (error: Exception) {
                      return secureResponse(Response.Status.BAD_REQUEST, "text/plain", "Failed to parse body")
                  }
                  val rawItems = getParam(session, "items")
                      ?: return secureResponse(Response.Status.BAD_REQUEST, "text/plain", "Missing items")
                  return synchronized(fileLock) {
                      try {
                          val items = JSONArray(rawItems)
                          if (items.length() !in 1..StoredKeyboxInventory.MAX_STORED_SOURCES) {
                              return@synchronized secureResponse(Response.Status.BAD_REQUEST, "text/plain", "Invalid item count")
                          }
                          var deleted = 0
                          var failed = 0
                          var cboxChanged = false
                          for (index in 0 until items.length()) {
                              val item = items.optJSONObject(index)
                              val filename = item?.optString("filename").orEmpty()
                              val scope = item?.optString("scope").orEmpty()
                              val source = StoredKeyboxInventory.resolve(configDir, scope, filename)
                              if (source == null || !source.file.delete()) {
                                  failed++
                                  continue
                              }
                              deleted++
                              if (source.isCbox) {
                                  Files.deleteIfExists(File(source.file.parentFile, "${source.filename}.cache").toPath())
                                  cboxChanged = true
                              }
                          }
                          if (cboxChanged) CboxManager.refresh()
                          if (!updateKeyboxesFromConfiguredRevocationSource()) return@synchronized keyboxActivationFailureResponse()
                          secureResponse(
                              if (failed == 0) Response.Status.OK else Response.Status.INTERNAL_ERROR,
                              "application/json",
                              JSONObject().put("deleted", deleted).put("failed", failed).toString(),
                          )
                      } catch (error: Exception) {
                          Logger.e("Failed to bulk-delete keyboxes", error)
                          secureResponse(Response.Status.BAD_REQUEST, "text/plain", "Invalid keybox selection")
                      }
                  }
              }

              if (uri == "/api/verify_keyboxes" && method == Method.POST) {''',
          )
          replace_once(
              web,
              '                obj.put("filename", r.filename)\n',
              '''                obj.put("filename", r.filename)
                      obj.put("storage_id", r.storageId)
                      obj.put("certificate_serial", r.certificateSerial ?: "")
          ''',
          )

          # Module ZIP import limit follows module runtime, while the app vault remains 10,000.
          ux = 'module/template/webroot/ux.js'
          text = read(ux)
          if text.count('const MAX_SUPPORTED_FILES = 10000;') != 1:
              raise SystemExit('ux.js: expected one module ZIP max')
          text = text.replace('const MAX_SUPPORTED_FILES = 10000;', 'const MAX_SUPPORTED_FILES = 64;', 1)
          text = text.replace('const MAX_ARCHIVE_ENTRIES = 20000;', 'const MAX_ARCHIVE_ENTRIES = 256;', 1)
          replacements = {
              'more than 10000 supported XML/CBOX files': 'more than 64 supported XML/CBOX files',
              '10000 adetten fazla desteklenen XML/CBOX dosyası': '64 adetten fazla desteklenen XML/CBOX dosyası',
              '受支持的 XML/CBOX 文件超过 10000 个': '受支持的 XML/CBOX 文件超过 64 个',
              'más de 10000 archivos XML/CBOX compatibles': 'más de 64 archivos XML/CBOX compatibles',
              'mehr als 10000 unterstützte XML/CBOX-Dateien': 'mehr als 64 unterstützte XML/CBOX-Dateien',
              'больше 10000 поддерживаемых XML/CBOX-файлов': 'больше 64 поддерживаемых XML/CBOX-файлов',
