version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      bouncycastle-security:
        applies-to: security-updates
        patterns:
          - "org.bouncycastle:*"
      bouncycastle:
        applies-to: version-updates
        patterns:
          - "org.bouncycastle:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    # Keep Cargo manifests moving forward with upstream releases, including
    # semver-breaking major/minor transitions. CI is the compatibility gate;
    # breaking dependency APIs are migrated in source instead of being ignored.
    versioning-strategy: "increase"
    groups:
      storage-crypto-stack:
        applies-to: version-updates
        patterns:
          - "aes-gcm"
          - "getrandom"
          - "pbkdf2"
      signing-x509-stack:
        applies-to: version-updates
        patterns:
          - "der"
          - "p256"
          - "rsa"
          - "sha2"
          - "signature"
          - "x509-cert"
