# Additional GPLv3 section 7(b) attribution term for tryigit-owned material: see ../../NOTICE.
[package]
name = "cleverestricky-certificate-core"
version = "0.1.0"
edition = "2021"
description = "Bounded X.509 attestation rewrite and signing core for CleveresTricky"
license = "GPL-3.0-only"
publish = false

[lib]
path = "src/entry.rs"

[dependencies]
attestation-der = { package = "der", version = "*", features = ["alloc", "oid", "pem"] }
cleverestricky-attestation-core = { path = "../attestation-core" }
p256 = { version = "*", features = ["ecdsa", "pkcs8"] }
rsa = { version = "*", features = ["sha2"] }
rsa-sha2 = { package = "sha2", version = "=0.10.9", features = ["oid"] }
rsa-signature = { package = "signature", version = "=2.2.0" }
sha2 = { version = "*", features = ["oid"] }
signature = "*"
x509-cert = { version = "*", default-features = false, features = ["pem", "std"] }
zeroize = "*"
getrandom = { workspace = true }

[dev-dependencies]
cleverestricky-keybox-core = { path = "../keybox-core" }
cleverestricky-xml-core = { path = "../xml-core" }
criterion = { workspace = true }

[[bench]]
name = "certificate_bench"
harness = false

[lints.rust]
unsafe_code = "forbid"
