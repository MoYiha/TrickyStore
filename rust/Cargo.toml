[workspace]
members = [
    "attestation-core",
    "backend",
    "cbox-recovery-core",
    "certificate-core",
    "crl-core",
    "crypto-core",
    "daemon",
    "encryptor-native",
    "injector-core",
    "integrity-core",
    "keybox-core",
    "native-core",
    "policy-config-core",
    "service-core",
    "webui-bridge",
    "xml-core"
]
resolver = "2"

[workspace.dependencies]
# API-coupled storage crypto lane. Workspace members share one floating
# requirement so no crate lags on an older incompatible crypto stack.
# The committed Cargo.lock pins actual builds; the monthly maintenance
# report refreshes it to newest releases.
aes-gcm = { version = "*", features = ["zeroize"] }
getrandom = "*"
pbkdf2 = { version = "*", features = ["sha2"] }
criterion = { version = "*", features = ["html_reports"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "unwind"
