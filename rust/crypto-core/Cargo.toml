# Additional GPLv3 section 7(b) attribution term for tryigit-owned material: see ../../NOTICE.
[package]
name = "cleverestricky-crypto-core"
version = "0.1.0"
edition = "2021"
description = "Bounded CBOX and backup cryptography for CleveresTricky"
license = "GPL-3.0-only"

[dependencies]
aes-gcm = { workspace = true }
base64 = "*"
getrandom = { workspace = true }
p256 = { version = "*", features = ["ecdsa", "pkcs8"] }
pbkdf2 = { workspace = true }
rsa = { version = "*", features = ["sha2"] }
rsa-sha2 = { package = "sha2", version = "=0.10.9", features = ["oid"] }
rsa-signature = { package = "signature", version = "=2.2.0" }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
sha2 = { version = ">=0.11", features = ["oid"] }
signature = ">=3"
zeroize = { version = "*", features = ["derive"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "crypto_bench"
harness = false
