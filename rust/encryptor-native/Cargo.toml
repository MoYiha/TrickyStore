[package]
name = "cleverestricky-encryptor-native"
version = "0.1.0"
edition = "2021"
description = "Rust CBOX encryption and secure vault bridge for the CleveresTricky Android companion app"
license = "GPL-3.0-only"

[lib]
name = "cleveres_encryptor_crypto"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { workspace = true }
getrandom = { workspace = true }
jni = { version = "*", default-features = false }
pbkdf2 = { workspace = true }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
sha2 = "*"
zeroize = { version = "*", features = ["derive"] }
cleverestricky-service-core = { path = "../service-core" }
cleverestricky-xml-core = { path = "../xml-core" }

[dev-dependencies]
cleverestricky-crypto-core = { path = "../crypto-core" }
