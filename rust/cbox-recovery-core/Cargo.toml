[package]
name = "cleverestricky-cbox-recovery-core"
version = "0.1.0"
edition = "2021"
description = "Source-bound CBOX recovery-key derivation and decryption"
license = "GPL-3.0-only"

[dependencies]
aes-gcm = { workspace = true }
cleverestricky-crypto-core = { path = "../crypto-core" }
pbkdf2 = { workspace = true }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
sha2 = "*"
zeroize = "*"

[dev-dependencies]
base64 = "*"
