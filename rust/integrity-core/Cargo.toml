[package]
name = "cleverestricky-integrity-core"
version = "0.1.0"
edition = "2021"
description = "Runtime module integrity verification for CleveresTricky"
license = "GPL-3.0-only"

[dependencies]
hmac = "*"
sha2 = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
libc = "*"
zeroize = { version = "*", features = ["zeroize_derive"] }
ed25519-dalek = { version = "*", default-features = false, features = ["fast", "zeroize"] }

[dev-dependencies]
tempfile = "*"
