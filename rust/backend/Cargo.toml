# Additional GPLv3 section 7(b) attribution term for tryigit-owned material: see ../../NOTICE.
[package]
name = "cleverestricky-backend"
version = "0.1.0"
edition = "2021"
description = "Unprivileged bounded backend process for CleveresTricky"
license = "GPL-3.0-only"

[[bin]]
name = "cleverestricky_backend"
path = "src/main.rs"

[dependencies]
base64 = "*"
cleverestricky-cbox-recovery-core = { path = "../cbox-recovery-core" }
cleverestricky-certificate-core = { path = "../certificate-core" }
cleverestricky-crl-core = { path = "../crl-core" }
cleverestricky-crypto-core = { path = "../crypto-core" }
cleverestricky-keybox-core = { path = "../keybox-core" }
cleverestricky-service-core = { path = "../service-core" }
cleverestricky-xml-core = { path = "../xml-core" }
x509-der = { package = "der", version = "*", features = ["alloc", "oid"] }
getrandom = { workspace = true }
libc = "*"
sha2 = "*"
x509-cert = { version = "*", default-features = false, features = ["std"] }
zeroize = "*"

[dev-dependencies]
base64 = "*"
